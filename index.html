057","title":"Levels and distribution of organophosphorus flame retardants and plasticizers in fishes from Manila Bay, the Philippines ","releaseDate":"2017/12/20","doi":"10.1016/j.envpol.2011.07.020","author":"Tomohiko Isobe","affiliation":"National Institute for Environmental Studies","abstract":"Organophosphorus compounds (OPCs) and stable isotope ratios (δ<sup>13</sup>C and δ<sup>15</sup>N) were determined in 58 fishes belonging to 20 species collected from Manila Bay, the Philippines. OPCs were detected in most of the samples and found up to μg/g lw (lipid weight) level, suggesting their ubiquitous presence in the coastal marine environment of the Philippines. Higher levels (>1000 ng/g lw) of total OPCs were determined in yellowstriped goatfish, silver sillago, tripletail wrasse and bumpnose trevally indicates either their active uptake from ambient water or lower metabolic capacity of these species. Levels of triphenyl phosphate (TPhP) in demersal species showed a positive correlation with δ<sup>15</sup>N, indicating that TPhP was adsorbed onto the particle, settled down to the bottom sediment and accumulated through the benthic food web rather than the pelagic. Estimated dietary intake of OPCs in Manila Bay fishes were four to five orders of magnitude lower than the proposed reference dose (RfD). ","grant":"Grants-in-Aid for Scientific Research (S: 20221003, B: 21310043), Young Scientist (B: 23710077) and Global COE Program of the Japanese Ministry of Education, Science, Sports, Culture and Technology (MEXT) and Japan Society for the Promotion of Science (JSPS), MEXT program (Promotion of Environmental Improvement for Independence of Young Researchers) under the Special Coordination Funds for Promoting Science and Technology"},"PRA000025":{"id":"PRA000025","title":"Comparison of Trophic Magnification Slopes of Mercury in Temperate and Tropical Regions Case Studies on the Oregon Coast, USA, Sanriku Coast, Japan, and Jakarta Bay, Indonesia","releaseDate":"2017/02/23","doi":"10.1246/cl.150579","author":"Takaaki Itai","affiliation":"The Uniersity of Tokyo","abstract":"The trophic magnification slope (TMS) of mercury has been reported from >130 aquatic systems in the world. However, data from the Asia-Pacific region is quite lacking despite the need for estimation of Hg exposure via fish consumption in many of those regions in the world. Here we provide TMS values from three marine regions in the Pacific rim, Oregon coast, USA, Sanriku coast, Japan, and Jakarta Bay, Indonesia. A decreasing trend of TMS from temperate to tropical regions was found in this study.","grant":"Global COE program from the Ministry of Education, Culture, Sports, Science and Technology, Japan (MEXT)"},"PRA000045":{"id":"PRA000045","title":"Distribution characteristics of volatile methylsiloxanes in Tokyo Bay watershed in Japan: Analysis of surface waters by purge and trap method","releaseDate":"2017/09/13","doi":"10.1016/j.scitotenv.2017.02.014","author":"Yuichi Horii","affiliation":"Center for Environmental Science in Saitama","abstract":"Surface waters including river water and effluent from sewage treatment plants (STPs) were collected from Tokyo Bay watershed, Japan, and analyzed for seven cyclic and linear volatile methylsiloxanes (VMSs), i.e., D3, D4, D5, D6, L3, L4, and L5 by an optimized purge and trap extraction method. The total concentrations of seven VMSs (ΣVMS) in river water ranged from <4.9 to 1700 ng/L (mean: 220 ng/L). The individual mean concentrations of cyclic VMSs in surface waters were; 10 ng/L for D3, 13 ng/L for D4, 180 ng/L for D5, and 18 ng/L for D6. The concentrations of ΣVMS determined in STP effluents varied widely from 99 to 2500 ng/L and the individual mean concentrations were 21 ng/L for D3, 27 ng/L for D4, 540 ng/L for D5, and 45 ng/L for D6. D5, which is widely used in personal-care products, was found to be the most abundant compound in both river water and STP effluent. Linear VMSs were detected at much lower frequency and concentrations than those of cyclic VMSs. The measured concentrations of D4 were below the no-observed effect concentration (NOEC). The annual emission of ΣVMS through STPs into Tokyo Bay watershed was estimated at 2300 kg. Our results indicate widespread distribution of VMSs in Tokyo Bay watershed and the influence of domestic wastewater discharges as a source of VMSs in the aquatic environment.","grant":"Partly supported by the Environment Research and Technology Development Fund (#5RFb-1202) from the Ministry of the Environment, Japan and JSPS KAKENHI (#JP16K16189) from Japan Society for the Promotion of Science (JSPS)"},"PRA000032":{"id":"PRA000032","title":"Organohalogen contaminants in striped dolphins (<i>Stenella coeruleoalba</i>) from Japan: Present contamination status, body distribution and temporal trends (1978 - 2003)","releaseDate":"2017/06/09","doi":"10.1016/j.marpolbul.2008.10.008","author":"Shinsuke Tanabe","affiliation":"Ehime University","abstract":"Organohalogen contaminants including PCBs, DDTs, CHLs, HCHs, HCB, PBDEs and HBCDs were determined in striped dolphins (<i>Stenella coeruleoalba</i>) found stranded at Gogo-shima (n = 6, 2003) and collected from Taiji (n = 15, 1978-1992) in Japan. All target compounds were significantly detected in all the specimens, indicating ubiquitous contamination of oceanic cetaceans in northwest Pacific Ocean. Examination of body distribution of organohalogens in the six specimens from Gogo-shima showed no significant difference in concentrations among the analyzed tissues, except for brain, which had lower levels possibly due to the existence of blood-brain barrier. For evaluating temporal trends, archived blubber samples of adult male stripped dolphins collected in 1978, 1979, 1986 and 1992 were analyzed. Concentrations of PCBs, DDTs and HCHs did not change significantly during 1978-2003. In contrast, remarkable increasing trends of PBDEs and HBCDs were observed, suggesting growing consumption in Japan and surrounding countries in recent years.","grant":"Grant-in-Aid for Scientific Research (S: 20221003, B: 18310046), for Young Scientists (B: 19780239), and Global COE program of the Japanese Ministry of Education, Science, Sports, Culture and Technology and Japan Society for the Promotion of Science"},"PRA000040":{"id":"PRA000040","title":"Occurrence of emerging flame retardants from e-waste recycling activities in the northern part of Vietnam","releaseDate":"2017/07/05","doi":"10.1016/j.emcon.2015.10.002","author":"Masayuki Someya","affiliation":"Tokyo Metropolitan Research Institute for Environmental Protection","abstract":"This study investigated the contamination status of 21 emerging flame retardants (FRs) in soils (n = 32) and river sediments (n = 8) from an e-waste recycling (EWR) site in the northern part of Vietnam. Among analyzed FRs, higher levels of decabromodiphenyl ethane (DBDPE) (ND - 4200 ng/g dw), 1,2-bis-(2,4,6-tribromophenoxy)ethane (BTBPE) (ND - 350 ng/g dw) and Dechlorane Plus isomers (DPs) (ND - 65 ng/g dw) were found in soils near EWR workshops and open burning places. The highest concentrations of DBDPE (20 ng/g dw), BTBPE (5.7 ng/g dw) and DPs (6.7 ng/g dw) were also detected in sediments collected from the middle of the EWR site. The levels decreased concomitantly with increasing distance from the EWR site. These results indicate that these FRs were released to the surrounding environment from improper recycling activities, such as manual dismantling of devices and open burning of e-wastes. Moreover, the estimated daily intakes of those FRs via soil ingestion were approximately ten times higher for children than adults. To our knowledge, this is a first comprehensive study on characterization of soil and sediment contamination by a series of emerging FRs at an EWR site in Vietnam.","grant":"the European Union Seventh Framework Program FP7/2007-2013 project INTERFLAME under grant agreement no. 295138, Grants-in-Aid for Young Scientists (A) (no. 23681011) and Scientific Research (A) (no. 25257403) from the Japan Society for the Promotion of Science (JSPS) and Environment Research and Technology Development Fund (no. 3K133010) of the Ministry of the Environment, Japan, the JSPS Research Fellowships for Young Scientists (PD) in Japan provided to Mr. M. Someya (no. 201105410) and the European Union Seventh Framework Program (FP7/2007-2013) under grant agreement no 264600 (INFLAME project) for the scholarship provided to Mr. A.C. Ionas."},"PRA000071":{"id":"PRA000071","title":"Analysis of PCDDs, PCDFs, planar and other PCBs in seaweed from Japanese coast","releaseDate":"2018/06/25","doi":"10.1016/0045-6535(95)00261-6","author":"Shunji Hashimoto","affiliation":"National Institute for Environmental Studies","abstract":"PCDDs, PCDFs, planar and other PCBs were analyzed by high resolution GC-MS in four species of seaweed collected from Japanese coast. Two different methods were examined for sample extraction. Soxhlet extraction from dried sample (method I) gave higher recovery than extraction from alkaline digested wet sample (method 2). PCDDs and related compounds were detected from all samples. It was suggested that seaweed analyzed in this study were contaminated by PCDDs and PCDFs of industrial origin such as combustion source, and the presence of natural dioxin could not be ascertained.","grant":null},"PRA000027":{"id":"PRA000027","title":"Exposure assessment of lead to workers and children in the battery recycling craft village, Dong Mai, Vietnam","releaseDate":"2017/02/27","doi":"10.1007/s10163-013-0159-0","author":"Takaaki Itai","affiliation":"The Uniersity of Tokyo","abstract":"Human exposure to lead (Pb) due to uncontrolled Pb-acid battery recycling has been an environmental health issue in newly developed industrial regions. We conducted a human monitoring survey in Dong Mai, a battery recycling village in Vietnam, to assess exposure status to Pb. Lead level was measured in hair, blood and urine samples of residents in Dong Mai and two reference sites during 4 years spanning 2007-2011. In Dong Mai, Pb levels in three matrixes were significantly higher than those in reference sites. Blood Pb levels of all adults and children exceeded 10 µg/dL, the Centers for Disease Control and Prevention definition of an elevated blood Pb level. Clear increase of urinary delta-aminolevulinic acid (ALA) level with increasing blood Pb level indicated disruption of heme synthesis. One adult exceeded 100 µg/dL of blood Pb, where encephalopathy is of concern. The blood Pb levels achieved various toxic effect threshold values, and elevated blood Pb was not limited to recycling workers, but was also in children and women of reproductive age. Serious pollution status of Dong Mai village suggests an importance of further monitoring surveys in various developing Asian countries.","grant":"Grants-in-Aid for Scientific Research (A) (No. 25257403), Global COE Program and Project for the Encouragement of Science/Math-Oriented University Students from the Ministry of Education, Culture, Sports, Science and Technology, Japan (MEXT) and Japan Society for the Promotion of Science (JSPS) and Waste Management Research Grant (K123001) from the Ministry of Environment, Japan"},"PRA000101":{"id":"PRA000101","title":"Coastal biomonitoring survey on persistent organic pollutants using oysters (<I>Saccostrea mordax</I>) from Okinawa, Japan: geographical distribution and polystyrene foam as a potential source of hexabromocyclododecanes","releaseDate":"2020/06/08","doi":"10.1016/j.scitotenv.2020.140049","author":"Tatsuya Kunisue","affiliation":"Ehime University","abstract":"The present study determined contamination levels of POPs, such as polychlorinated biphenyls (PCBs), dichlorodiphenyltrichloroethane and its metabolites (DDTs), chlordane compounds (CHLs), polybrominated diphenyl ethers (PBDEs) and hexabromocyclododecanes (HBCDs), in oysters (<i>Saccostrea mordax</i>) collected throughout the seacoast of Okinawa, Japan and their geographic distribution. PCBs, DDTs, CHLs, PBDEs and HBCDs were detected in almost all the oyster samples analyzed and higher concentrations of PCBs, DDTs and CHLs were found in oysters from southwestern populated areas. On the other hand, HBCDs in oysters showed similar levels throughout Okinawa and the highest concentration in a northern rural site with less human and industrial activities, although oyster concentrations of PBDEs were relatively lower. When POPs in expanded polystyrene (EPS) buoys and polystyrene foam debris floated and drifted on coastal seawater were analyzed, extremely high concentrations of HBCDs were detected in some of these EPS buoys and polystyrene foam debris but other POPs were below the limit of detection in all the samples. To evaluate the specific exposure route of HBCDs for oysters, we further analyzed HBCD diastereomers, and PCB congeners by way of comparison, in seawater and sediment samples collected at an urban site and a rural site and estimated their biota (oyster)-sediment accumu- lation factors (BSAF) and bioaccumulation factors (BAF). Interestingly, the highest log BAF values were found for α-HBCD despite its lower log Kow than those of γ-HBCD and PCB congeners, although log BSAF values for HBCDs were comparable to or lower than those for PCBs. Considering that α-HBCD was detected in a few polystyrene foam samples as the predominant diastereomer, oysters inhabiting the coastal region of Okinawa might be frequently exposed to micronized polystyrene foam particles containing HBCDs.","grant":"Grant-in-Aid for Scientific Research A (19H01167) from Japan Society for the Promotion of Science (JSPS); The Ministry of Education, Culture, Sports, Science and Technology, Japan (MEXT) to a project on Joint Usage/Research Center - Leading Academia in Marine and Environment Pollution Research (LaMer)"},"PRA000050":{"id":"PRA000050","title":"Distributions of polycyclic aromatic hydrocarbons and alkylated polycyclic aromatic hydrocarbons in Osaka Bay, Japan","releaseDate":"2017/11/08","doi":"10.1016/j.marpolbul.2014.04.004","author":"Seiichi Uno","affiliation":"Kagoshima University","abstract":"Contaminations in sediments by polycyclic aromatic hydrocarbons (PAHs) and alkylated PAHs were investigated at 44 sites in Osaka Bay, Japan. Concentrations of total PAHs and alkylated PAHs were in the range 6.40-7800 ng/g dry weights and 13.7-1700 ng/g dry weights, respectively. The PAH concentrations tended to be higher along the shoreline in the vicinities of big ports, industrialized areas, and densely populated regions such as the cities of Osaka and Kobe. The major sources appeared to be pyrogenic or both pyrogenic and petrogenic at most of the sites. PAH concentrations were remarkably high at a site near Kobe, where the concentrations of　dibenzo(a,h)anthracene and benzo(g,h,i)perylene exceeded the effects-range-medium concentration and eight PAHs were above the corresponding effects-range-low concentrations. Those PAHs may have been derived from the great fire associated with the large earthquake in 1995.","grant":"Grant-in-Aid-for Young Scientists (B) from the Japan Society for the Promotion of Science (JSPS), and the Development Fund: Research on Dynamics of Nitroarenes in Inner Bay Region and Influence on Marine Organisms from the Ministry of the Environment, Japan "},"PRA000097":{"id":"PRA000097","title":"[MOE_JP] The Initial Environmental Survey in FY2017 (Source: FY2018 Report of Chemicals in the Environment<a href=https://www.env.go.jp/chemi/kurohon/en/http2018e/index.html target=_blank> English </a>/<a href=https://www.env.go.jp/chemi/kurohon/2018/index.html target=_blank> Japanese </a>)","releaseDate":"2019/09/13","doi":null,"author":"Open data","affiliation":"Ministry of the Environment","abstract":null,"grant":null},"PRA000039":{"id":"PRA000039","title":"Perchlorate contamination of groundwater from fireworks manufacturing area in South India","releaseDate":"2017/08/10","doi":"10.1007/s10661-012-2972-7","author":"Tomohiko Isobe","affiliation":"National Institute for Environmental Studies","abstract":"Perchlorate contamination was investigated in groundwater and surface water from Sivakasi and Madurai in the Tamil Nadu State of South India. Sensitive determination of perchlorate (LOQ=0.005 μg/L) was achieved by large-volume (500 μL) injection ion chromatography coupled with tandem mass spectrometry. Concentrations of perchlorate were <0.005-7,690 μg/L in groundwater (n=60), <0.005-30.2 μg/L in surface water (n=11), and 0.063-0.393 μg/L in tap water (n=3). Levels in groundwater were significantly higher in the fireworks factory area than in the other locations, indicating that the fireworks and safety match industries are principal sources of perchlorate pollution. This is the first study that reports the contamination status of perchlorate in this area and reveals firework manufacture to be the pollution source. Since perchlorate levels in 17 out of 57 groundwater samples from Sivakasi, and none from Madurai, exceeded the drinking water guideline level proposed by USEPA (15 μg/ L), further investigation on human health is warranted.","grant":"Grant-in-Aid for Scientific Research (S: 20221003), for Challenging Exploratory Research (24651010) and for Young Scientist (B: 23710077) from Japan Society of the Promotion of Science, Promotion of Environmental Improvement for Independence of Young Researchers under the Special Coordination Funds for Promoting Science and Technology by the Ministry of Education, Culture, Sports, Science and Environment Research and Technology Development Fund (ZRFc1201) of the Japanese Ministry of the Environment."},"PRA000067":{"id":"PRA000067","title":"[MOE_JP] The Detailed Environmental Survey in FY2015  (Source: FY2016 Report of Chemicals in the Environment<a href=https://www.env.go.jp/chemi/kurohon/en/http2016e/index.html target=\"_blank\"> English </a>/<a href=https://www.env.go.jp/chemi/kurohon/2016/index.html target=\"_blank\"> Japanese </a>)","releaseDate":"2018/05/08","doi":null,"author":"Open data","affiliation":"Ministry of the Environment","abstract":null,"grant":null},"PRA000016":{"id":"PRA000016","title":"Soil contamination by brominated flame retardants in open waste dumping sites in Asian developing countries","releaseDate":"2016/12/12","doi":"10.1016/j.chemosphere.2012.10.027","author":"Shinsuke Tanabe","affiliation":"Ehime University","abstract":"In Asian developing countries, large amounts of municipal wastes are dumped into open dumping sites each day without adequate management. This practice may cause several adverse environmental consequences and increase health risks to local communities. These dumping sites are contaminated with many chemicals including brominated flame retardants (BFRs) such as polybrominated diphenyl ethers (PBDEs) and hexabromocyclododecanes (HBCDs). BFRs may be released into the environment through production processes and through the disposal of plastics and electronic wastes that contain them. The purpose of this study was to elucidate the status of BFR pollution in municipal waste dumping sites in Asian developing countries. Soil samples were collected from six open waste dumping sites and five reference sites in Cambodia, India, Indonesia, Malaysia, and Vietnam from 1999 to 2007. The results suggest that PBDEs are the dominant contaminants in the dumping sites in Asian developing countries, whereas HBCD contamination remains low. Concentrations of PBDEs and HBCDs ranged from ND to 180 µg/kg dry wt and ND to 1.4 µg/kg dry wt, respectively, in the reference sites and from 0.20 to 430 µg/kg dry wt and ND to 2.5 µg/kg dry wt, respectively, in the dumping sites. Contamination levels of PBDEs in Asian municipal dumping sites were comparable with those reported from electronic waste dismantling areas in Pearl River delta, China.","grant":"Global COE Program, Grants-in-Aid for Scientific Research (S) (No. 20221003) from the Ministry of Education, Culture, Sports, Science and Technology, Japan (MEXT) and Japan Society for the Promotion of Science (JSPS) and the Waste Management Research Grant (K2062, K2129, K2121) from the Ministry of Environment, Japan, the JSPS Research Fellowships for Young Scientists (DC1) in Japan provided to Mr. A. Eguchi (226331)."},"PRA000117":{"id":"PRA000117","title":"Assessment of the risk posed by three antifouling biocides to Pacific oyster embryos and larvae in Hiroshima Bay, Japan","releaseDate":"2021/12/14","doi":"10.1007/s11356-021-16346-4","author":"Toshimitsu Onduka","affiliation":"Japan Fisheries Research and Education Agency","abstract":"The Pacific oyster (<i>Crassostrea gigas</i>) is an important species in oyster farming worldwide, including in Japan. Hiroshima Bay is one of the most important oyster farming areas in Japan. We investigated the occurrence of antifouling biocides used worldwide including diuron, Irgarol 1051 (Irgarol), and 4,5-dichloro-2-n-octyl-4-isothiazolin-3-one (DCOIT), which have been detected at sub-ppb levels in seawater in Japan, and estimated their no observed effect concentrations (NOECs). In recent years, the spat settlement of Pacific oysters has become poor, which presents a challenge for oyster aquaculture in Hiroshima Bay; hence, we conducted embryotoxicity and larva settlement tests using Pacific oysters. Compared to diuron and Irgarol, DCOIT exhibited a higher toxicity toward oyster embryos, and the minimum 24-h NOEC toxicity value for the oyster embryos was <3 ng/L. The highest concentrations of diuron, Irgarol, and DCOIT in the environmental seawater in the Seto Inland Sea were 27.6, 3.2, and 24 ng/L, respectively. Considering the NOECs, the environmental concentrations of these biocides suggest that the ecological risks posed by diuron and Irgarol are low, whereas those posed by DCOIT are high. However, the rate of detection of DCOIT was low because it degraded rapidly in the seawater before treatment for chemical analysis, except in the case of the treatment on the research vessel.","grant":"A grant-in-aid from the National Research Institute of Fisheries and Environment of Inland Sea (present name: Hatsukaichi Branch, Fisheries Technology Institute), Japan Fisheries Research and Education Agency  (Partly supported)"},"PRA000063":{"id":"PRA000063","title":"Contamination of benzotriazole ultraviolet stabilizers in house dust from the Philippines: Implications on human exposure","releaseDate":"2018/03/23","doi":"10.1016/j.scitotenv.2012.02.040","author":"Tomohiko Isobe","affiliation":"National Institute for Environmental Studies","abstract":"Seven compounds of benzotriazole ultraviolet stabilizers (BUVSs) were determined in house dust samples collected from a residential area (Malate: n=17) and municipal dumping area (Payatas: n=20) in the Philippines. Total concentrations of the 7 BUVSs in house dust ranged from ND (not detected) to 1020 ng/g in Malate and ND to 277 ng/g in Payatas. Among the target compounds, the most abundant BUVS was UV-234, with a median value of 84 ng/g (ND-813 ng/g) in Malate and 41 ng/g (ND-212 ng/g) in Payatas, respectively. Significantly higher concentrations of UV-326 (pb0.01) and UV-327 (pb0.05) were found in house dust samples from Malate than those from Payatas, suggesting that the household prod- ucts are the major sources of contamination in the indoor microenvironment. The estimated daily intakes (EDIs) of BUVSs through house dust ingestion in the Philippines were two to four orders of magnitude lower than the guideline values. However, the EDI of 5 BUVSs for toddlers in this study was 5 times higher than those for adults, suggesting that toddlers are at higher risk. House dust may be an important exposure route of UV-234 (88%) and UV-326 (69%) in worst-case scenarios, which using high dust ingestion and worst-case exposure (P95). To our knowledge, this is the first comprehensive study on BUVSs in house dust samples from Asian developing countries and reporting the occurrence of UV-234 and UV-320 in dust samples.","grant":"Grants-in-Aid for Scientific Research (S: 20221003), Young Scientist (B: 23710077) and Global COE Program of the Japanese Ministry of Education, Science, Sports, Culture and Technology (MEXT) and Japan Society for the Promotion of Science (JSPS), MEXT program: Promotion of Environmental Improvement for Independence of Young Researchers under the Special Coordination Funds for Promoting Science and Technology and The Environment Research and Technology Development Fund (ZRFc-1201) of the Japanese Ministry of the Environment"},"PRA000062":{"id":"PRA000062","title":"Organophosphorus flame retardants in house dust from the Philippines: occurrence and assessment of human exposure","releaseDate":"2018/03/20","doi":"10.1007/s11356-012-1237-x","author":"Tomohiko Isobe","affiliation":"National Institute for Environmental Studies","abstract":"The use of organophosphorus flame retardants (PFRs) as flame retardants and plasticizers has increased due to the ban on common polybrominated diphenyl ether mixtures. However, only limited information on PFR contamination is available so far from Southeast Asia. In the present study, residual levels of PFRs in house dust and exposure through dust ingestion were investigated in the Philippines. House dust samples (n=37) were collected from Malate (residential area) and Payatas (municipal dumping area) in the Philippines and analyzed using ultra-high-performance liquid chromatography coupled with tandem mass spectrometry. Among the targeted seven PFRs, triphenyl phosphate (TPP) was the predominant compound. Median levels of ΣPFRs in Malate (530 ng/g) were two times higher (p < 0.05) than in Payatas (240 ng/g). The estimated daily intake of PFRs in the Philippines (of areas studied) via house dust ingestion was below the guideline values. House dust may be an important contributor in the overall exposure of humans to TPP even when considering dietary sources. To our knowledge, this is a first report on PFR contamination in house dust from developing country. PFRs were ubiquitously detected in the home environments in the Philippines. Although estimated exposure levels through dust ingestion were below the guideline, it was suggested that toddlers are at higher risk. Therefore, further investigations to understand the behavior of PFRs in house and other microenvironments and overall exposure pathways for the country’s populace to PFRs are necessary.","grant":"Grants-in-Aid for Scientific Research (S: 20221003, B: 21310043) and for Young Scientist (B: 23710077) of the Japanese Ministry of Education, Science, Sports, Culture and Technology (MEXT) and Japan Society for the Promotion of Science (JSPS) and the Environment Research and Technology Development Fund (ZRFc-1201) of the Japanese Ministry of the Environment and MEXT program: Promotion of Environmental Improvement for Independence of Young Researchers under the Special Coordination Funds for Promoting Science and Technology."},"PRA000126":{"id":"PRA000126","title":"[MOE_JP] Japanese Nationwide Survey on Existence of PFOS and PFOA in FY2020 (Source: MOE Press Release: Result of FY2020 National Survey on Existence of PFOS and PFOA dated June 22, 2021 <a href=https://www.env.go.jp/press/109708.html target=_blank> Japanese </a>)","releaseDate":"2023/03/23","doi":null,"author":"Open data","affiliation":"Ministry of the Environment","abstract":null,"grant":null},"PRA000059":{"id":"PRA000059","title":"Occurrence of Natural Mixed Halogenated Dibenzo-p-Dioxins: Specific Distribution and Profiles in Mussels from Seto Inland Sea, Japan","releaseDate":"2018/01/26","doi":"10.1021/acs.est.7b03738","author":"Tatsuya Kunisue","affiliation":"Ehime University","abstract":"In addition to unintentional formation of polychlorinated (PCDD/Fs), polybrominated (PBDD/Fs), and mixed halogenated (PXDD/Fs) dibenzo-p-dioxins/dibenzofurans during industrial activities, recent studies have shown that several PBDD and PXDD congeners can be produced by marine algal species from the coastal environment. However, multiple exposure status of anthropogenic and naturally derived dioxins in marine organisms remains unclear. The present study examined the occurrence, geographical distribution, and potential sources of PCDD/Fs, PBDD/Fs, and PXDD/Fs using mussels and brown algae collected in 2012 from Seto Inland Sea, Japan. The results showed the widespread occurrence of not only PCDD/Fs but also PBDDs and PXDDs in Seto Inland Sea. The geographical distribution pattern of PBDDs was similar to that of PXDDs, which were obviously different from that of PCDDs and PCDFs, and a significant positive correlation was observed between the levels of their predominant congeners, i.e., 1,3,7-/1,3,8-TrBDDs and DiBMoCDDs. Interestingly, potential precursors of 1,3,7-/1,3,8- TrBDDs and DiBMoCDDs, hydroxylated tetrabrominated diphenyl ethers (6-HO-BDE-47 and 2'-HO-BDE-68) and their mixed halogenated analogue (HO-TrBMoCDE), were also identified in the mussel and brown alga samples collected at the same site, by comprehensive two-dimensional gas chromatography with time-of-flight mass spectrometry (GC × GC−ToFMS) analyses. It is noteworthy that residue levels of 1,3,7-/1,3,8-TrBDDs and DiBMoCDDs in the mussel were 30 times higher than those in the brown alga, suggesting the bioaccumulation of these natural dioxins.","grant":"Grants-in-Aid for Scientific Research (A) (16H01784) and (B) (16H02963) from Japan Society for the Promotion of Science (JSPS) and by the Ministry of Education, Culture, Sports, Science and Technology, Japan (MEXT) to a project on Joint Usage/ Research Center - Leading Academia in Marine and Environment Pollution Research (LaMer)."},"PRA000056":{"id":"PRA000056","title":"Contamination and bioaccumulation of benzotriazole ultraviolet stabilizers in fish from Manila Bay, the Philippines using an ultra-fast liquid chromatography_tandem mass spectrometry","releaseDate":"2017/12/25","doi":"10.1016/j.chemosphere.2011.06.054","author":"Tomohiko Isobe","affiliation":"National Institute for Environmental Studies","abstract":"Benzotriazole ultraviolet stabilizers (BUVSs) used in plastic products, building materials and personal hygiene products were analyzed in fishes collected from Manila Bay, the Philippines. BUVSs were detected at ng g <sup>-1</sup> level in all the fish samples, indicating their ubiquitous contamination in coastal waters. Among the targeted eight BUVSs, UV-328 was predominantly found with a mean concentration of 34.2 ng g <sup>-1</sup> lipid weight, implying large scale production and use of this compound in the Philippines. High concentrations of ΣBUVSs were found in bumpnose trevally (<i>Carangoides hedlandensis</i>), bluetail mullet (adult) (<i>Valamugil buchanani</i>), common ponyfish (<i>Leiognathus equulus</i>) and coral grouper (adult) (<i>Epinephelus corallicola</i>) indicating their active uptake and/or lower metabolic capacity to eliminate BUVSs. Among BUVSs, UV-P showed significant positive relationship (p < 0.05) between concentration and fish length (r = 0.29) and fish weight (r = 0.31). Levels of UV-P in demersal species had positive correlation with d<sup>15</sup>N, indicating that possibile sink of UV-P is bottom sediment in the bay, and ultimately accumulate through benthic food web rather than pelagic food web. To our knowledge, this is the first study on BUVSs distribution in fish from developing countries.","grant":"Grants-in-Aid for Scientific Research (S: 20221003), for Young Scientist (B:23710077) and Global COE Program of the Japanese Ministry of Education, Science, Sports, Culture and Technology (MEXT) and Japan Society for the Promotion of Science (JSPS), and MEXT program (Promotion of Environmental Improvement for Independence of Young Researchers) under the Special Coordination Funds for Promoting Science and Technology"},"PRA000021":{"id":"PRA000021","title":"Declining trends of polychlorinated dibenzo-p-dioxins, dibenzofurans and non-ortho PCBs in Canadian Arctic seabirds","releaseDate":"2017/01/17","doi":"10.1016/j.envpol.2016.10.003","author":"Birgit M. Braune","affiliation":"Carleton University","abstract":"Polychorinated dibenzo-p-dioxins (PCDDs), polychlorinated dibenzofurans (PCDFs) and dioxin-like polychlorinated biphenyls (PCBs) such as the non-ortho PCBs (nPCBs) persist in the environment despite international measures to ban their emissions. We determined congener patterns and temporal trends for PCDDs, PCDFs, nPCBs as well as their toxic equivalents (TEQs) in eggs of thick-billed murres (<i>Uria lomvia</i>) and northern fulmars (<i>Fulmarus glacialis</i>) sampled from Prince Leopold Island in the Canadian Arctic between 1975 and 2014. The dominant PCDD congeners were 1,2,3,7,8-PnCDD, 2,3,7,8-TCDD and 1,2,3,6,7,8-HxCDD, and the dominant PCDF congener was 2,3,4,7,8-PnCDF. The nPCB profile was dominated by PCB-126. The TEQ profile in the murre eggs was dominated by nPCB-TEQ whereas in the fulmar eggs, the PCDF-TEQ contribution to ∑TEQ was slightly greater than that of nPCB-TEQ. Concentrations of ∑PCDD, ∑PCDF, ∑nPCB and ∑TEQ declined between 1975 and 2014 in both murre and fulmar eggs. Based on TEQ thresholds in the literature for other species, and taking into account the trend towards declining TEQ levels, it is unlikely that current levels of PCDDs, PCDFs or nPCBs are affecting the reproductive success of thick-billed murres or northern fulmars in the Canadian Arctic.","grant":" Environment and Climate Change Canada and the Northern Contaminants Program of Indigenous and Northern Affairs Canada"},"PRA000020":{"id":"PRA000020","title":"Uptake and Tissue Distribution of Pharmaceuticals and Personal Care Products in Wild Fish from Treated-Wastewater-Impacted Streams ","releaseDate":"2016/01/06","doi":"10.1021/acs.est.5b02478","author":"Kei Nomiyama","affiliation":"Ehime University","abstract":"A fish plasma model (FPM) has been proposed as a screening technique to prioritize potential hazardous pharmaceuticals to wild fish. However, this approach does not account for inter- or intraspecies variability of pharmacokinetic and pharmacodynamic parameters. The present study elucidated the uptake potency (from ambient water), tissue distribution, and biological risk of 20 pharmaceutical and personal care product (PPCP) residues in wild cyprinoid fish inhabiting treated-wastewater-impacted streams. In order to clarify the uncertainty of the FPM for PPCPs, we compared the plasma bioaccumulation factor in the field (BAF<sub>plasma</sub> = measured fish plasma/ambient water concentration ratio) with the predicted plasma bioconcentration factor (BCF<sub>plasma</sub> = fish plasma predicted by use of theoretical partition coefficients/ambient water concentration ratio) in the actual environment. As a result, the measured maximum BAF<sub>plasma</sub> of inflammatory agents was up to 17 times higher than theoretical BCF<sub>plasma</sub> values, leading to possible underestimation of toxicological risk on wild fish. When the tissue-blood partition coefficients (tissue/blood concentration ratios) of PPCPs were estimated, higher transportability into tissues, especially the brain, was found for psychotropic agents, but brain/plasma ratios widely varied among individual fish (up to 28-fold). In the present study, we provide a valuable data set on the intraspecies variability of PPCP pharmacokinetics, and our results emphasize the importance of determining PPCP concentrations in possible target organs as well as in the blood to assess the risk of PPCPs on wild fish. ","grant":"Research Fellowships from the Japan Society for the Promotion of Science (JSPS) for Young Scientists in Japan (DC2) provided to R. Tanoue (26.2800), Grants-in-Aid (KAKENHI) for Scientific Research (A) (25257403), Scientific Research (S) (26220103), Challenging Exploratory Research (24651010), and Young Scientists (A) (25701014), Grants-in-Aid for Excellent Graduate Schools from the Ministry of Education, Culture, Sports, Science and Technology, Japan (MEXT)"},"PRA000038":{"id":"PRA000038","title":"Comprehensive evaluation of dioxins and dioxin-like compounds in surface soils and river sediments from e-waste-processing sites in a village in northern Vietnam: Heading towards the environmentally sound management of e-waste","releaseDate":"2017/07/13","doi":"10.1016/j.emcon.2016.03.001 ","author":"Go Suzuki","affiliation":"National Institute for Environmental Studies","abstract":"The management of electronic waste (e-waste), which can be a source of both useful materials and toxic substances, depending on the processing method, is important for promoting material cycling. In this study, we used the dioxin-responsive chemical-activated luciferase gene expression (DR-CALUX) assay combined with gas chromatography-high-resolution mass spectrometry to evaluate the levels of dioxin-like compounds in surface soils and river sediments collected in and around an e-waste-processing village in northern Vietnam. The WHO-TEQs (Toxic equivalents) of polychlorinated dibenzo-p-dioxins and dibenzofurans (PCDD/Fs), coplanar polychlorinated biphenyls (Co-PCBs), and polybrominated dibenzo-p-dioxins and dibenzofurans (PBDD/Fs) in soils collected in January 2012 ranged from 0.29 to 310 pg/g (median 2.9 pg/g, n=32), and the WHO-TEQs in sediments ranged from 0.96 to 58 pg/g (median 4.4 pg/g, n=8). Dioxin-like activities (CALUX-TEQs [2,3,7,8-TCDD equivalent]) in soils collected in January 2012, 2013, and 2014 ranged from <30 to 4300 pg/g (median <30 pg/g, n=96), and the activities in sediments ranged from <30 to 4000 pg/g (median 33 pg/g, n=24). Dioxin-like compounds accumulated in samples collected around e-waste-processing areas such as open-burning sites and e-waste-processing workshops, and the compounds may be transported from their sources to surrounding areas over the course of several years. Some of the CALUX-TEQs, but not WHO-TEQs, values were higher than the maximum acceptable WHO-TEQs promulgated by various authorities, indicating that all dioxin-like compounds should be evaluated in samples collected from e-waste-processing areas. Our findings suggest that open burning and open storage of e-waste should be prohibited and that wastewater treatment should be implemented at each workshop to reduce contamination by dioxin-like compounds from e-waste. ","grant":"The Promotion of Science and Environment Research and Technology Development Fund (no. 3K133010 and no. 3K153001) of the Ministry of the Environment, Japan, and partly supported by the Ministry of Education, Culture, Sports, Science and Technology, Japan (MEXT) to a project on Center of Excellence for Cooperative and Collaborative Studies e Leading Academia in Marine and Environmental Research (LaMer)."},"PRA000029":{"id":"PRA000029","title":"Distribution of synthetic organotins and total tin levels in <i>Mytilus galloprovincialis</i> along the Portuguese coast","releaseDate":"2017/03/31","doi":"10.1016/j.marpolbul.2009.04.007","author":"Ana Sousa","affiliation":"University of Aveiro","abstract":"Despite the huge amount of literature available on butyltins (BuTs), few studies addressed the environmental levels of phenyltins (PhTs), octyltins (OcTs) and total tin (Sn<sub>T</sub>) in environmental samples. In 2006 a mussel watch survey was developed for the Portuguese coast (total of 29 sampling sites) in order to describe the concentrations of BuTs , PhTs, OcTs and Sn<sub>T</sub> in the whole tissues of <i>Mytilus galloprovincialis</i> (Lamarck, 1819). BuTs were detected in all analyzed samples accounting, in average, for 98.6% of total organotins (∑OTs = BuTs + PhTs + OcTs), and presented highest values in the vicinity of harbors. Tributyltin (TBT) was the dominant butyltin, representing, in average, 62% of ∑BuTs (∑BuTs = TBT + DBT + MBT) suggesting that fresh inputs of TBT are still occurring in the Portuguese coast, particularly near harbors. The contribution of organotin compounds derived from antifouling paints to the total tin levels in <i>M. galloprovincialis</i> is discussed.","grant":"the research project Ecoboat (POCI/MAR/61893/2004) funded by the Portuguese Foundation for Science and Technology (FCT) and by the Programa Operacional Ciencia e Inovacao 2010 (POCI 2010), cofinanced by the FEDER European Community fund, the Portuguese Foundation for Science and Technology through a PhD Grant to Ana Sousa (SFRH/ BD/17802/2004), the Gulbenkian Foundation (Short Term Grant Ref. 81543) and Global COE Program from the Ministry of Education, Culture, Sports, Science and Technology (MEXT), Japan and Japan Society for the Promotion of Science (JSPS)"},"PRA000061":{"id":"PRA000061","title":"Organophosphorus flame retardants (PFRs) in human breast milk from several Asian countries","releaseDate":"2018/03/16","doi":"10.1016/j.chemosphere.2014.02.033","author":"Tomohiko Isobe","affiliation":"National Institute for Environmental Studies","abstract":"In this study, the concentrations of 10 organophosphorus flame retardants (PFRs) were determined in 89 human breast milk samples collected from Japan, the Philippines and Vietnam. Among the targeted PFRs, tris(2-chloroexyl) phosphate (TCEP) and triphenyl phosphate (TPHP) were the predominant compounds and were detected in more than 60% of samples in all three countries. The concentrations of PFRs in human breast milk were significantly higher (p < 0.05) in the Philippines (median 70 ng g<sup>- 1</sup> lipid wt.) than those in Japan (median 22 ng g<sup>- 1</sup> lipid wt.) and Vietnam (median 10 ng g<sup>- 1</sup> lipid wt.). The present results suggest that the usage of products containing PFRs in the Philippines is higher than those of Japan and Vietnam. Comparing with a previous literature survey in Sweden, the levels of PFRs in human breast milk from the Philippines were 1.5_2 times higher, whereas levels in Japan and Vietnam were 4_20 times lower, suggesting that these differences might be due to their variation in the usage of flame-retarded products utilized in each country. When daily intake of PFRs to infants via human breast milk was estimated, some individuals accumulated tris(2-butoxyethyl) phosphate (TBOEP) and TCEP were close to reference dose (RfD). This is the first report to identify PFRs in human breast milk samples from Asian countries.","grant":"Grant-in-Aid for Scientific Research A (25257403), B (25281008) and Challenging Exploratory Research (24651010) from the Japanese Ministry of Education, Culture, Sports, Science and Technology (MEXT) and Japan Society for the Promotion of Science (JSPS) and the Environment Research and Technology Development Fund (5ZRFc-1201) of the Ministry of the Environment, and MEXT program: Promotion of Environmental Improvement for Independence of Young Researchers"},"PRA000082":{"id":"PRA000082","title":"Pollution sources and occurrences of selected persistent organic pollutants (POPs) in sediments of the Mekong River delta, South Vietnam","releaseDate":"2018/12/17","doi":"10.1016/j.chemosphere.2006.05.144","author":"Shinsuke Tanabe","affiliation":"Ehime University","abstract":"The Mekong River delta is one of the largest agricultural land in the Southeast Asia. It plays a very important role for agriculture and fisheries in South Vietnam. However, comprehensive studies on the environmental pollution of persistent organic pollutants (POPs) in Mekong River delta have not been carried out in recent years. In this study, we collected sediment samples from the Mekong River to evaluate the contamination and ecological risks caused by several POPs. The contamination pattern of POPs was DDT > PCBs > CHLs > HCHs > HCB. DDTs are the most abundant pollutants, their concentration ranging from 0.01 to 110 ng/g dry wt, followed by PCBs (0.039_9.2 ng/g dry wt). DDTs and PCBs concentrations were higher in sediment from adjacent to urban areas than those from rural and agricultural sites, suggesting urban areas as important point sources of DDTs and PCBs to the river. Ratio of p,p'-DDT/p,p'- DDE was lower compared to those previously reported. However, some samples still had the ratio higher than 0.5, indicating recent input of DDT into the aquatic environments. This result shows that although the magnitude of contamination decreased over time, recent inputs of DDTs to the river still occur. Some sediment samples had concentrations of DDT compounds higher than the standards from the Canadian Environmental Quality Guideline, suggesting continuous monitoring for POPs contamination in the Mekong River is necessary.","grant":"Grant-in-Aid from the Scientific Research on Priority Areas (Project No. 13027101) of the Japanese Ministry of Education, Science, Sports, Culture and Technology; Scientific Research (Project No. 12308030) of Japan Society for the Promotion of Science (JSPS); Research Revolution 2002 (RR 2002) project for Sus- tainable Coexistence of Human, Nature and the Earth (FY 2002) of the MEXT of the Japanese Government; the Core University Program between Japan Society for the Promotion of Science (JSPS) and National Center for Natural Science and Technology, Vietnam (NCST); 21st Century COE Program from the Japanese Ministry of Education, Science, Sports, Culture and Technology"},"PRA000072":{"id":"PRA000072","title":"Possible natural formation of polychlorinated dibenzo-p-dioxins as evidenced by sediment analysis from the Yellow Sea, the East China Sea and the Pacific Ocean","releaseDate":"2018/06/28","doi":"10.1016/0025-326X(94)00184-B","author":"Shunji Hashimoto","affiliation":"National Institute for Environmental Studies","abstract":"Polychlorinated dibenzo-p-dioxins (PCDDs) and related compounds were analysed in sediment samples from the Yellow Sea, the East China Sea and the Pacific Ocean. Interestingly, PCDFs and PCBs were not found in any of the sediment samples, although PCDDs were detected. The concentration of PCDDs in the core sediments were in the range of 0.13_1.9 ng g<sup>−1</sup> on dry weight basis for octaOCDD, while low level of hexaCDDs and heptaCDDs were also found. These observations suggested that some of the PCDD isomers have been distributed widely in the marine environment since the ancient age (1_10 million years old). PCDD residues in marine sediment cores indicated the natural formation of these toxic chemicals on the surface of the ocean. However, generation of PCDDs by natural combustion on land and their long-range transport to the marine environment still remain to be elucidated.","grant":null},"PRA000084":{"id":"PRA000084","title":"Spatial, Phase, And Temporal Distributions of Perfluorooctane Sulfonate (PFOS) and Perfluorooctanoate (PFOA) in Tokyo Bay, Japan","releaseDate":"2019/03/11","doi":"10.1021/es1007609","author":"Takeo Sakurai","affiliation":"National Institute for Environmental Studies","abstract":"The spatial distribution, partitioning, and time trends of perfluorooctane sulfonate (PFOS) and perfluorooctanoate (PFOA) were investigated in the water column and bottom sediment of Tokyo Bay, Japan, during 2004-2006. A total of 480 water and 60 sediment samples obtained by regular 20 station samplings ascertained the three-dimensional distributions of these compounds and changes in the seawater structure in the whole bay. The median of volume-based average waterborne concentrations of PFOS and PFOA was 3.7 and 12 ng/L, respectively. The median concentrations in sediment were 0.61 (PFOS) and 0.20 (PFOA) ng/g-dry. Vertical mixing of the water column probably affected the vertical distribution of these compounds. The negative correlations between PFOS and PFOA concentrations and water salinity and the horizontal distributions of their concentrations suggested that freshwater inputs into the bay were the source of these compounds. A mixing model estimated the average PFOS concentration in the freshwater inputs to be 29 ng/L. The common logarithm of the partition coefficients between the dissolved and suspended-particle-sorbed phases varied among samples, with the average of 4.2 (PFOS) and 3.5 (PFOA). Our analyses indicated no apparent time trends in the concentrations of these compounds during 2004-2006 in either the freshwater input or the bay.","grant":null},"PRA000123":{"id":"PRA000123","title":"[MOE_JP] The Detailed Environmental Survey in FY2020 (Source: FY2021 Report of Chemicals in the Environment<a href=https://www.env.go.jp/chemi/kurohon/en/http2021e/index.html target=_blank> English </a>/<a href=https://www.env.go.jp/chemi/kurohon/2021/index.html target=_blank> Japanese </a>)","releaseDate":"2022/11/25","doi":null,"author":"Open data","affiliation":"Ministry of the Environment","abstract":null,"grant":null}},"indexes":{"CG0001":[{"mid":1,"pid":"PRA000001","sid":"SAA000001","cid":"CH0000096","cname":"ΣPCBs","cas":null,"gid":"CG0011","stype":"ST008","stypeLabel":"Biotic > Fish","year":1998,"month":8.0,"region":"Pacific Ocean","country":"Unknown","area":null,"lat":44.4833,"lon":175.517,"species":"Katsuwonus pelamis","common":"Skipjack tuna","tissue":"Liver","sex":"Male","value":6.659794604,"altData":null,"unit":"ng/g wet"},{"mid":2,"pid":"PRA000001","sid":"SAA000002","cid":"CH0000096","cname":"ΣPCBs","cas":null,"gid":"CG0011","stype":"ST008","stypeLabel":"Biotic > Fish","year":1998,"month":8.0,"region":"Pacific Ocean","country":"Unknown","area":null,"lat":44.4833,"lon":175.517,"species":"Katsuwonus pelamis","common":"Skipjack tuna","tissue":"Liver","sex":null,"value":9.778106896,"altData":null,"unit":"ng/g wet"},{"mid":3,"pid":"PRA000001","sid":"SAA000003","cid":"CH0000096","cname":"ΣPCBs","cas":null,"gid":"CG0011","stype":"ST008","stypeLabel":"Biotic > Fish","year":1998,"month":8.0,"region":"Pacific Ocean","country":"Unknown","area":null,"lat":44.4833,"lon":175.517,"species":"Katsuwonus pelamis","common":"Skipjack tuna","tissue":"Liver","sex":"Female","value":5.494933474,"altData":null,"unit":"ng/g wet" ,"CG0111":"CG0111","CG0112":"CG0112","CG0113":"CG0113","CG0114":"CG0114","CG0115":"CG0115","CG0069":"CG0069","CG0121":"CG0121","CG0116":"CG0116"}};</script>
<script>
const meta       = BUNDLE.meta;
const chemicals  = BUNDLE.chemicals;
const sampleTypes= BUNDLE.sampleTypes;
const chemTree   = BUNDLE.chemTree;
const groupToRoot= BUNDLE.groupToRoot;
const hasData    = new Set(Object.keys(meta.filemap));
const projects   = {};
BUNDLE.projects.forEach(p => projects[p.id] = p);

let currentRaw    = [];
let filtered      = [];
let activeGroupId = null;
let activeFilter  = null; // サブグループでフィルタリングする場合

// サンプルタイプのtype1マップ
const stMap = {};
sampleTypes.forEach(st => stMap[st.id] = { label: st.path, type1: st.type1 });

// ── ツリー構築 ──
function buildTree() {
  const el = document.getElementById('group-tree');
  el.innerHTML = '';
  chemTree.forEach(node => el.appendChild(makeNode(node, 0)));
}

function makeNode(node, depth) {
  const hasChildren = node.children && node.children.length > 0;
  const rootId = groupToRoot[node.id] || node.id;
  const dataExists = hasData.has(rootId);

  const wrap = document.createElement('div');
  wrap.className = `tree-item depth-${depth}`;

  const row = document.createElement('div');
  row.className = 'tree-row' + (dataExists ? ' has-data' : ' no-data');
  row.dataset.id = node.id;

  // 展開ボタン
  const toggle = document.createElement('button');
  toggle.className = 'toggle-btn' + (hasChildren ? '' : ' leaf');
  toggle.textContent = '▶';
  toggle.onclick = (e) => { e.stopPropagation(); toggleChildren(wrap, toggle); };

  const label = document.createElement('span');
  label.textContent = node.label;

  row.appendChild(toggle);
  row.appendChild(label);
  row.onclick = () => selectGroup(node, row);
  wrap.appendChild(row);

  if (hasChildren) {
    const children = document.createElement('div');
    children.className = 'tree-children';
    node.children.forEach(c => children.appendChild(makeNode(c, depth + 1)));
    wrap.appendChild(children);
  }
  return wrap;
}

function toggleChildren(wrap, btn) {
  const children = wrap.querySelector('.tree-children');
  if (!children) return;
  const isOpen = children.classList.toggle('open');
  btn.classList.toggle('open', isOpen);
  wrap.classList.toggle('expanded', isOpen);
}

// ── グループ選択 ──
async function selectGroup(node, rowEl) {
  document.querySelectorAll('.tree-row.active').forEach(r => r.classList.remove('active'));
  rowEl.classList.add('active');

  const rootId = groupToRoot[node.id] || node.id;
  if (!hasData.has(rootId)) {
    document.getElementById('table-area').innerHTML =
      '<div class="no-data">No data for this group in the sample dataset.</div>';
    document.getElementById('result-count').innerHTML = '';
    document.getElementById('breadcrumb').innerHTML = `<span>${node.label}</span> — no data`;
    return;
  }

  // パンくず
  document.getElementById('breadcrumb').innerHTML =
    node.id === rootId
      ? `<span>${node.label}</span>`
      : `${getRootLabel(rootId)} › <span>${node.label}</span>`;

  // ルートグループのデータをロード（未ロードなら）
  if (activeGroupId !== rootId) {
    document.getElementById('table-area').innerHTML = '<div class="loading">Loading…</div>';
    currentRaw = BUNDLE.indexes[rootId] || [];
    activeGroupId = rootId;
    buildYearFilter();
  }

  // サブグループフィルター
  activeFilter = node.id === rootId ? null : collectDescendants(node);
  applyFilter();
}

function getRootLabel(rootId) {
  const found = chemTree.find(n => n.id === rootId);
  return found ? found.label : rootId;
}

// ノードとその子孫のIDセットを収集
function collectDescendants(node) {
  const ids = new Set();
  function walk(n) { ids.add(n.id); n.children.forEach(walk); }
  walk(node);
  return ids;
}

// ── フィルター ──
function buildSampleTypeFilter() {
  const sel = document.getElementById('q-stype');
  const added = new Set();
  sampleTypes.forEach(st => {
    if (st.type1 && !added.has(st.type1)) {
      added.add(st.type1);
      const opt = document.createElement('option');
      opt.value = st.type1; opt.textContent = st.type1;
      sel.appendChild(opt);
    }
  });
}

function buildYearFilter() {
  const years = [...new Set(currentRaw.map(r => r.year).filter(Boolean))].sort((a,b) => b-a);
  const sel = document.getElementById('q-year');
  const cur = sel.value;
  sel.innerHTML = '<option value="">All years</option>';
  years.forEach(y => { const o = document.createElement('option'); o.value=y; o.textContent=y; sel.appendChild(o); });
  if (cur) sel.value = cur;
}

function applyFilter() {
  if (!currentRaw.length) return;
  const qchem = document.getElementById('q-chem').value.trim().toLowerCase();
  const qloc  = document.getElementById('q-loc').value.trim().toLowerCase();
  const qst   = document.getElementById('q-stype').value;
  const qyear = document.getElementById('q-year').value;

  filtered = currentRaw.filter(r => {
    if (activeFilter && !activeFilter.has(r.gid)) return false;
    if (qchem) { const s = ((r.cname||'')+' '+(r.cas||'')).toLowerCase(); if (!s.includes(qchem)) return false; }
    if (qloc)  { const s = ((r.region||'')+' '+(r.country||'')+' '+(r.area||'')).toLowerCase(); if (!s.includes(qloc)) return false; }
    if (qst)   { if ((stMap[r.stype]||{}).type1 !== qst) return false; }
    if (qyear) { if (String(r.year) !== qyear) return false; }
    return true;
  });

  document.getElementById('result-count').innerHTML =
    `<strong>${filtered.length.toLocaleString()}</strong> records`;
  renderTable(filtered.slice(0, 500));
}

function resetFilter() {
  ['q-chem','q-loc'].forEach(id => document.getElementById(id).value = '');
  ['q-stype','q-year'].forEach(id => document.getElementById(id).value = '');
  applyFilter();
}

// ── テーブル ──
function renderTable(records) {
  if (!records.length) {
    document.getElementById('table-area').innerHTML = '<div class="no-data">No records found.</div>';
    return;
  }
  const rows = records.map(r => {
    const st = stMap[r.stype] || {};
    const badgeCls = st.type1 === 'Biotic' ? 'b-biotic' : 'b-abiotic';
    const loc = [r.area, r.country, r.region].filter(Boolean).join(', ') || '—';
    const val = r.value != null ? `${Number(r.value).toPrecision(4)} ${r.unit||''}` : (r.altData||'—');
    return `<tr onclick="showDetail(${r.mid},'${r.pid}')">
      <td>${r.cname||'—'}</td>
      <td style="color:var(--muted);font-size:.78em">${r.cas||'—'}</td>
      <td><span class="badge ${badgeCls}">${st.type1||'—'}</span></td>
      <td style="max-width:160px;overflow:hidden;text-overflow:ellipsis" title="${r.species||''}">${r.species||r.common||'—'}</td>
      <td style="max-width:160px;overflow:hidden;text-overflow:ellipsis" title="${loc}">${loc}</td>
      <td>${r.year||'—'}${r.month?'/'+String(r.month).padStart(2,'0'):''}</td>
      <td style="font-family:monospace;text-align:right">${val}</td>
    </tr>`;
  }).join('');
  const note = filtered.length > 500
    ? `<tr><td colspan="7" style="text-align:center;padding:.8rem;color:var(--muted);font-size:.8rem">Showing first 500 of ${filtered.length.toLocaleString()} — use filters to narrow down.</td></tr>` : '';
  document.getElementById('table-area').innerHTML = `
    <table>
      <thead><tr><th>Chemical</th><th>CAS</th><th>Sample type</th><th>Species</th><th>Location</th><th>Date</th><th>Value</th></tr></thead>
      <tbody>${rows}${note}</tbody>
    </table>`;
}

// ── モーダル ──
async function showDetail(mid, pid) {
  const rec  = filtered.find(r => r.mid === mid);
  const proj = BUNDLE.details[pid] || projects[pid] || {};
  const doi  = proj.doi ? `<a href="https://doi.org/${proj.doi}" target="_blank">${proj.doi}</a>` : '—';
  const st   = stMap[rec?.stype] || {};
  const loc  = [rec?.area, rec?.country, rec?.region].filter(Boolean).join(', ') || '—';
  const val  = rec?.value != null ? `${rec.value} ${rec.unit||''}` : (rec?.altData||'—');
  document.getElementById('modal-content').innerHTML = `
    <h2>${proj.title||'Project detail'}</h2>
    <div class="modal-grid">
      <div class="modal-section"><label>Author</label><p>${proj.author||'—'}</p></div>
      <div class="modal-section"><label>Affiliation</label><p>${proj.affiliation||'—'}</p></div>
      <div class="modal-section"><label>Release date</label><p>${proj.releaseDate||'—'}</p></div>
      <div class="modal-section"><label>DOI</label><p>${doi}</p></div>
    </div>
    <hr class="modal-divider">
    <div class="modal-grid">
      <div class="modal-section"><label>Chemical</label><p>${rec?.cname||'—'}${rec?.cas?' ('+rec.cas+')':''}</p></div>
      <div class="modal-section"><label>Sample type</label><p>${st.label||'—'}</p></div>
      <div class="modal-section"><label>Species</label><p>${rec?.species||rec?.common||'—'}</p></div>
      <div class="modal-section"><label>Tissue</label><p>${rec?.tissue||'—'}</p></div>
      <div class="modal-section"><label>Location</label><p>${loc}</p></div>
      <div class="modal-section"><label>Date</label><p>${rec?.year||'—'}${rec?.month?'/'+String(rec.month).padStart(2,'0'):''}</p></div>
      <div class="modal-section"><label>Measured value</label><p style="font-family:monospace">${val}</p></div>
      <div class="modal-section"><label>Sex</label><p>${rec?.sex||'—'}</p></div>
    </div>
    ${proj.abstract ? `<div class="modal-section"><label>Abstract</label><p>${proj.abstract}</p></div>` : ''}
    ${proj.grant    ? `<div class="modal-section"><label>Grant</label><p style="font-size:.8em">${proj.grant}</p></div>` : ''}
  `;
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal(e) {
  if (e.target === document.getElementById('modal-overlay'))
    document.getElementById('modal-overlay').classList.remove('open');
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.getElementById('modal-overlay').classList.remove('open');
});

buildTree();
buildSampleTypeFilter();
</script>
</body>
</html>
