lorinated OH-PCB congeners were predominant in human blood, but profiles of OH-PCBs in other animals widely varied by species. Elevated composition of tri- and tetra-chlorinated OH-PCBs in cat blood and octa-chlorinated OH-PCBs in dog and raccoon dog blood were observed. In cat blood, elevated PCP concentration was also found. When concentration ratios of OH-PCBs to PCBs were calculated in all the animal blood, the ratios in dog, raccoon dog, and cat were notably higher than in other species. These results indicate that animals other than humans, especially cat and canine species such as dog and raccoon dog, might be at risk from OH-PCBs.","grant":"Global COE Program and Grants-in-Aid for Scientific Research (S)(No. 20221003) from the Ministry of Education, Culture, Sports, Science and Technology, Japan (MEXT) and Japan Society for the Promotion of Science (JSPS)."},"PRA000028":{"id":"PRA000028","title":"Urinary 8-hydroxy-2'-deoxyguanosine in inhabitants chronically exposed to arsenic in groundwater in Cambodia ","releaseDate":"2017/03/08","doi":"10.1039/b513652k","author":"Shinsuke Tanabe","affiliation":"Ehime University","abstract":"Arsenic concentrations in hair and urine, and urinary levels of 8-hydroxy-2'-deoxyguanosine (8OHdG), a marker of oxidative DNA damage, were examined for inhabitants of the Mekong Basin in Kratie Province, Cambodia. Also, the arsenic levels of tube-well water were determined. Total arsenic concentrations in tube-well water ranged from < 1 to 886 µg L<sup>-1</sup>, and 44.8% of these exceeded the WHO drinking water guideline of 10 µg L<sup>-1</sup>. Elevated levels of arsenic were observed in the human hair and urine, and also a significant positive correlation was observed between the concentrations in hair and urine. These results suggest that the inhabitants are chronically exposed to arsenic through drinking the tube-well water. Levels of urinary 8-OHdG were higher for the subjects with higher arsenic levels in hair and urine, suggesting that induction of oxidative DNA damage was caused by chronic exposure to arsenic in tube-well water for the inhabitants in Kratie Province. To our knowledge, this is the first report on the oxidative DNA damage caused by chronic exposure to arsenic in groundwater for the inhabitants in Cambodia.","grant":"Grants from Research Revolution 2002 (RR2002) Project for Sustainable Coexistence of Human, Nature and the Earth (FY2002) and 21st COE Program from the Ministry of Education, Culture, Sports, Science and Technology, Japan"},"PRA000015":{"id":"PRA000015","title":"Contamination by perfluorinated compounds in water near waste recycling and disposal sites in Vietnam","releaseDate":"2016/11/07","doi":"10.1007/s10661-012-2759-x","author":"Shin Takahashi","affiliation":"Ehime University","abstract":"There are very few reports on the contamination by perfluorinated chemicals (PFCs) in the environment of developing countries, especially regarding their emission from waste recycling and disposal sites. This is the first study on the occurrence of a wide range of PFCs (17 compounds) in ambient water in Vietnam, including samples collected from a municipal dumping site (MD), an e-waste recycling site (ER), a battery recycling site (BR) and a rural control site. The highest PFC concentration was found in a leachate sample from MD (360 ng/L). The PFC concentrations in ER and BR (mean, 57 and 16 ng/L, respectively) were also significantly higher than those detected in the rural control site (mean, 9.4 ng/L), suggesting that municipal solid waste and waste electrical and electronic equipment are potential contamination sources of PFCs in Vietnam. In general, the most abundant PFCs were perfluorooctanoic acid (PFOA), perfluorononanoic acid (PFNA), and perfluoroundecanoic acid (PFUDA; <1.4-100, <1.2-100, and <0.5-20 ng/L, respectively). Interestingly, there were specific PFC profiles: perfluoroheptanoic acid and perfluorohexanoic acid (88 and 77 ng/L, respectively) were almost as abundant as PFOA in MD leachate (100 ng/L), whereas PFNA was prevalent in ER and BR (mean, 17 and 6.2 ng/L, respectively) and PFUDA was the most abundant in municipal wastewater (mean, 5.6 ng/L), indicating differences in PFC contents in different waste materials.","grant":"Grants-in-Aid for Scientific Research (S: 20221003) from Japan Society for the Promotion of Science (JSPS), Young Scientist (B: 23700077), the waste management research grant (K2343 and K22057) from the Ministry of the Environment, Japan, and grants from Global COE Program from the Japanese MInistry of Education, Culture, Sports, Science and Technology (MEXT)."},"PRA000013":{"id":"PRA000013","title":"Bioaccumulation of nitroarenes in bivalves at Osaka Bay, Japan","releaseDate":"2016/10/27","doi":"10.1016/j.marpolbul.2011.02.044","author":"Seiichi Uno","affiliation":"Kagoshima University","abstract":"This paper reports for the first time the detection and occurrence of nitroarenes (NPAHs) in marine organisms. Mussels and oysters collected from Osaka Bay, Japan, had total NPAHs concentrations that ranged from 2380 to 24,688 pg/g dry and 2672 to 25,961 pg/g dry, respectively. Relatively higher concentrations were detected in sampling sites located near the central district and suburbs of Osaka City implying that the most probable sources of NPAHs in the two bivalves are exhaust gases and smokes emitted by automobiles and industrial plants. Bivalves had relatively higher residues of 1-nitronaphthalene, 2-nitronaphthalene, 3-nitrophenanthrene, and 9-nitrophenanthrenes. Residues of 2-nitrofluorene, 1-nitropyrene, 4-nitropyrenes, and 6-nitrochrysene were much lower compared to nitronaphthalenes and nitrophenanthrenes. Inter-species differences was only observed for 2-nitronaphthalene with oysters exhibiting significantly higher residues than mussels.","grant":"The Development Fund, Research on Dynamics of Nitroarenes in Inner Bay Region and Influence on Marine Organisms from the Ministry of the Environment, Japan"},"PRA000103":{"id":"PRA000103","title":"The Wharf Roach, <i>Ligia sp.</i>, A Novel Indicator of Polycyclic Aromatic Hydrocarbon Contamination in Coastal Areas","releaseDate":"2020/07/03","doi":"10.1007/s41742-017-0063-x","author":"Yuji Oshima","affiliation":"Kyushu University","abstract":"We investigated polycyclic aromatic hydrocarbon (PAH) pollution of the intertidal and supratidal zone using the wharf roach (<i>Ligia sp.</i>) as a novel environmental indicator. PAH and alkylated PAH (alkPAH) concentrations in wharf roaches collected from nine sampling sites on the central and northern coast of Japan in November 2011 were analyzed. Total alkPAH concentrations were higher than those of PAHs at all sampling sites. Seven sampling sites had relatively low total concentrations of PAHs and alkPAHs (57.7_130 and 276_770 ng/g-dry, respectively); they included sites in Miyagi Prefecture (St. 5 and 9) that were seriously damaged by the Great East Japan Earthquake and by the following Tsunami on 11 March 2011. Two sampling sites (St. 2: Kominato, Aomori Prefecture; St. 3: Usushiri, Hokkaido) had higher concentrations of total PAHs and alkPAHs (PAHs, 1025 and 591 ng/g-dry, respectively; alkPAHs, 1490 and 1160 ng/g-dry, respectively). Diagnostic ratio calculation showed that St. 2 and 3 had PAHs of pyrolytic origin, possibly from vehicle exhaust gas or industrial fuel combustion, or both. The concentrations of these pollutants in the wharf roach were similar to those in bivalves and therefore likely reflected PAH pollution at the collection sites. The wharf roach may be a suitable candidate indicator of PAH pollution, not only in the intertidal zone inhabited by the currently used bivalve indicators, but also in the supratidal zone.","grant":"the JKA Foundation; the cooperative research program of the Institute of Nature and Environmental Technology, Kanazawa University, acceptance no. 5, 2015"},"PRA000008":{"id":"PRA000008","title":"Regional Trend and Tissue Distribution of Brominated Flame Retardants and Persistent Organochlorines in Raccoon Dogs (<i>Nyctereutes procyonoides </i>) from Japan","releaseDate":"2016/10/03","doi":"10.1021/es071565z","author":"Shinsuke Tanabe","affiliation":"Ehime University","abstract":"The present study investigated concentrations and patterns of brominated flame retardants, such as polybrominated diphenyl ethers (PBDEs) and hexabromocyclododecanes (HBCDs), and persistent organochlorines (OCs) in liver and adipose tissues of raccoon dogs (RD: <i>Nyctereutes procyonoides </i>) collected from two metropolises and a local prefecture in Japan during 2001-2006. Relatively high concentrations of PBDEs were found in RD livers, while HBCD levels were the lowest among the measured organohalogen compounds. Among PBDE congeners, BDE209 was predominant in RDs from all the regions, indicating that pollution derived from the technical decaBDE product is extensive across Japan. On the other hand, concentrations of tetra- to nona-BDE congeners in RDs from a metropolis weere significantly higher than those from the other two regions, implying that there were regional differences in the past usage of the technical tetraBDE and octaBDE products. Such a regional difference was also observed for HBCD levels. Lipid-normalized concentration ratios of liver to adipose tissue (L/A ratio) for tri to hepta-BDE congeners were lower than 1.0 in the investigated eight RDs, suggesting lipid-dependent accumulation. However, the L/A ratios of BDE 209 exceeded 1.0 in all the specimens, suggesting hepatic retention of this compound. In addition, lipid-dependent accumulation of alpha-HBCD was observed, but the L/A ratios of gamma-HBCD were greater than 1.0 in some specimens. These results indicate that Japanese RDs have been recently exposed to BDE 209 and gamma-HBCD and accumulated both these compounds preferentially in blood-rich organs, probably due to their binding to proteins and/or rapid biotransformation, as reported in experimental rodents.","grant":"The Global Environmental Research Fund (RF-064) and the Waste Management Research Grant (K1821 and K1836) from the Ministry of the Environment and by Grants-in-Aid for Scientific Research (A) (no.16201014) and (B) (no. 18310046), Young Scientists (B) (project 19780239) and Global COE Program from the Ministry of Education, Culture, Sports, Science and Technology, Japan (MEXT) and Japan Society for the Promotion of Science (JSPS)"},"PRA000104":{"id":"PRA000104","title":"[MOE_JP] Japanese Nationwide Survey on Existence of PFOS and PFOA in FY2019 (Source: MOE Press Release: Result of FY2019 National Survey on Existence of PFOS and PFOA dated June 11, 2020 <a href=https://www.env.go.jp/press/108091.html target=_blank> Japanese </a>)","releaseDate":"2020/07/28","doi":null,"author":"Open data","affiliation":"Ministry of the Environment","abstract":null,"grant":null},"PRA000109":{"id":"PRA000109","title":"Screening analysis of organic micro-pollutants in road dusts from some areas in northern Vietnam: A preliminary investigation on contamination status, potential sources, human exposure, and ecological risk","releaseDate":"2020/11/20","doi":"10.1016/j.chemosphere.2019.02.177","author":"Shin Takahashi","affiliation":"Ehime University","abstract":"Road dust samples collected from some representative areas in northern Vietnam were examined to determine the occurrence of multiple classes of organic micro-pollutants. Of 942 target compounds screened, 105 organic pollutants originating from different sources such as traffic, household, agricultural, and industrial activities, were detected at least once in our samples. Concentrations of total organic pollutants in the road dusts ranged from 7.8 to 170 μg g <sup>-1</sup> , with a median value of 28 μg g <sup>-1</sup>. Overall contamination levels were the highest in samples from an urban area, followed by those from an industrial park, a suburban area, and a rural commune, suggesting environmental impacts of urbanization and industrialization. The most predominant pollutants found in the road dusts were n-alkanes, polycyclic aromatic hydrocarbons (PAHs), and current-use chemicals such as phthalate plasticizers and pharmaceutical and personal care products (PPCPs), whereas, industrial chemicals and pesticides were detected at relatively low levels. Persons occupationally exposed to road dusts (e.g., street sweepers, vendors, and traffic policemen) were estimated to receive the highest daily intake doses of dust-bound organic pollutants that were one to two orders of magnitude greater than those received by general population. No serious human health risk associated with ingestion of contaminated road dusts was observed in this study. However, levels of some phthalates were higher than related environmental quality guidelines in terms of ecological risk. More comprehensive and detailed risk assessment of organic pollutants in road dusts should be conducted, especially for highly urbanized and industrialized areas in developing countries.","grant":"Grants-in-Aid for Scientific Research (B: 16H02963); Fund for the Promotion of Joint International Research (Fostering Joint International Research (B)) (18KK0300) from the Japan Society for the Promotion of Science (JSPS)"},"PRA000107":{"id":"PRA000107","title":"PBDEs and novel brominated flame retardants in road dust from northern Vietnam: Levels, congener profiles, emission sources and implications for human exposure","releaseDate":"2020/10/26","doi":"10.1016/j.chemosphere.2018.01.066","author":"Shin Takahashi","affiliation":"Ehime University","abstract":"Polybrominated diphenyl ethers (PBDEs) and selected novel brominated flame retardants (NBFRs) were examined in road dust samples collected from three representative areas in northern Vietnam, including seven inner districts of Hanoi metropolitan area, an industrial park in Thai Nguyen province and a rural commune in Bac Giang province. This study aims to provide basic information on the contamination status, potential sources and human exposure to PBDEs and NBFRs associated with road dust in northern  Vietnam. PBDEs were detected in all the samples at a range of 0.91-56 ng g <sup>-1</sup.> with a median value of 16 ng g<sup>-1</sup>. PBDE concentrations in road dusts from urban sites were significantly higher than those from industrial zone and rural area, suggesting their environmental load related to urbanization in northern Vietnam. BDE-209, major component of deca-BDE technical mixtures, dominated the congener patterns in all samples, accounting for 60.8-91.9% of total PBDE levels. Decabromodiphenyl ethane, an alternative of deca-BDE, was observed in a detection frequency of 100% in urban and industrial areas and at levels comparable to those of BDE-209. Other NBFRs such as pentabromoethylbenzene, hexabromobiphenyl and 1,2-bis-(2,4,6-tribromophenoxy)ethane, were found at trace levels. Daily intake doses of PBDEs via road dust ingestion from 2.3 x 10<sup>-5</sup> to 0.11 ng kg-bw<sup>-1</sup> d<sup>-1</sup> were estimated for residents in study areas, indicating a negligible risk with hazard indexes of 10<sup>-9</sup> to 10<sup>-5</sup> for selected congeners such as BDE-47, 99, 153 and 209.","grant":"Grants-in-Aid for Scientific Research (B: 16H02963) from the Japan Society for the Promotion of Science; the Environment Research and Technology Development Fund (3K153001) from the Japanese Ministry of the Environment"},"PRA000051":{"id":"PRA000051","title":"Concentrations of trace elements in American alligators (<i>Alligator mississippiensis</i>) from Florida, USA","releaseDate":"2017/11/10","doi":"10.1016/j.chemosphere.2014.01.031","author":"Shinsuke Tanabe","affiliation":"Ehime University","abstract":"Concentrations of 28 trace elements (Li, Mg, Al, V, Cr, Mn, Fe, Co, Ni, Cu, Zn, Ga, As, Se, Rb, Sr, Mo, Ag, Cd, In, Sn, Sb, Cs, Tl, Hg, Pb, and Bi) in the livers of juvenile and adult American alligators inhabiting two central Florida lakes, Lake Apopka (LA), and Lake Woodruff National Wildlife Refuge (LW) and one lagoon population located in Merritt Island National Wildlife Refuge (MINWR; NASA), were determined. In juveniles from MINWR, concentrations of nine elements (Li, Fe, Ni, Sr, In, Sb, Hg, Pb and Bi) were significantly higher, whereas six elements (V, Fe, As, Sr, Hg and Bi) were elevated in adults (p < 0.05) obtained from MINWR. Significant enrichment of some trace elements in adults, relative to juveniles, was observed at all three sampling areas. Specifically, Fe, Pb and Hg were significantly elevated in adults when compared to juveniles, suggesting age-dependent accumulation of these elements. Further, As, Se and Sn showed the same trend but only in animals collected from MINWR. Mean Fe concentrations in the livers of adults from LA, LW and MINWR were 1770 μg g <sup>-1</sup> DW, 3690 μg g <sup>-1</sup> DW and 5250 μg g <sup>-1</sup> DW, respectively. More than half of the adult specimens from LW and MINWR exhibited elevated hepatic Fe concentrations that exceed the threshold value for toxic effects in donkey, red deer and human. These results prompted us to express our concern on possible exposure and health effects in American alligators by some trace elements derived from NASA activities.","grant":" Global Center of Excellence (COE) Program of the Japanese Ministry of Education, Culture, Sports, Science and Technology (MEXT), and the Japan Society for the Promotion of Science (JSPS)."},"PRA000007":{"id":"PRA000007","title":"Persistent organochlorines in raccoon dogs (<i>Nyctereutes procyonoides</i>) from Japan: Hepatic sequestration of oxychlordane","releaseDate":"2016/09/28","doi":"10.1016/j.chemosphere.2006.06.001","author":"Shinsuke Tanabe","affiliation":"Ehime University","abstract":"The present study determined the accumulation features of persistent organochlorines (OCs) such as polychlorinated biphenyls (PCBs), dichlorodiphenyltrichloroethane and its metabolites (DDTs), hexachlorocyclohexane isomers (HCHs), hexachlorobenzene (HCB), and chlordane compounds (CHLs) in wild raccoon dogs (RDs; <i>Nyctereutes procyonoides </i>) collected from Kanagawa prefecture in Japan during 2001. In livers of RDs, CHLs were remarkably dominant (20 times higher than PCBs) followed by PCBs > DDTs > HCHs > HCB, whereas the chemicals in muscles were in the order of CHLs > PCBs > HCHs > DDTs > HCB. The accumulation pattern of OCs in RDs was different from those in Japanese humans and avian species reported previously, which generally accumulate higher levels of DDTs and PCBs than CHLs. This result indicates that RDs have been exposed to relatively high levels of CHLs and have high metabolic and elimination capacity for DDTs. In fact, CHL levels in RDs were higher than those in humans and some avian species, while DDT levels in RDs were much lower than other animals. In particular, extremely high accumulation levels of oxychlordane, which is a metabolite from chlordanes and nonachlors, were observed in RD livers. The higher toxic potency of oxychlordane than parent compounds may suggest that RDs are at high risk by this metabolite. On lipid weight basis, PCBs, HCHs and HCB levels were almost similar in livers and muscles, suggesting that the tissue distribution of these compounds principally followed the lipid-dependent accumulation. However, accumulation levels of oxychlordane and <i>p,p'</i>-DDD in livers were significantly higher than those in muscles, and concentration ratios of liver to muscle (L/M ratios) of these compounds were greater than 1.0 in all the specimens. This phenomenon was similar to PCDD/DF congener accumulation patterns observed previously in RDs. When relationships between hepatic TEQs and L/M ratios were examined for oxychlordane and <i>p,p'</i>-DDD, L/M ratios for these compounds significantly increased with hepatic TEQ levels, suggesting their hepatic sequestration in TEQs-dependent manner.","grant":"21st Century COE Program for Ehime University and Gifu University from the Ministry of Education, Culture, Sports, Science and Technology, Japan"},"PRA000085":{"id":"PRA000085","title":"Distribution of Polycyclic Aromatic Hydrocarbons (PAHs) and phenolic endocrine disrupting chemicals in South and Southeast Asian mussels","releaseDate":"2019/03/14","doi":"10.1007/s10661-007-9661-y","author":"Hideshige Takada","affiliation":"Tokyo University of Agriculture & Technology","abstract":"A comprehensive monitoring survey for polycyclic aromatic hydrocarbons (PAHs) and phenolic endocrine disrupting chemicals (EDCs) utilizing mussels as sentinel organisms was conducted in South and Southeast Asia as a part of the Asian Mussel Watch project. Green mussel (<i>Perna viridis</i>) samples collected from a total of 48 locations in India, Indonesia, Singapore, Malaysia, Thailand, Cambodia, Vietnam, and the Philippines during 1994_1999 were analyzed for PAHs, EDCs including nonylphenol (NP), octylphenol (OP) and bisphenol A (BPA), and linear alkylbenzenes (LABs) as molecular markers for sewage. Concentrations of NP ranged from 18 to 643 ng/g-dry tissue. The highest levels of NP in Malaysia, Singapore, the Philippines, and Indonesia were comparable to those observed in Tokyo Bay. Elevated concentrations of EDCs were not observed in Vietnam and Cambodia, probably due to the lower extent of industrialization in these regions. No consistent relationship between concentrations of phenolic EDCs and LABs were found, suggesting that sewage is not a major source of EDCs. Concentrations of PAHs ranged from 11 to 1,133 ng/g-dry, which were categorized as \"low to moderate\" levels of pollution. The ratio of methylphenanthrenes to phenanthrene (MP/P ratio) was >1.0 in 20 out of 25 locations, indicating extensive input of petrogenic PAHs. This study provides a bench-mark for data on the distribution of anthropogenic contaminants in this region, which is essential in evaluating temporal and spatial variation and effect of future regulatory measures.","grant":"Kurita Water and Environment Foundation (KWEF); Grant-in-Aid from the Ministry of Education of Japan (Project No.15405044) and RR2002 (MEXT)"},"PRA000049":{"id":"PRA000049","title":"Spatial analysis of 4,5-dichloro-2-n-octyl-4-isothiazolin-3-one (Sea-Nine 211) concentrations and probabilistic risk to marine organisms in Hiroshima Bay, Japan","releaseDate":"2017/11/01","doi":"10.1016/j.envpol.2015.05.012","author":"Kazuhiko Mochida","affiliation":"Fisheries Research and Education Agency","abstract":"We analyzed the spatial distribution of an antifouling biocide, 4,5-dichloro-2-n-octyl-4-isothiazolin-3-one (Sea-Nine 211) in the surface water and sediments of Hiroshima Bay, Japan to determine the extent of contamination by this biocide. A quantitative estimate of the environmental concentration distribution (ECD) and species sensitivity distributions (SSDs) for marine organisms were derived by using a Bayesian statistical model to carry out a probabilistic ecological risk analysis, such as calculation of the expected potentially affected fraction (EPAF).  The spatial distribution analysis supported the notion that Sea-Nine 211 is used mainly for treatment of ship hulls in Japan.  The calculated EPAF suggests that approximately up to a maximum of 0.45% of marine species are influenced by the toxicity of Sea-Nine 211 in Hiroshima Bay.  In addition, estimation of the ecological risk with a conventional risk quotient method indicated that the risk was a cause for concern in Hiroshima Bay.","grant":"Grants-in-Aid from the Fisheries Agency of Japan"},"PRA000031":{"id":"PRA000031","title":"Horizontal distribution of steroid estrogens in surface sediments in Tokyo Bay","releaseDate":"2017/04/27","doi":"10.1016/j.envpol.2006.01.030","author":"Tomohiko Isobe","affiliation":"National Institute for Environmental Studies","abstract":"A monitoring survey was conducted to investigate the distribution of steroid estrogens and their conjugates in surface sediments of Tokyo Bay for the first time, which is known as one of the most heavily polluted marine embayments in the world. The surface sediment samples were collected at 20 locations covering the whole area of Tokyo Bay and analyzed for steroid estrogens and their conjugates using liquid chromatography-tandem mass spectrometry. The concentrations of 17β-estradiol (β-E2) and estrone (E1) ranged from ND (below the detection limit; <0.07) to 0.59 and from 0.05 to 3.60 ng g<sup>-1</sup> dry, respectively. Those concentrations were higher in the northern part of the bay, which is directly receiving huge quantities of pollutants from adjacent rivers containing a large amount of municipal and industrial wastewater. 17α-Estradiol (α-E2) and estrone-3-sulfate (E1-3S) were detected in some of the samples, whereas neither of the other conjugates, estriol (E3) or 17α-ethynylestradiol (EE2), was found.","grant":null},"PRA000076":{"id":"PRA000076","title":"[MOE_JP] The Environmental Monitoring in FY2016  (Source: FY2017 Report of Chemicals in the Environment<a href=https://www.env.go.jp/chemi/kurohon/en/http2017e/index.html target=\"_blank\">  English  </a>/<a href=https://www.env.go.jp/chemi/kurohon/2017/index.html target=\"_blank\">  Japanese  </a>)","releaseDate":"2018/10/05","doi":null,"author":"Open data","affiliation":"Ministry of the Environment","abstract":null,"grant":null},"PRA000017":{"id":"PRA000017","title":"Polybrominated diphenyl ethers and persistent organochlorines in Japanese human adipose tissues","releaseDate":"2016/11/25","doi":"10.1016/j.envint.2007.06.006","author":"Shinsuke Tanabe","affiliation":"Ehime University","abstract":"The present study determined concentrations of polybrominated diphenyl ethers (PBDEs) and persistent organochlorines (OCs) in Japanese human adipose tissues collected during 2003-2004. Concentrations of PBDEs in adipose tissues were 1-2 orders of magnitude lower than those of OCs. However, observed PBDE congener levels in this study were relatively higher than those in Japanese human adipose tissues collected during 2000 reported previously, while OC levels were comparable to those in specimens collected during 1999 reported by our group. In addition, no age-dependent accumulation of PBDEs was observed, while OC levels except chlordane compounds increased with age. These results indicate recent human exposure to PBDEs in Japan. Among PBDE congeners accumulated in Japanese adipose tissues, BDE-153 was dominant, but this trend was different from those in human milk (BDE-47) and blood (BDE-209) reported previously in Japan, implying the congener-specific kinetics in human bodies. The significant positive correlations between PBDEs and OCs were observed in Japanese adipose tissues, indicating the similar exposure route of these contaminants for Japanese citizens, probably via fish intake.","grant":"the Global Environmental Research Fund (RF-064) and the Waste Management Research Grant (K1821 and K1836) from the Ministry of the Environment and by Grants-in-Aid for Scientific Research (A) (No.16201014) and (B) (No. 18310046), Young Scientists (B) (Project 19780239) and Global COE Program from the Ministry of Education, Culture, Sports, Science and Technology, and Japan Society for the Promotion of Science (JSPS), and by Grants-in-Aid for Scientific Research (H14-013) from the Ministry of Health, Labour and Welfare, Japan."},"PRA000064":{"id":"PRA000064","title":"Parabens in human urine from several Asian countries, Greece, and the United States","releaseDate":"2018/04/06","doi":"10.1016/j.chemosphere.2018.02.165","author":"Kurunthachalam Kannan","affiliation":"Wadsworth Center (New York State Department of Health)","abstract":"Parabens, esters of para-hydroxybenzoic acid, are commonly used as antimicrobial preservatives in cosmetics and personal care products. Although several studies report exposure of humans to parabens in Western countries, little is known about exposure of humans to parabens in Asian countries. In this study, we determined concentrations of six parabens in spot urine samples collected from nine countries and estimated daily intakes (DI) and potential health risks of parabens. Ethyl-paraben, methyl-paraben, and propyl-paraben were detected frequently at 100, 98.0, and 80.3%, respectively, with representative median concentrations of 0.68, 7.02, and 1.21 ng/mL, respectively, for all nine countries. Urine samples from females (total median concentration: 32.3 ng/mL) contained significantly higher concentrations of parabens than did those from males (5.46 ng/mL). Urine samples from Korea (total median paraben  concentration: 227 ng/mL) had the highest concentrations, which were one to two orders of magnitude higher than those found in other countries (3.67-29.1 ng/mL). The estimated DI of parabens (on the basis of concentrations measured in urine) varied widely, and several samples had propyl-paraben exposures above the acceptable DI. Our results suggest that paraben exposure is ubiquitous in Asian countries, and further assessment of potential health risk of these chemicals is needed.","grant":null},"PRA000100":{"id":"PRA000100","title":"Survey and Risk Assessment of Pharmaceutical and Personal Care Products in Water Environment in Large Cities","releaseDate":"2020/06/22","doi":"10.5985/jec.30.37","author":"Takahiro Nishino","affiliation":"Tokyo Metropolitan Research Institute for Environmental Protection","abstract":"Quantitative analysis of pharmaceuticals and personal care products (PPCPs) in three environmental medias (air, water, and sediment) were carried out via a network of regional environmental research institutes in five large cities (Tokyo, Nagoya, Hyogo, Osaka, and Fukuoka) in Japan. The study took place from FY2016 to FY2018 as a part of a risk assessment for aquatic organisms. Analysis data of water samples from the five cities were carried out at the Tokyo Metropolitan Research Institute for Environmental Protection. The risk assessment for aquatic organisms was carried out by comparing the sample data with the predicted no-effect concentrations (PNECs) gathered from various sources. Concentration levels of five chemicals (clarithromycin, erythromycin, diclofenac, carbamazepine, and triclosan) exceeded the PNECs in several water samples. Concentrations of antibiotics, such as clarithromycin, and antihistamines, such as fexofenadine, tended to be higher during January to February than during June to August. In contrast, concentrations of insect repellents such as N, N-diethyl-m-toluamide (DEET) tended to be higher during June to August than during January to February. The discharge sources of these chemicals would be effluents from plants, such as sewage treatment plants, that were not completely treated. Estimated PPCPs loads accumulated by inflow data of Tamagawa river were compared with measured load value in this study. For some of these chemicals, such as fexofenadine and diclofenac, estimated loads did not coincide with measured loads at sampling points along the Tamagawa River. These differences were thought to occur as the consumption of fexofenadine increased rapidly during the research period, and diclofenac photodegraded while flowing down the river.","grant":"Environment Research and Technology Development Fund (5-1602) of the Ministry of the Environment, Japan"},"PRA000070":{"id":"PRA000070","title":"Polychlorinated dibenzo-p-dioxins and polychlorinated dibenzofurans in shellfishes from south coast of Korea","releaseDate":"2018/06/22","doi":"10.1016/S0045-6535(98)00097-6","author":"Shunji Hashimoto","affiliation":"National Institute for Environmental Studies","abstract":"PCDDs and PCDFs were analyzed by high resolution GC-MS in two species of shellfish collected from southern coast of Korea. PCDDs and PCDFs were detected from all samples. Total concentration of PCDDs and PCDFs ranged from 4.4 to 19 pg/g wet weight and from 2.5 to 26 pg/g wet weight, respectively. By using a method of cluster analysis based on congener profiles, samples were categorized into two groups, “the urban group” and “the rural group”. A tendency that TEQ levels of the urban group were higher than those of the other group was observed. Although a reliable source of dioxins in the samples was identified in this study, it was suggested that combustion sources are responsible for occurrence of dioxins in samples of both groups.","grant":null},"PRA000041":{"id":"PRA000041","title":"Pollution of radiocesium and radiosilver in wharf roach (<i>Ligia</i> sp.) by the Fukushima Dai-ichi Nuclear Power Plant accident","releaseDate":"2017/08/09","doi":"10.1007/s10967-016-4879-1","author":"Yuji Oshima","affiliation":"Kyushu University","abstract":"Radionuclide concentrations in wharf roaches inhabiting coastal areas of Honshu, Japan, were investigated in October 2011 and June 2012. Relative high concentrations of <sup>110m</sup>Ag (2.1-127 Bq kg-wet<sup>-1</sup>), <sup>134</sup>Cs (2.6-61 Bq kg-wet<sup>-1</sup>), and <sup>137</sup>Cs (3.5-92 Bq kg-wet<sup>-1</sup>) were detected in specimens from the eastern Honshu areas. Significantly lower <sup>137</sup>Cs concentrations (0.7-1.6 Bq kg-wet<sup>-1</sup>) were detected in specimens from western and northern Honshu. The decay-corrected <sup>137</sup>Cs concentration was significantly inversely correlated with the distance from the Fukushima Dai-ichi Nuclear Power Plant. Thus, wharf roach may serve as a good bioindicator for monitoring radioactive contamination of its habitats.","grant":"JKA Foundation and the cooperative research program of Institute of Nature and Environmental Technology, Kanazawa University Accept No. 5 in 2015"},"PRA000073":{"id":"PRA000073","title":"Simple sampling and analysis of PCDDs and PCDFs in Japanese coastal seawater.","releaseDate":"2018/07/02","doi":"10.1016/0045-6535(95)00079-N","author":"Shunji Hashimoto","affiliation":"National Institute for Environmental Studies","abstract":"Seawater from Japanese coastal areas was extracted with a XAD-2 resin column for a study of PCDDs and PCDFs. 1.3 - 2.9 pg/L of PCDDs were detected, but no PCDFs were found. The most of detected PCDDs was OctaCDD and some HeptaCDDs. This isomer pattern is similar to non-polluted atmosphere and sediment. We could not define the source of PCDDs in seawater. However it is of interest that the composition of PCDDs in seawater is similar to natural dioxin found in ancient oceanic sediment.","grant":null},"PRA000122":{"id":"PRA000122","title":"[MOE_JP] The Initial Environmental Survey in FY2020 (Source: FY2021 Report of Chemicals in the Environment<a href=https://www.env.go.jp/chemi/kurohon/en/http2021e/index.html target=_blank> English </a>/<a href=https://www.env.go.jp/chemi/kurohon/2021/index.html target=_blank> Japanese </a>)","releaseDate":"2022/10/17","doi":null,"author":"Open data","affiliation":"Ministry of the Environment","abstract":null,"grant":null},"PRA000053":{"id":"PRA000053","title":"Determination of isotopic composition of atmospheric mercury in urban-industrial and coastal regions of Chiba, Japan, using cold vapor multicollector inductively coupled plasma mass spectrometry","releaseDate":"2017/11/29","doi":"10.1016/j.chemgeo.2016.11.010","author":"Akane Yamakawa","affiliation":"National Institute for Environmental Studies (NIES)","abstract":"This study presents a method for the isotope analysis of gaseous elemental mercury (GEM, Hg<sup>0</sup><sub>(g)</sub>) using cold vapor multicollector inductively coupled plasma mass spectrometry. Isotopic compositions of Hg in the atmospheric samples collected from urban-industrial (Ichikawa) and coastal (South Boso Peninsula) regions in Chiba, Japan were investigated. Values of mass-dependent fractionation (MDF) of δ<sup>202</sup>Hg range from −2.36‰ to −0.11‰ and mass-independent fractionation (MIF) of Δ<sup>199</sup>Hg range between −0.31‰ and 0.01‰. There was a rough linear correlation between δ<sup>202</sup>Hg values and Hg concentrations of our GEM samples (r<sup>2</sup> = 0.31, p < 0.05). Also, Δ<sup>99</sup>Hg values were positively correlated with SO<sub>2</sub> concentrations; however, air mass source(s) was not identified using NOAA Hybrid Single-Particle Lagrangian Integrated Trajectory model. We suggest that our sampling site, Ichikawa, was largely impacted by nearby anthropogenic sources (high GEM concentration with low δ<sup>202</sup>Hg value), and a mixing with back ground air (low GEM concentration with high δ<sup>202</sup>Hg value).","grant":null},"PRA000009":{"id":"PRA000009","title":"Spatial trends of polybrominated diphenyl ethers in avian species: Utilization of stored samples in the Environmental Specimen Bank of Ehime University (<i>es</i>-Bank)","releaseDate":"2016/10/06","doi":"10.1016/j.envpol.2007.10.013","author":"Shinsuke Tanabe","affiliation":"Ehime University","abstract":"The present study determined concentrations and patterns of polybrominated diphenyl ethers (PBDEs) and polychlorinated biphenyls (PCBs) in specimens f open sea, and Japanese coastal and inland avian species, which have been stored in the Environmental Specimen Bank of Ehime University (<i>es</i>-Bank), to examine the spatial trends. PBDEs and PCBs were detected in all the muscle samples analyzed, suggesting that PBDE pollution has spread even to the remote open sea areas, as in the case of PCBs. Japanese coastal and inland birds accumulated higher concentrations of PBDEs than open sea birds. In addition, higher PBDE/PCB concentration ratios were observed in Japanese coastal and inland birds than in open sea birds, indicating the input of PBDEs into the Japanese terrestrial environment. Compositions of PBDEs varied among avian species with a predominance of BDE47 or BDE153. This could be due to differences in their habitat, food habit and/or biotransformation capacity of PBDEs.","grant":"The Global Environmental Research Fund (RF-064) and the Waste Management Research Grant (K1821 and K1836) from the Ministry of the Environment and by Grants-in-Aid for Scientific Research (A) (No.16201014) and (B) (No. 18310046), Young Scientists (B) (Project 19780239) and Global COE Program from the Ministry of Education, Culture, Sports, Science and Technology, Japan (MEXT) and Japan Society for the Promotion of Science (JSPS)"},"PRA000095":{"id":"PRA000095","title":"[LOC_JP] Survey on Perfluorinated chemicals in Aquatic Environment in Hokkaido ( Source: <a href=https://www.hro.or.jp/list/environmental/research/ies/develop/publication/Report/H24/39_41_51.pdf target=_blank>Report of Institute of Environmental Sciences No. 3 (No. 39)</a> )","releaseDate":"2019/07/26","doi":null,"author":"Ruriko Tahara","affiliation":"Hokkaido Research Organization","abstract":"The concentrations of perfluorinated chemicals(PFCs) in rivers in Hokkaido were determined. Remarkable contamination by PFCs was not found in the surveyed rivers. The detected compounds and their concentrations were different in each area. In Ishikari River, the PFC concentrations were higher than in the other rivers. Among the PFCs, high molecular perfluorocarboxylic acids were detected in especially high concentrations, but perfluorosulfonates were rarely detected. In contrast, in Chitose River and Tonebetsu River, various PFCs including perfluorosulfonates were detected. PFOS and/or PFHxS were detected around airports, probably due to the use of fire extinguishers. PFC contamination from industrial facilities was also detected in paper mill effluents. These compounds would be used as the surface treatment of paper products.","grant":null},"PRA000105":{"id":"PRA000105","title":"Characterization of mono- to deca-chlorinated biphenyls in a well-preserved sediment core from Beppu Bay, Southwestern Japan: Historical profiles, emission sources, and inventory","releaseDate":"2020/09/25","doi":"10.1016/j.scitotenv.2020.140767","author":"Shin Takahashi","affiliation":"Ehime University","abstract":"Contamination levels and profiles of mono- to deca-chlorinated biphenyls (PCBs) were characterized in a sediment core dated in 1954_2011 from Beppu Bay, southwestern Japan, providing a comprehensive and detailed picture on the environmental occurrence, temporal trends, and emission sources of these pollutants in the study area. Concentrations of total PCBs in the core ranged from 3.5 to 150 (median 15) ng g<sup>−1</sup> dry weight and exhibited depth profile matching with Japanese PCB production and emission patterns (i.e., drastically increasing from the early 1960s, peaking in 1970, and then rapidly decreasing). Origin of PCBs in the studied samples largely associated with Kanechlor mixtures (e.g., KC-300 and KC-400), especially for sediment layers dated between the mid-1960s and early 1970s (i.e., the intensive PCB production period in Japan). In addition, dechlorination and weathering signals and emerging inputs of PCBs were also observed in deeper and shallower sediment segments with notable proportions of some unique congeners such as CB-47/48/51 and CB-11, respectively. Historical fluxes of PCBs in our samples showed quite similar vertical shape as concentrations. In the context of national implementation for complete treatment of PCB-containing waste until 2024, further investigations on spatiotemporal trends and environmental loads of PCBs in Japan are necessary.","grant":"The Environment Research and Technology Development Fund (SII-3-2) of the Environmental Restoration and Conservation Agency of Japan (ERCA)"},"PRA000069":{"id":"PRA000069","title":"Polychlorinated dibenzo-p-dioxins and dibenzofurans in invertebrate animals from a rural beach in Japan","releaseDate":"2018/06/19","doi":"10.1016/S0045-6535(99)00201-5","author":"Shunji Hashimoto","affiliation":"National Institute for Environmental Studies","abstract":"PCDDs and PCDFs were analyzed by high resolution GC-MS in several invertebrate animals collected from a rural beach in Japan. PCDDs and PCDFs were detected in all samples. Total concentration of PCDDs and PCDFs ranged 8.8_120 pg g<sup>−1</sup> wet and 3.5_38 pg g<sup>−1</sup> wet, respectively. TEQs of invertebrate animals examined ranged from 0.048 pg g<sup>−1</sup> wet in sea slug to 0.91 pg g<sup>−1</sup> wet in mussel. Isomer profiles in all samples were similar to each other despite of variety of species. Their major sources are estimated to be herbicides such as CNP and PCP, and combustion by using a statistical analysis of isomer profiles.","grant":null},"PRA000119":{"id":"PRA000119","title":"[MOE_JP] The Detailed Environmental Survey in FY2019 (Source: FY2020 Report of Chemicals in the Environment<a href=https://www.env.go.jp/chemi/kurohon/en/http2020e/index.html target=_blank> English </a>/<a href=https://www.env.go.jp/chemi/kurohon/2020/index.html target=_blank> Japanese </a>)","releaseDate":"2022/05/06","doi":null,"author":"Open data","affiliation":"Ministry of the Environment","abstract":null,"grant":null},"PRA000114":{"id":"PRA000114","title":"A preliminary investigation of 942 organic micro-pollutants in the atmosphere in waste processing and urban areas, northern Vietnam: Levels, potential sources, and risk assessment","releaseDate":"2021/02/05","doi":"10.1016/j.ecoenv.2018.10.026","author":"Shin Takahashi","affiliation":"Ehime University","abstract":"Of 942 organic micro-pollutants screened, 167 compounds were detected at least once in the atmosphere in some primitive waste processing sites and an urban area in northern Vietnam by using a polyurethane foam-based passive air sampling (PUF_PAS) method and an Automated Identification and Quantification System with a Database (AIQS_DB) for GC_MS. Total concentrations of organic pollutants were higher in samples collected from an urban area of Hanoi city (2300_2600 ngm<sup>_3</sup>) as compared with those from an end-of-life vehicle (ELV) dismantling area in Bac Giang (900_1700 ngm<sup>_3</sup>) and a waste recycling cooperative in Thai Nguyen (870_1300 ngm<sup>_3</sup>). Domestic chemicals (e.g., n-alkanes, phthalate ester plasticizers, and synthetic phenolic antioxidants) dominated the organic pollutant patterns in all the samples, especially in the urban area. Pesticides (e.g., permethrins, chlorpyrifos, and propiconazole) were found in the atmosphere around the ELV sites at more elevated concentrations than the other areas. Levels of polycyclic aromatic hydrocarbons and their derivatives in the Bac Giang and Thai Nguyen facilities were significantly higher than those measured in Hanoi urban houses, probably due to the waste processing activities. Daily intake doses of organic pollutants via inhalation were estimated for waste processing workers and urban residents. This study shall provide preliminary data on the environmental occurrence, potential emission sources, and effects of multiple classes of organic pollutants in urban and waste processing areas in northern Vietnam.","grant":"Grants-in-Aid for Scientific Research (B: 16H02963) from the Japan Society for the Promotion of Science (JSPS); the Environment Research and Technology Development Fund (3K153001) from the Japanese Ministry of the Environment"},"PRA000024":{"id":"PRA000024","title":"PCDD, PCDF, dl-PCB and organochlorine pesticides monitoring in Sao Paulo City using passive air sampler as part of the Global Monitoring Plan","releaseDate":"2017/02/06","doi":"10.1016/j.scitotenv.2016.07.173","author":"M.Y. Tominaga","affiliation":"Sao Paulo State Environmental Company","abstract":"The persistent organic pollutants (POPs), such as organochlorine pesticides and PCBs, are ordinarily monitored in the aquatic environment or in soil in the environmental quality monitoring programs in Sao Paulo, Brazil. One of the core matrices proposed in the POPs Global Monitoring Plan (GMP) from the Stockholm Convention list is the ambient air, which is not a usual matrix for POPs monitoring in the country. In this study POP levels were evaluated in the air samples from an urban site in Sao Paulo City over five years, starting in 2010 as a capacity building project for Latin America and the Caribbean region for POP monitoring in ambient air using passive samplers. Furthermore, after the end of the Project in 2012, the monitoring continued in the same sampling site as means to improving the analytical capacity building and contribute to the GMP data. The POPs monitored were 17 congeners of 2,3,7,8 chloro-substituted PCDDs and PCDFs, dioxin-like PCBs, indicator PCBs, organochlorine pesticides and toxaphene. The results show a slight decrease in PCDD/F, dl-PCBs and indicator PCBs levels along the five years. The organochlorine pesticide endosulfan was present at its highest concentration at the beginning of the monitoring period, but it was below detection level in the last year of the monitoring. Some other organochlorine pesticides were detected close to or below quantitation limits. The compounds identified were dieldrin, chlordane, alpha-HCH, gamma-HCH, heptachlor, heptachlor epoxide, hexachlorobenzene and DDTs. Toxaphene congeners were not detected. These results have confirmed the efficacy of passive sampling for POP monitoring and the capacity building for POP analysis and monitoring was established. However more needs to be done, including expansion of sampling sites, new POPs and studies on sampling rates to be considered in calculating the concentration of POPs in ambient air using a passive sampler.","grant":"the UNEP/GEF project and the CSIC/Spain, the Ministry of Environment "},"PRA000003":{"id":"PRA000003","title":"Contamination status of POPs and BFRs and relationship with parasitic infection in finless porpoises (<i>Neophocaena phocaenoides</i>) from Seto Inland Sea and Omura Bay, Japan","releaseDate":"2016/07/22","doi":"10.1016/j.marpolbul.2011.01.014","author":"Tomohiko Isobe","affiliation":"National Institute for Environmental Studies","abstract":"Contamination status of brominated flame retardants (BFRs) and persistent organic pollutants (POPs) in blubber of finless porpoises (<i>Neophocaena phocaenoides</i>) stranded along the coasts of Seto Inland Sea and Omura Bay in Japan were investigated. Levels of PCBs, DDTs and CHLs were significantly higher than those of HCHs, HCB, PBDEs and HBCDs. Concentrations of PBDEs and HBCDs, as well as organochlorine compounds in males increased with body length (p < 0.05). Among 14 PBDE congeners analyzed, BDE47 was the predominant, which is similar to those generally reported in biota. PBDEs, HBCDs and PCBs showed no obvious temporal trend in concentrations during the study period, suggesting continuous environmental release of these chemicals. On the other hand, levels of DDT, CHLs and HCHs have decreased. Concentrations of PCBs in liver trematode infected individuals were significantly higher than those in not infected individuals, implying there could be a relationship between contaminant levels and parasitic infection.","grant":"Scientific Research (S:  20221003, B: 21310043)"},"PRA000066":{"id":"PRA000066","title":"[MOE_JP] The Initial Environmental Survey in FY2015  (Source: FY2016 Report of Chemicals in the Environment<a href=https://www.env.go.jp/chemi/kurohon/en/http2016e/index.html target=\"_blank\"> English </a>/<a href=https://www.env.go.jp/chemi/kurohon/2016/index.html target=\"_blank\"> Japanese </a>)","releaseDate":"2018/05/07","doi":null,"author":"Open data","affiliation":"Ministry of the Environment","abstract":null,"grant":null},"PRA000094":{"id":"PRA000094","title":"Occurrence of neonicotinoids and fipronil in estuaries and their potential risks to aquatic invertebrates","releaseDate":"2019/06/24","doi":"10.1016/j.envpol.2019.05.067","author":"Takeshi Hano","affiliation":"Fisheries Research  and Education Agency","abstract":"This study aimed to evaluate and qualify field-based potential risks of seven neonicotinoid and phenylpyrazole (fipronil) insecticides on aquatic invertebrates, including estuary-resident marine crustaceans. One hundred and ninety-three estuarine water samples, with salinity ranging from 0.5 to 32.7, were collected from four estuarine sites in the Seto Inland Sea of Japan, in 2015_2018 and the insecticide levels were measured. Five neonicotinoid and fipronil insecticides were successfully identified, and their occurrence varied temporally. Marine crustaceans were simultaneously harvested every month from one of the estuarine water sampling sites in 2015_2017. Three predominant crustacean species, kuruma prawn (<i>Penaeus japonicus</i>), sand shrimp (<i>Crangon uritai</i>), and mysid (<i>Neomysis awatschensis</i>), were captured and their seasonal presence was species independent. A 96-h laboratory toxicity study with the insecticides using kuruma prawn, sand shrimp, and a surrogate mysid species (<i>Americamysis bahia</i>) indicated that fipronil exerted the highest toxicity to the three crustaceans. Using both toxicity data and insecticide occurrence in estuarine water (salinity ≥10, n = 169), the potential risks on the three marine crustaceans were quantified by calculating the proportion of mixture toxicity effects (P<sub>mix</sub>). The P<sub>mix</sub> of seven neonicotinoids on the crustaceans was less than 0.8%, which is likely to be too low to indicate adverse effects caused by the insecticides. However, short temporal detection of fipronil (exclusively in June and July) significantly affected the P<sub>mix</sub>, which presented the maximal P<sub>mix</sub> values of 21%, 3.4%, and 72% for kuruma prawn, sand shrimp, and mysid, respectively, indicating a significant effect on the organisms. As for estuarine water (salinity <10), some water samples contained imidacloprid and fipronil exceeding the freshwater benchmarks for aquatic invertebrates. The present study provides novel insights into the seasonally varying risks of insecticides to estuarine crustaceans and highlights the importance of considering whether ecological risk periods coincide with crustacean presence.","grant":"JSPS KAKENHI (Grant Number 16H04962)"},"PRA000083":{"id":"PRA000083","title":"[LOC_JP] Measurement Results of Water Quality in Public Waters of Fukuoka Pref.  ( Source: <a href=https://www.pref.fukuoka.lg.jp/contents/28koukyouyousuiiki.html target=_blank>FY2016 report</a> )","releaseDate":"2019/03/05","doi":null,"author":"Open data","affiliation":"Fukuoka Prefecture","abstract":null,"grant":null},"PRA000004":{"id":"PRA000004","title":"PCDDs, PCDFs, and coplanar PCBs in wild terrestrial mammals from Japan: Congener specific accumulation and hepatic sequestration","releaseDate":"2016/08/29","doi":"10.1016/j.envpol.2005.07.020","author":"Shinsuke Tanabe","affiliation":"Ehime University","abstract":"The present study determined the contamination levels and congener-specific accumulation features of dioxins and related compounds (DRCs) in wild terrestrial mammals such as large Japanese field mice (LJFM), lesser Japanese moles (LJMs), and raccoon dogs (RDs) collected from Kanto region in Japan during 2001. The toxic equivalent quantity (TEQ) levels in the carcasses or adipose tissues were in the order of RDs ≥ LJMs > LJFM. Comparison of DRC congener profiles in the three species and principal component analysis (PCA) demonstrated a higher conribution of OCDD, T<sub>4</sub>CB77, and P<sub>5</sub>CB118 in LJMs. Analysis of liver-adipose distribution of DRC congeners in RDs showed that livers contained significantly higher TEQs than adipose tissues, indicating that liver is a depository organ and critical for determining the toxicokinetics of DRCs. As for most T<sub>4</sub>, P<sub>5</sub>, H<sub>6</sub>CDD/DFs and for P<sub>5</sub>CB126, H<sub>6</sub>CB169 and mono-<i>ortho</i> PCB congeners, their liver/adipose concentraiton ratios in RDs revealed a tendency to increase with hepatic TEQ levels, suggesting TEQ-dependent hepatic sequestration.","grant":"Grants-in-Aid for Scientific Research (A) (No. 16201014) and (B) (No. 13480170) from Japan Society for the Promotion of Science and for Scientific Research on Priority Areas (A) (No. 13027101) and 21st Century COE Program from the Ministry of Education, Culture, Sports, Science and Technology, Japan, and by Grants for Integrated Research program on effects of endocrine disrupters on agriculture, forestry, and fisheries"},"PRA000002":{"id":"PRA000002","title":"Temporal and spatial trends of organotin contamination in the livers of finless porpoises (<i>Neophocaena phocaenoides</i>) and their association with parasitic infection status","releaseDate":"2016/06/27","doi":"10.1016/j.scitotenv.2009.08.043","author":"Kei Nakayama","affiliation":"Ehime University","abstract":"Organotins (OTs) are globally ubiquitous contaminants. Contamination of OTs, particularly butyltins (BTs), has been suspected to cause immunosuppressive effects leading to subsequent infectious diseases or opportunistic infection by pathogens in marine mammals. In the present study, we collected individuals from five different populations of finless porpoises (<i>Neophocaena phocaenoides</i>) from coastal areas of Japan (Seto Inland Sea, Ise Bay, Omura Bay, and Pacific coast) and Hong Kong, and measured OT concentrations in their livers. In addition, infection status of lung nematodes and liver trematodes was also observed to analyze the relationship between OT contamination and parasitic infection in finless porpoises. Hepatic OT concentrations were highest in the Hong Kong population, while levels in the Japanese populations were equivalent to those of other cetaceans from different locations. OT levels in Japan have been decreasing in the past few decades, while OT contamination has shown little improvement in Hong Kong. Observation of parasite infection in Seto Inland Sea porpoises revealed that 16 and 11 out of 22 individuals were infected by lung nematodes and liver trematodes, respectively. Additionally, a significant association between BT levels and parasitic infection status of lung nematodes was detected. Thus, the present study suggests that BTs could be a factor affecting parasitic infection, especially the presence or severity of lung nematodes in finless porpoises. Since chemical exposure may alter the susceptibility of organisms to infectious diseases, the interaction of chemical contamination with infectious diseases needs to be investigated in greater depth to understand the risk of population decline due to these factors in marine mammals.","grant":"Grants-in-Aid for Scientific Research (S) (No. 20221003) from Japan Society for the Promotion of Science"},"PRA000102":{"id":"PRA000102","title":"Ecological risk assessment of an antifouling biocide triphenyl  (octadecylamine) boron in the Seto Inland Sea, Japan","releaseDate":"2020/07/01","doi":"10.1016/j.marpolbul.2020.111320","author":"Toshimitsu Onduka","affiliation":"Japan Fisheries Research and Education Agency","abstract":"In this study, we derived the predicted no-effect concentrations (PNEC) for triphenyl (octadecylamine) boron (TPB-18) and investigated the occurrence of triphenylboranes (TPBs), including TPB-18, for ecological risk assessment in the Seto Inland Sea, Japan. We tested algal growth inhibition, crustacean immobilization, and reproductive toxicity and performed toxicity tests in fish to assess acute and chronic toxicity and generate the PNEC for TPB-18. The minimum toxicity value was 0.30 μg/L, as determined by the 72-h no-observed-effect concentration (NOEC) for the alga <i>Chaetoceros gracilis</i>. The 5th-percentile of hazardous concentration (HC5), derived from NOECs using the species sensitivity distributions approach, was 0.059 μg/L, which indicated the PNEC of 0.0059 μg/L. In comparison, the highest concentration in seawater sampled from the Seto Inland Sea was 0.00034 μg/L, suggesting that the ecological risks posed by TPB-18 are currently low.","grant":"A grant-in-aid from NITTO SEIMO, Co., Ltd., Japan (partly supported)"},"PRA000022":{"id":"PRA000022","title":"Hypoxia-Induced Exposure of Isaza Fish to Manganese and Arsenic at the Bottom of Lake Biwa, Japan: Experimental and Geochemical Verification","releaseDate":"2017/02/09","doi":"10.1021/es300376y","author":"Takaaki Itai","affiliation":"The Uniersity of Tokyo","abstract":"In December 2007, a mass mortality of isaza (<i>Gymnogobius isaza</i>), a goby fish in Lake Biwa, Japan, was observed under severe hypoxia. Considering the level of manganese and arsenic in the dead isaza during the event was much higher than that in live isaza, hypoxia-induced mobilization of manganese and arsenic and subsequent exposure could be the reason for this adverse effect. However, secondary accumulation of manganese and arsenic after the mortality event could not be ruled out. To test this hypothesis, we conducted tissue distribution/speciation analysis and absorption tests on dead specimens. All the results, particularly the limited absorption of arsenic in the absorption tests, indicated that the isaza were exposed to arsenic before the mortality event. Parallel to this, the geochemical behavior of manganese and arsenic in oxygen-rich conditions (June) and oxygen-poor conditions (December) was investigated to verify the mechanism of exposure. Considerable enrichment of manganese and arsenic in a thin surface layer of sediment was a common feature in all seven stations studied. In the water at the bottom of the lake, a clear increase of arsenite in December was observed, and the manganese level was several hundred times higher in both seasons than the average level of the lake. Although further verification is needed, the data provided here support exposure to manganese and arsenic under hypoxia.","grant":" a Grant-in-Aid for Scientific Research for Young Scientists provided by the Ministry of Education, Culture, Sports, Science, and Technology, Japan (MEXT),  a Research Grant for Young Scientists in the Global Center of Excellence Program of Ehime University, Center of Excellence for Interdisciplinary Studies on Environmental Chemistry from MEXT, and the Japan Society for the Promotion of Science (JSPS)"},"PRA000099":{"id":"PRA000099","title":"[MOE_JP] The Environmental Monitoring in FY2017 (Source: FY2018 Report of Chemicals in the Environment<a href=https://www.env.go.jp/chemi/kurohon/en/http2018e/index.html target=_blank> English </a>/<a href=https://www.env.go.jp/chemi/kurohon/2018/index.html target=_blank> Japanese </a>)","releaseDate":"2019/11/28","doi":null,"author":"Open data","affiliation":"Ministry of the Environment","abstract":null,"grant":null},"PRA000075":{"id":"PRA000075","title":"[MOE_JP] The Detailed Environmental Survey in FY2016  (Source: FY2017 Report of Chemicals in the Environment<a href=https://www.env.go.jp/chemi/kurohon/en/http2017e/index.html target=\"_blank\"> English </a>/<a href=https://www.env.go.jp/chemi/kurohon/2017/index.html target=\"_blank\"> Japanese </a>)","releaseDate":"2018/09/20","doi":null,"author":"Open data","affiliation":"Ministry of the Environment","abstract":null,"grant":null},"PRA000106":{"id":"PRA000106","title":"Polyurethane foam-based passive air sampling for simultaneous determination of POP- and PAH-related compounds: A case study in informal waste processing and urban areas, northern Vietnam","releaseDate":"2020/10/12","doi":"10.1016/j.chemosphere.2020.125991","author":"Shin Takahashi","affiliation":"Ehime University","abstract":"Polychlorinated biphenyls (PCBs), polybrominated diphenyl ethers (PBDEs), hexabromobiphenyl (BB-153), novel brominated flame retardants (NBFRs), and unsubstituted/methylated polycyclic aromatic hydrocarbons (PAHs/Me-PAHs) were simultaneously monitored in the air samples collected from Vietnamese urban and vehicular waste processing areas by using polyurethane foam-based passive air sampling (PUFePAS) method. Concentrations (pg/m<sup>3</sup>) of organic pollutants decreased in the order: PAHs (median 29,000; range 5100-100,000) > Me-PAHs (6000; 1000-33,000) > PCBs (480; 170-1100) > PBDEs (11; 5.3-86) > NBFRs (0.20; n.d.-51) > BB-153 (n.d.). The difference in total PCB and PBDE concentrations between the urban and waste processing air samples was not statistically significant. Meanwhile, levels of PAHs, Me-PAHs, benzo[a]pyrene equivalents (BaP-EQs), and toxic equivalents of dioxin-like PCBs (WHO-TEQs) were much higher in the waste processing sites. This is the first report on the abundance of mono- and di-CBs (notably CB-11) in the air from a developing country, suggesting their roles as emerging and ubiquitous air pollutants. Our results have indicated potential sources of specific organic pollutants such as dioxin-like PCBs, PAHs, and Me-PAHs from improper treatment of end-of-life vehicles and other vehicle related materials (e.g., waste oils and rubber tires), as well as current emission of PCBs and PBDEs in the urban area in Vietnam. Further atmospheric monitoring studies should be conducted in this developing country that cover both legacy and emerging contaminants with a focus on areas affected by rapid urbanization and informal waste processing activities.","grant":"Grants-in-Aid for Scientific Research (B: 16H02963); Fund for the Promotion of Joint International Research (Fostering Joint International Research (B)) (18KK0300) from the Japan Society for the Promotion of Science (JSPS); the Environment Research and Technology Development Fund (3K153001) from the Japanese Ministry of the Environment"},"PRA000026":{"id":"PRA000026","title":"Occurrence of several arsenic compounds in the liver of birds, cetaceans, pinnipeds, and sea turtles","releaseDate":"2017/02/23","doi":"10.1002/etc.5620220603","author":"Shinsuke Tanabe","affiliation":"Ehime University","abstract":"Concentrations of total arsenic and individual arsenic compounds were determined in livers of birds, cetaceans, pinnipeds, and sea turtles by using hydride generation-atomic absorption spectrometry and high-performance liquid chromatography/inductively coupled plasma-mass spectrometry. Hepatic arsenic concentrations in loggerhead turtles (11.2 ± 3.0 µg/g dry wt) and black-footed albatrosses (12.2 ± 10.8 µg/g dry wt) were extremely high among the species examined, and the values were comparable with those of lower trophic marine animals such as fishes, cephalopods, crustaceans, and shellfishes. In all the species, arsenobetaine was the predominant arsenic compound in the livers. Especially, for black-footed albatrosses and black-tailed gull, the mean percentage of arsenobetaine was as high as 97.1 and 87.5, respectively, of extractable arsenic. The present study is among the first on arsenic speciation in avian species. Total arsenic concentration was strongly correlated with the concentration of arsenobetaine, while no significant relationship was observed between total arsenic concentration and other arsenic compounds in these animals. Because arsenobetaine is known to be rapidly excreted into the urine in humans and experimental animals, the observed results suggest that higher trophic marine animals might have a unique metabolism of arsenobetaine and that arsenobetaine plays an important role in the accumulation of arsenic in these animals.","grant":"Grants-in-Aid for Scientific Research (A) (12308030) from the Japanese Society for the Promotion of Science and for Young Scientists (B) (14780426) and Scientific Research on Priority Areas (A) (13027101) from the Ministry of Education, Culture, Sports, Science, and Technology, Japan"},"PRA000023":{"id":"PRA000023","title":"Background Levels of PAHs in the Coastal Waters of Japan Based on Residual Concentrations of Bivalves","releaseDate":"2017/01/27","doi":"10.5985/jec.20.137","author":"Hiroyuki Tanaka","affiliation":"Fisheries Research and Education Agency","abstract":"Polycyclic aromatic hydrocarbons (PAHs) concentrations in the bivalves were measured to elucidate the background levels of PAHs in the coastal waters of Japan. Seven species of bivalves, mainly <i>Mytilus galloprovincialis</i> and <i>Septifer virgatus</i> were collected in 64 sites. Eighteen kinds of PAHs having two to six rings were analyzed in 137 samples. The range and median of ∑PAHs concentrations were 1.6-140 ng/g wet wt and 19 ng/g wet wt, respectively. There were no significant differences in the ∑PAHs concentrations among species. The high ∑PAHs concentrations sites were mainly observed in the Pacific coast of the south of Kanto region and around the Inland Sea. Two concentration ratios (methylphenanthrene/phenanthrene and  4,5-methylenephenanthrene/methylphenanthrene) were examined in order to identify PAHs sources. Those results suggested the source of PAHs was mainly from combustion. And the sites where the influence of oil spill had been expected were observed in the coasts of Chugoku, Shikoku, and Kyushu regions.","grant":"Development Fund, Research on Dynamics of Nitroarenes in Inner Bay Region and Influence on Marine Organisms from the Ministry of the Environment, Japan"},"PRA000127":{"id":"PRA000127","title":"Multi-target analyses of persistent organic pollutants, halogenated natural products, and organophosphate esters in bivalves from Seto Inland Sea, Japan: Residue levels, profiles, and spatial trends","releaseDate":"2025/2/12","doi":"https://doi.org/10.1016/j.scitotenv.2025.178801","author":"Tatsuya Kunisue","affiliation":"Ehime University","abstract":"Comprehensive monitoring studies on the multiple exposure status to persistent organic pollutants (POPs), halogenated natural products (HNPs), and organophosphate esters (OPEs) of coastal biota are quite limited worldwide, especially for wild sessile bivalves. The present study performed multi-target analyses of POPs, HNPs, and OPEs in mussel and oyster samples collected in 2017 and 2019 from the coastal areas of Seto Inland Sea, the largest semi-enclosed sea in Japan. For OPEs, we established a highly accurate analytical method applicable for bivalve soft tissue samples, with minimal blank contamination. Multi-target analyses based on gas and liquid chromatography/mass spectrometry revealed the ubiquity of not only legacy but also emerging compounds in the coastal areas of Seto Inland Sea. However, clear differences in the spatial distribution patterns of POPs, HNPs, and OPEs were observed, indicating the presence of compound-specific local emission sources in the coastal environment. Interestingly, several aryl- and chlorinated-OPEs, including triphenyl phosphate (TPHP), tricresyl phosphate (TMPP), tris(2-chloroisopropyl) phosphate (TCIPP), and tris(1,3-dichloroisopropyl) phosphate (TDCIPP), were found in the bivalve samples with detection frequencies > 50%, and the residue levels of these OPE compounds were higher than those of the major hexabromocyclododecanes and polybrominated diphenyl ethers at almost all the sampling points. These results might be attributed to the increasing demand of OPEs as alternatives after the regulation of such hazardous brominated flame retardants (BFRs). Especially, considering that TCIPP has the lowest log octanol/water partition coefficient (log Kow) and thus the lowest bioaccumulation potential among the above OPEs and BFRs, but still accumulate at relatively higher concentrations in the bivalves, substantial amount of TCIPP input into the coastal areas of Seto Inland Sea and subsequent exposure for organisms can be suggested.","grant":"Grants-in-Aid (KAKENHI) for Scientific Research (A) (No. 23H00533) from Japan Society for the Promotion of Science (JSPS) and the Ministry of Education, Culture, Sports, Science and Technology, Japan (MEXT) to a project on Joint/Research Center - Leading Academia in Marine and Environment Pollution Research (LaMer)"},"PRA000065":{"id":"PRA000065","title":"Urinary levels of triclosan and triclocarban in several Asian countries, Greece and the USA: Association with oxidative stress","releaseDate":"2018/05/02","doi":"10.1016/j.envres.2017.09.021","author":"Kurunthachalam Kannan","affiliation":"Wadsworth Center (New York State Department of Health)","abstract":"Triclosan (TCS) and Triclocarban (TCC) are widely used as antimicrobial preservatives in personal care products (PCPs). Because of their potential for endocrine disrupting effects, human exposure to these chemicals is a concern. Biomonitoring studies of human exposure to TCS and TCC have shown widespread exposure of populations in western European countries and the USA. However, exposure to TCC and TCS by populations in Asian countries is less well known. In this study, concentrations of TCS and TCC were determined in human urine collected from seven Asian countries (China, India, Korea, Kuwait, Japan, Saudi Arabia, and Vietnam), and Greece and the USA. A total of 430 urine samples were analyzed for TCS and TCC, of which 355 (83%) and 82 (19%), respectively, contained measurable levels of these chemicals. The overall geometric mean [GM] concentrations of TCS and TCC, were 1.36 and 0.03 ng/mL, respectively. The highest mean concentration of TCS was found in urine from China (100 ng/mL) and the lowest concentration was found in urine from Vietnam (2.34 ng/mL). We also analyzed urinary 8-OHdG, a marker of oxidative stress, to elucidate the association with TCS and TCC levels for samples from Saudi Arabia (n=130) and a positive correlation between Ln-transformed TCC levels and 8-OHdG was found, although this was not statistically significant. This is the first study to report urinary levels of TCS and TCC in several Asian countries, especially for Vietnam, Kuwait, and Japan.","grant":"The Deanship of Scientific Research (DSR) at King Abdulaziz University, Jeddah, under grant no. G-176-247-36"},"PRA000116":{"id":"PRA000116","title":"[MOE_JP] The Environmental Monitoring in FY2018 (Source: FY2019 Report of Chemicals in the Environment<a href=https://www.env.go.jp/chemi/kurohon/en/http2019e/index.html target=_blank> English </a>/<a href=https://www.env.go.jp/chemi/kurohon/2019/index.html target=_blank> Japanese </a>)","releaseDate":"2021/05/19","doi":null,"author":"Open data","affiliation":"Ministry of the Environment","abstract":null,"grant":null},"PRA000048":{"id":"PRA000048","title":"Comparison study on observed and estimated concentrations of perfluorooctane sulfonate using a fate model in Tokyo Bay of Japan","releaseDate":"2017/10/25","doi":"10.1080/10934529.2014.882192","author":"Yuichi Miyake","affiliation":"University of Shizuoka","abstract":"Perfluorooctane sulfonate (PFOS) was quantified in seawater and sediment samples collected from Tokyo Bay, Japan, ranging from 2.0 to 7.3 ng/L for surface seawater, 2.2 to 5.7 ng/L for intermediate seawater, 1.5 to 5.7 ng/L for bottom seawater, and 0.3 to 0.9 ng/g dry wt. for sediment. In addition, a 3-D chemical fate prediction model (National Institute of Advanced Industrial Science and Technology - Risk Assessment Model: AIST-RAM) has been applied to determine the accuracy of estimating PFOS in Tokyo Bay. A decreasing trend of PFOS from the northwestern part (i.e., the closed-off section of Tokyo Bay) to the mouth of the bay was observed, and the trend obtained from the actual surveys in this study was accurately represented by simulation with appropriate input parameters for AIST-RAM. From the comparison of observed concentrations with estimated concentrations, AIST-RAM showed a high degree of accuracy in estimating the concentrations of PFOS in seawater, whereas the estimations of PFOS concentrations in sediment had a relatively larger margin of error than those in seawater. However, our results indicate that AIST-RAM allows estimation of PFOS concentrations in seawater and sediment in Tokyo Bay with satisfactory accuracy.","grant":"A grant from the Kurita Water and Environment Foundation (KWEF) and Special Coordination Funds for Promoting Science and Technology, 783400001, Japan"},"PRA000074":{"id":"PRA000074","title":"[MOE_JP] The Initial Environmental Survey in FY2016 (Source: FY2017 Report of Chemicals in the Environment<a href=https://www.env.go.jp/chemi/kurohon/en/http2017e/index.html target=\"_blank\"> English </a>/<a href=https://www.env.go.jp/chemi/kurohon/2017/index.html target=\"_blank\"> Japanese </a>)","releaseDate":"2018/09/07","doi":null,"author":"Open data","affiliation":"Ministry of the Environment","abstract":null,"grant":null},"PRA000078":{"id":"PRA000078","title":"Alkyl protocatechuates as novel urinary biomarkers of exposure to p-hydroxybenzoic acid esters (parabens)","releaseDate":"2018/11/05","doi":"10.1016/j.envint.2013.05.001","author":"Kurunthachalam Kannan","affiliation":"Wadsworth Center (New York State Department of Health)","abstract":"Human exposure to p-hydroxybenzoic acid esters (parabens) is a concern, owing to adverse health effects of these compounds. Parabens are metabolized and eliminated from the human bodies within a few hours of exposure. In this study, for the first time, methyl- and ethyl-protocatechuates (OH-MeP and OH-EtP) and their parent compounds, methyl- (MeP) and ethyl-parabens (EtP), were determined in urine samples collected from U.S. children and adults. Alkyl protocatechuates were found in almost all urine samples, with median concentrations of 11.8 (OH-MeP) and 2.90 ng/mL (OH-EtP) in adults, and 5.43 (OH-MeP) and 0.85 ng/mL (OH-EtP) in children. In adults, the concentrations of urinary OH-MeP and OH-EtP were higher than the corresponding concentrations of MeP and EtP. Significant correlation between OH-MeP/OH-EtP and MeP/EtP was observed. This is the first report to document hydroxylation of parabens in humans, and to propose hydroxylated metabolites (i.e., alkyl protocatechuates) as alternative biomarkers of exposure to parabens in human biomonitoring studies. The rates of transformation of parabens between children and adults appeared to be different, as evidenced from the slopes of regression between alkyl protocatechuates and parabens. In addition to alkyl protocatechuates, hydroxybenzoic acid (4-HB) and 3,4-dihydroxybenzoic acid (3,4-DHB) were found at considerable levels in the urine samples. The occurrence of a significant proportion of alkyl protocatechuates and 3,4-DHB suggests the need for inclusion of these derivatives in accurate estimation of human exposure to parabens and in epidemiological studies that associate paraben exposure to health outcomes in populations.","grant":"a grant (1U38EH000464-01) from the Centers for Disease Control and Prevention (Atlanta, GA) to Wadsworth Center, New York State Department of Health"},"PRA000088":{"id":"PRA000088","title":"Sediment Toxicity Testing with the Amphipod Grandidierella Japonica and Effects of sediment Particle Size Distribution","releaseDate":"2019/04/17","doi":"10.2965/jwet.18-076","author":"Fumiaki Nakajima","affiliation":"The University of Tokyo","abstract":"The brackish and marine amphipod <i>Grandidierella japonica</i> is an organism well-suited to sediment toxicity testing in Japan, where no other sentinel amphipod species are found. To provide the application example of toxicity testing using <i>G. japonica</i> in Japan, we performed 10-day whole sediment toxicity tests of six estuarine sediment samples collected from estuaries and tidal rivers flowing into Tokyo Bay. While all the tested sediment samples were not lethally toxic to this species, the body length increment of surviving amphipods was significantly different among sediment samples. To verify that the observed growth inhibition was caused not by large proportions of fine particles but by chemical contamination, additional 10-day tests using formulated sediment with different particle size distributions were performed. As the result, sediment containing more than 25% of < 63 μm particles could reduce the body length, but the reduced body length in the sediment collected from Heisei bridge (S3) was demonstrated to be due to chemical contamination, not due to fine particles. The species characteristics and test results presented in this study provide fundamental information to interpret the results of whole sediment toxicity tests.","grant":"the Steel Foundation for Environmental Protection Technology (SEPT); Grant-in-Aid for Japan Society for Promotion of Science (JSPS) Fellows (16J04681); Grant-in-Aid for Young Scientists (B) (17K12837) from JSPS"},"PRA000036":{"id":"PRA000036","title":"Polybrominated diphenyl ethers (PBDEs) and organochlorines in melon-headed whales, <i>Peponocephala electra</i>, mass stranded along the Japanese coasts: Maternal transfer and temporal trend","releaseDate":"2017/05/12","doi":"10.1016/j.envpol.2007.12.034","author":"Shinsuke Tanabe","affiliation":"Ehime University","abstract":"Polybrominated diphenyl ethers (PBDEs) and organochlorine compounds (OCs) were determined in the blubber of 55 melon-headed whales (<i>Peponocephala electra</i>) mass stranded along the Japanese coasts since 1982. DDTs and PCBs were predominant in all the specimens investigated. In whales that died during the latest event in 2006, concentrations of PBDEs (190-510 ng/g lipid wt) were approximately two orders of magnitude lower than DDTs and PCBs, but comparable with HCHs and HCB. Maternal transfer of PBDEs to offspring through the whole reproductive process was estimated to be 85% of the mother’s body burden, while that occurring during gestation was much lower (2.6-3.5%). Concentrations of PCBs, DDTs, and HCB were lower in melon-headed whales stranded after the year 2000 than those stranded in 1982, whereas PBDE and CHL levels showed a temporal increase during the past 20 years, suggesting that the peak of their usage and contamination occurred after the year 1982.","grant":"Grants-in-Aid for Scientific Research (A) (No. 16201014) and (B) (No. 18310046) from Japan Society for the Promotion of Science (JSPS), and for Young Scientists (B) (Project No. 16780139) and 21st Century COE Program and Global COE Program from the Ministry of Education, Culture, Sports, Science and Technology, Japan and JSPS"},"PRA000057":{"id":"PRA000
