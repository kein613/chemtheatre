<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chemical Theatre — Environmental Monitoring Database</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#f4f5f7; --surface:#fff; --border:#e2e4e9;
  --text:#1a1d27; --muted:#6b7280;
  --accent:#1a4f6e; --accent2:#2980b9;
  --radius:8px;
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#10131c; --surface:#181c28; --border:#2a2f44; --text:#e4e6f0; --muted:#8890aa; --accent:#3a8bbf; --accent2:#5ba8d4; }
}
body { font-family:'Helvetica Neue',Arial,sans-serif; background:var(--bg); color:var(--text); font-size:14px; line-height:1.6; }

header { background:var(--accent); color:#fff; padding:1rem 1.5rem; display:flex; align-items:baseline; gap:1rem; }
header h1 { font-size:1.1rem; font-weight:700; letter-spacing:.02em; }
header p  { font-size:.78rem; opacity:.7; }

.layout { display:flex; height:calc(100vh - 52px); }

/* ── サイドバー ── */
.sidebar { width:230px; min-width:230px; background:var(--surface); border-right:1px solid var(--border); overflow-y:auto; }
.sidebar-label { font-size:.7rem; font-weight:600; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; padding:.9rem 1rem .4rem; }

/* ツリーアイテム */
.tree-item { display:block; }
.tree-row {
  display:flex; align-items:center; gap:.3rem;
  padding:.28rem .8rem;
  cursor:pointer; user-select:none;
  border-left:3px solid transparent;
  transition:background .1s;
  font-size:.82rem;
  line-height:1.3;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.tree-row:hover { background:var(--bg); }
.tree-row.active { border-left-color:var(--accent2); color:var(--accent2); font-weight:600; background:var(--bg); }
.tree-row.has-data { }
.tree-row.no-data  { color:var(--muted); }

.toggle-btn {
  background:none; border:none; cursor:pointer;
  color:var(--muted); font-size:.7rem; width:14px; flex-shrink:0;
  transition:transform .15s; line-height:1;
}
.toggle-btn.open { transform:rotate(90deg); }
.toggle-btn.leaf { visibility:hidden; }

.tree-children { display:none; }
.tree-children.open { display:block; }

/* 深さによるインデント */
.depth-0 .tree-row { padding-left:.8rem; font-weight:600; padding-top:.18rem; padding-bottom:.18rem; }
.depth-0.expanded > .tree-row { padding-top:.28rem; padding-bottom:.28rem; }
.depth-1 .tree-row { padding-left:1.6rem; }
.depth-2 .tree-row { padding-left:2.4rem; font-size:.79rem; }
.depth-3 .tree-row { padding-left:3.2rem; font-size:.77rem; }
.depth-4 .tree-row { padding-left:4rem;   font-size:.75rem; }

/* ── メイン ── */
.main { flex:1; display:flex; flex-direction:column; overflow:hidden; }

.search-panel { background:var(--surface); border-bottom:1px solid var(--border); padding:.9rem 1.2rem; }
.search-grid { display:grid; grid-template-columns:2fr 1.5fr 1fr 1fr; gap:.6rem; }
@media(max-width:800px){ .search-grid{ grid-template-columns:1fr 1fr; } }
.field label { display:block; font-size:.7rem; color:var(--muted); font-weight:500; margin-bottom:.25rem; }
.field input,.field select { width:100%; padding:.4rem .65rem; border:1px solid var(--border); border-radius:6px; background:var(--bg); color:var(--text); font-size:.85rem; outline:none; transition:border-color .15s; }
.field input:focus,.field select:focus { border-color:var(--accent2); }
.search-footer { display:flex; align-items:center; justify-content:space-between; margin-top:.6rem; }
.result-count { font-size:.8rem; color:var(--muted); }
.result-count strong { color:var(--accent2); }
.btn-reset { background:none; border:1px solid var(--border); color:var(--muted); padding:.3rem .8rem; border-radius:5px; font-size:.8rem; cursor:pointer; }
.btn-reset:hover { border-color:var(--muted); }

.table-area { flex:1; overflow:auto; }
table { width:100%; border-collapse:collapse; white-space:nowrap; }
thead { position:sticky; top:0; background:var(--surface); border-bottom:2px solid var(--border); z-index:1; }
th { padding:.55rem .9rem; font-size:.7rem; font-weight:600; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; text-align:left; }
td { padding:.5rem .9rem; border-bottom:1px solid var(--border); font-size:.83rem; }
tbody tr { cursor:pointer; transition:background .1s; }
tbody tr:hover { background:var(--bg); }
tbody tr:last-child td { border-bottom:none; }

.badge { display:inline-block; padding:.1rem .5rem; border-radius:999px; font-size:.72rem; font-weight:600; }
.b-biotic  { background:#d1fae5; color:#065f46; }
.b-abiotic { background:#dbeafe; color:#1e40af; }
@media(prefers-color-scheme:dark){ .b-biotic{background:#064e3b;color:#6ee7b7;} .b-abiotic{background:#1e3a5f;color:#93c5fd;} }

.no-data,.loading,.empty-state { text-align:center; padding:3rem; color:var(--muted); font-size:.9rem; }
.empty-state { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:.5rem; }

/* モーダル */
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:100; align-items:center; justify-content:center; }
.modal-overlay.open { display:flex; }
.modal { background:var(--surface); border-radius:12px; width:min(680px,94vw); max-height:85vh; overflow-y:auto; padding:1.8rem 2rem; box-shadow:0 8px 32px rgba(0,0,0,.25); }
.modal-close { float:right; background:none; border:none; font-size:1.3rem; color:var(--muted); cursor:pointer; }
.modal h2 { font-size:1rem; font-weight:600; margin-bottom:1.2rem; padding-right:2rem; line-height:1.5; }
.modal-section { margin-bottom:1rem; }
.modal-section label { font-size:.72rem; font-weight:600; color:var(--muted); letter-spacing:.07em; text-transform:uppercase; display:block; margin-bottom:.3rem; }
.modal-section p { font-size:.85rem; line-height:1.7; }
.modal-section a { color:var(--accent2); text-decoration:none; }
.modal-grid { display:grid; grid-template-columns:1fr 1fr; gap:.8rem 1.5rem; margin-bottom:1.2rem; }
.modal-divider { border:none; border-top:1px solid var(--border); margin:1.2rem 0; }

/* 選択中グループのパンくず */
.breadcrumb { font-size:.75rem; color:var(--muted); padding:.4rem 1.2rem; background:var(--bg); border-bottom:1px solid var(--border); min-height:28px; }
.breadcrumb span { color:var(--accent2); font-weight:600; }
</style>
</head>
<body>
<header>
  <h1>Chemical Theatre</h1>
  <p>Environmental Monitoring Database</p>
</header>

<div class="layout">
  <nav class="sidebar">
    <div class="sidebar-label">Chemical Group</div>
    <div id="group-tree"></div>
  </nav>

  <div class="main">
    <div class="breadcrumb" id="breadcrumb">← Select a chemical group</div>
    <div class="search-panel">
      <div class="search-grid">
        <div class="field"><label>Chemical name / CAS</label>
          <input id="q-chem" type="text" placeholder="e.g. PCB-153, 71-43-2" oninput="applyFilter()"></div>
        <div class="field"><label>Region / Country / Area</label>
          <input id="q-loc" type="text" placeholder="e.g. Japan, Pacific Ocean" oninput="applyFilter()"></div>
        <div class="field"><label>Sample type</label>
          <select id="q-stype" onchange="applyFilter()"><option value="">All types</option></select></div>
        <div class="field"><label>Year</label>
          <select id="q-year" onchange="applyFilter()"><option value="">All years</option></select></div>
      </div>
      <div class="search-footer">
        <span class="result-count" id="result-count"></span>
        <button class="btn-reset" onclick="resetFilter()">Reset</button>
      </div>
    </div>
    <div class="table-area" id="table-area">
      <div class="empty-state"><p>← Select a chemical group to search</p></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal">
    <button class="modal-close" onclick="document.getElementById('modal-overlay').classList.remove('open')">×</button>
    <div id="modal-content"></div>
  </div>
</div>

022/11/25","doi":null,"author":"Open data","affiliation":"Ministry of the Environment","grant":null},{"id":"PRA000124","title":"Pharmaceuticals and personal care products (PPCPs) in surface water and fish from three Asian countries: species-specific bioaccumulation and potential ecological risks","releaseDate":"2023/01/16","doi":"10.1016/j.scitotenv.2022.161258","author":"Rumi Tanoue","affiliation":"Ehime University","grant":"Supported by the Ministry of Education, Culture, Sports, Science and Technology, Japan (MEXT) through a project on Joint Usage/Research Centre _ Leading Academia in Marine and Environment Pollution Research (LaMer); Grants-in-Aid (KAKENHI) for Scientific Research (A) (JP16H01784); Scientific Research (A) (JP19H01167); Scientific Research (A) (JP20H00645); Scientific Research (A) (JP19H01150); Scientific Research (C) (JP22K12412); Promotion of Joint International Research (B) (JP18KK0300); Promotion of Joint International Research (B) (JP22KK0175); Early-Career Scientists (JP20K19983) from the Japan Society for the Promotion of Science (JSPS)"},{"id":"PRA000125","title":"[MOE_JP] The Environmental Monitoring in FY2020 (Source: FY2021 Report of Chemicals in the Environment<a href=https://www.env.go.jp/chemi/kurohon/en/http2021e/index.html target=_blank> English </a>/<a href=https://www.env.go.jp/chemi/kurohon/2021/index.html target=_blank> Japanese </a>)","releaseDate":"2023/01/26","doi":null,"author":"Open data","affiliation":"Ministry of the Environment","grant":null},{"id":"PRA000126","title":"[MOE_JP] Japanese Nationwide Survey on Existence of PFOS and PFOA in FY2020 (Source: MOE Press Release: Result of FY2020 National Survey on Existence of PFOS and PFOA dated June 22, 2021 <a href=https://www.env.go.jp/press/109708.html target=_blank> Japanese </a>)","releaseDate":"2023/03/23","doi":null,"author":"Open data","affiliation":"Ministry of the Environment","grant":null},{"id":"PRA000127","title":"Multi-target analyses of persistent organic pollutants, halogenated natural products, and organophosphate esters in bivalves from Seto Inland Sea, Japan: Residue levels, profiles, and spatial trends","releaseDate":"2025/2/12","doi":"https://doi.org/10.1016/j.scitotenv.2025.178801","author":"Tatsuya Kunisue","affiliation":"Ehime University","grant":"Grants-in-Aid (KAKENHI) for Scientific Research (A) (No. 23H00533) from Japan Society for the Promotion of Science (JSPS) and the Ministry of Education, Culture, Sports, Science and Technology, Japan (MEXT) to a project on Joint/Research Center - Leading Academia in Marine and Environment Pollution Research (LaMer)"}],"details":{"PRA000110":{"id":"PRA000110","title":"Road dust contamination by polycyclic aromatic hydrocarbons and their methylated derivatives in northern Vietnam: Concentrations, profiles, emission sources, and risk assessment","releaseDate":"2020/12/02","doi":"10.1016/j.envpol.2019.113073","author":"Shin Takahashi","affiliation":"Ehime University","abstract":"Concentrations of unsubstituted and methylated polycyclic aromatic hydrocarbons (PAHs and Me-PAHs) were examined in road dusts from some representative areas with different land-use types in northern Vietnam, providing updated information about the occurrence, sources, and risks of these pollutants in Southeast Asian region. The Vietnamese road dusts were contaminated with low to moderate levels of PAHs and Me-PAHs as compared to those from other countries in the world. Concentrations of PAHs and Me-PAHs (Σ34PAHs) decreased in the order: urban (median 1800; range 1100-5500) ≈ industrial (1300; 550-10,000)>suburban (450; 310-1300) ≈ rural road dust (330; 210-2300ngg<sup>-1</sup>), suggesting an urban-rural declining trend and effects of urbanization-industrialization processes in PAH emission extent in Vietnam. The profiles and diagnostic ratios of PAHs and Me-PAHs in our samples revealed that these compounds were mainly derived from pyrogenic sources rather than petrogenic sources. Traffic emissions (e.g., vehicle exhaust, tire debris, and possible leaks of fuels, oils, and lubricants) were estimated as principal sources of PAHs and Me-PAHs, especially in the urban and industrial areas. Other pyrogenic sources (e.g., coal, wood, and biomass combustion) were also existed in the industrial, suburban, and rural areas, reflecting PAH origins from thermal industrial processes, open burning of agricultural by-products, and domestic energy utilization. Persons working outdoors and children in the urban and industrial areas were estimated to receive higher intake doses of PAHs and Me-PAHs, which were one to two orders of magnitude higher than those estimated for other groups. Except for potential cancer risk estimated for the occupational groups in the industrial area under the worst exposure scenarios, the non-cancer and cancer risk levels were generally acceptable; however, more comprehensive risk assessment considering other exposure pathways (e.g., inhalation and diet) is needed.","grant":"Fund for the Promotion of Joint International Research (Fostering Joint International Research (B)) (18KK0300); Grants-in-Aid for Scientific Research (B: 16H02963) from the Japan Society for the Promotion of Science (JSPS); The support from Vietnam National University, Hanoi under project number QG.19.17"},"PRA000120":{"id":"PRA000120","title":"[MOE_JP] The Environmental Monitoring in FY2019 (Source: FY2020 Report of Chemicals in the Environment<a href=https://www.env.go.jp/chemi/kurohon/en/http2020e/index.html target=_blank> English </a>/<a href=https://www.env.go.jp/chemi/kurohon/2020/index.html target=_blank> Japanese </a>)","releaseDate":"2022/06/02","doi":null,"author":"Open data","affiliation":"Ministry of the Environment","abstract":null,"grant":null},"PRA000092":{"id":"PRA000092","title":"[MOE_JP] The monitoring of agricultural chemicals in river water in FY2014 ( Source: <a href=https://www.env.go.jp/water/dojo/noyaku/zanryutaisaku.html target=_blank>FY2014 (H26) agrichemical monitoring report</a> )","releaseDate":"2019/06/17","doi":null,"author":"Open data","affiliation":"Ministry of the Environment","abstract":null,"grant":null},"PRA000060":{"id":"PRA000060","title":"Spatially Detailed Survey on Pollution by Multiple Perfluorinated Compounds in the Tokyo Bay Basin of Japan","releaseDate":"2018/02/09","doi":"10.1021/es103917r","author":"Shigeki Masunaga","affiliation":"Yokohama National University","abstract":"Pollution from 35 perfluorinated compounds (PFCs) in the water of the Tokyo Bay basin was examined. The water in the basin contained relatively high levels of perfluorononanoate (PFNA), perfluorooctanoate (PFOA), and perfluorooctane sulfonate (PFOS) compared to the other PFCs, which were present at concentrations of 20.1 ng/L, 6.7 ng/L, and 5.8 ng/L, respectively. In contrast, the concentrations of their precursors and degradation products were an order of magnitude lower. Sewage treatment plant (STP) effluent in the area also contained high levels of PFNA compared with the river water samples (Mann−Whitney U-test, p < 0.0002). From a spatial aspect, increases in PFC pollution levels correlated with increased urbanization in the study area suggested that there are nonpoint source contributors to the PFC pollution in this area. Branched isomers of the PFCs were also quantified. Samples that contained high concentrations of perfluoroalkyl carboxylates (PFCA) showed lower proportions of its branched isomer. This indicates that the branched isomers are more prominent in the area with lower PFC pollution. This analysis was beneficial for estimating the individual contributions of different PFCA production processes. This survey provided new information on the sources, spatial distribution, and behavioral characteristics of PFC pollutants in this area.","grant":"JSPS Research Fellowship for Young Scientists (ID: 213467)"},"PRA000001":{"id":"PRA000001","title":"Global pollution monitoring of PCBs and organochlorine pesticides using skipjack tuna as a bioindicator","releaseDate":"2016/05/10","doi":"10.1007/s00244-002-0131-9","author":"Shinsuke Tanabe","affiliation":"Ehime University","abstract":null,"grant":null},"PRA000077":{"id":"PRA000077","title":"Monitoring of PAHs and alkylated PAHs in aquatic organisms after 1 month from the <i>Solar I</i> oil spill off the coast of Guimaras Island, Philippines","releaseDate":"2018/10/31","doi":"10.1007/s10661-009-0962-1","author":"Seiichi Uno","affiliation":"Kagoshima University","abstract":"Following the oil spill accident of the <i>Solar I</i> tanker in 2006 off the coast of Guimaras Island in the Philippines, polycyclic aromatic hydrocarbons (PAHs) and alkylated PAHs in some aquatic organisms were investigated at Luzaran in Guimaras and Taklong Islands, which were heavily polluted with spilled oil, immediately and 1 month after the accident. The concentrations of total PAHs were 11.9_52.3 ng/g dry weight in fish. Meanwhile, total PAH concentrations in shellfish were 38.0_3,102 ng/g dry weight in Luzaran and 128_236 ng/g dry weight in Taklong. Pyrene, phenanthrene, and fluoranthene were dominant in most fish and chrysene in all shellfish. Significantly higher concentrations of all alkylated homologs were detected in shellfish than in fish. These differences had two possible causes, that is, the differences between fish and shellfish could be attributed to the uptake routes and/or their metabolizing abilities.","grant":"the Asian CORE Program of the Japan Society for the Promotion of Science (JSPS)"},"PRA000058":{"id":"PRA000058","title":"Dioxin-like compounds in pine needles around Tokyo Bay, Japan in 1999","releaseDate":"2018/01/10","doi":"10.1039/b311176h","author":"Nobuyoshi Yamashita","affiliation":"National Institute of Advanced Industrial Science and Technology (AIST) ","abstract":"Pine needle samples collected at ten spatially distant sites around Tokyo Bay in 1999 indicated a widespread lower troposphere pollution with ultra-trace dioxin-like compounds such as chlorodibenzo-p-dioxins (PCDDs), -furans (PCDFs), non-ortho- and mono-ortho-chlorobiphenyls (pPCBs), and -naphthalenes (PCNs). Elevated concentration of planar PCBs and the total PCNs were found at the sites which are located innermost to the Bay, suggesting the regional importance of the evaporative nature of the source of pollution by those compounds over this vast area. The concentrations and profiles for PCDDs and PCDFs remained largely uniform. An exception was the site near the town of Tateyama in the Chiba Prefecture, which is the southernmost but also relatively separate from the inner Bay. The site near Tateyama showed somehow background contamination with all compound groups and highly different profiles of PCNs. The principal component analysis (PCA) of the data matrix has revealed that around the Tokyo Bay, apart from the evaporative emission sources for PCNs and PCBs, combustion related processes also play an important role as sources of the ambient air contamination not only with PCDDs/Fs but also with chloronaphthalenes and planar chlorobiphenyls.","grant":"The Polish State Committee of Scientific Research (KBN) under the Scientific and Technological Cooperation Joint Project (R-92) between Poland and Japan, project no 127/E/335/S/2003 as well as under projects BW/800-5-0224-3 and DS/8250-4-0092-03."},"PRA000125":{"id":"PRA000125","title":"[MOE_JP] The Environmental Monitoring in FY2020 (Source: FY2021 Report of Chemicals in the Environment<a href=https://www.env.go.jp/chemi/kurohon/en/http2021e/index.html target=_blank> English </a>/<a href=https://www.env.go.jp/chemi/kurohon/2021/index.html target=_blank> Japanese </a>)","releaseDate":"2023/01/26","doi":null,"author":"Open data","affiliation":"Ministry of the Environment","abstract":null,"grant":null},"PRA000098":{"id":"PRA000098","title":"[MOE_JP] The Detailed Environmental Survey in FY2017 (Source: FY2018 Report of Chemicals in the Environment<a href=https://www.env.go.jp/chemi/kurohon/en/http2018e/index.html target=_blank> English </a>/<a href=https://www.env.go.jp/chemi/kurohon/2018/index.html target=_blank> Japanese </a>)","releaseDate":"2019/10/18","doi":null,"author":"Open data","affiliation":"Ministry of the Environment","abstract":null,"grant":null},"PRA000030":{"id":"PRA000030","title":"Brominated flame retardants and organochlorines in small cetaceans from Hong Kong waters","releaseDate":"2017/05/31","doi":"10.1016/j.marpolbul.2005.02.041","author":"Shinsuke Tanabe","affiliation":"Ehime University","abstract":null,"grant":"Grants-in-Aid for Scientific Research (A) (16201014) from Japan Society for the Promotion of Science; Young Scientists (B) (Project 16780139); 21st century COE program from the Ministry of Education, Culture, Sports, Science and Technology, Japan; Materials Cycles Modeling of Persistent Toxic Chemicals and its policy Research Applications for Recycling and Waste Management from the Waste Management Research Grants of the Ministry of the Environment, Japan; partly supported by the Global Environment Research Fund (RF-064); the Waste Management Research Grant (K1821, K1836) from the Ministry of the Environment, Japan and by Scientific Research (Project No. 12308030) of Japan Society for the Promotion of Science (JSPS); Grants-in-Aid for Scientific Research (B) (No. 18310046); One of the authors(Dr. Paul K. S. Lam)was supported by a grant from the Hong Kong Research Grants Council (CityU1103/03M)"},"PRA000086":{"id":"PRA000086","title":"Complex Mixtures of Brominated/Chlorinated Diphenyl Ethers and Dibenzofurans in Soils from the Agbogbloshie e‐Waste Site (Ghana): Occurrence, Formation, and Exposure Implications","releaseDate":"2019/04/11","doi":"10.1021/acs.est.8b06929","author":"Tatsuya Kunisue","affiliation":"Ehime University","abstract":"The distribution and toxic equivalents (TEQs) of brominated and chlorinated dibenzo-p-dioxins/dibenzofurans (PBDD/Fs and PCDD/Fs) in soils from Agbogbloshie e-waste site (Ghana) were investigated. The composition of brominated/chlorinated dibenzofurans (PXDFs) and diphenyl ethers (PBDEs, PCDEs, and PXDEs) was examined using two-dimensional gas chromatography-time-of-flight mass spectrometry to elucidate possible formation pathways of dioxins from e-waste recycling. The highest concentrations of PCDD/Fs and PBDD/Fs were found, respectively, in the open burning (1.3−380 ng/g dry weight) and dismantling areas (11−1000 ng/g dry weight) and were comparable to the highest reported for informal e-waste sites. PXDFs and PXDEs were detected at up to the range of hundreds of nanograms per gram. The homologue profiles suggest that PXDFs were formed mainly from PBDFs through successive Br-to-Cl exchange. However, monobromo-PCDFs were also derived from de-novo-generated PCDFs in open burning areas. PBDFs contributed similar or higher TEQs (7.9−5400 pg/g dry weight) compared with PCDD/Fs (6.8−5200 pg/g dry weight), whereas PXDFs were also substantial TEQ contributors in open burning areas. The high TEQs of PBDFs in the dismantling area (120−5200 pg/g dry weight) indicate the need to consider brominated dioxins besides chlorinated dioxins in future studies on health implications for e-waste workers and local residents.","grant":"Grants-in-Aid for Scientific Research (A: 25257403 and 16H01784) from the Japan Society for the Promotion of Science (JSPS); the Environment Research and Technology Development Fund (3K153001) from the Japanese Ministry of the Environment; a project on Joint Usage/Research Center Leading Academia in Marine and Environment Pollution Research (LaMer) from the Ministry of Education, Culture, Sports, Science and Technology, Japan (MEXT)"},"PRA000124":{"id":"PRA000124","title":"Pharmaceuticals and personal care products (PPCPs) in surface water and fish from three Asian countries: species-specific bioaccumulation and potential ecological risks","releaseDate":"2023/01/16","doi":"10.1016/j.scitotenv.2022.161258","author":"Rumi Tanoue","affiliation":"Ehime University","abstract":"In Asian developing countries, undeveloped and ineffective sewer systems are causing surface water pollution by a lot of contaminants, especially pharmaceuticals and personal care products (PPCPs). Therefore, the risks for freshwater fauna need to be assessed. The present study aimed at: i) elucidating the contamination status; ii) evaluating the bioaccumulation; iii) assessing the potential risks of PPCP residues in surface water and freshwater fish from three Asian countries. We measured 43 PPCPs in the plasma of several fish species as well as ambient water samples collected from India (Chennai and Bengaluru), Indonesia (Jakarta and Tangerang), and Vietnam (Hanoi and Hoa Binh). In addition, the validity of the existing fish blood－water partitioning model based solely on the lipophilicity of chemicals is assessed for ionizable and readily metabolizable PPCPs. When comparing bioaccumulation factors calculated from the PPCP concentrations measured in the fish and water (BAF<sub>measured</sub>) with bioconcentration factors predicted from their pH-dependent octanol－water partition coefficient (BCF<sub>predicted</sub>), close values (within an order of magnitude) were observed for 58_91% of the detected compounds. Nevertheless, up to 110 times higher plasma BAF<sub>measured</sub> than the BCF<sub>predicted</sub> were found for the antihistamine chlorpheniramine in tilapia but not in other fish species. The plasma BAF<sub>measured</sub> values of the compound were significantly different in the three fish species (tilapia > carp > catfish), possibly due to species-specific differences in toxicokinetics (e.g., plasma protein binding and hepatic metabolism). Results of potential risk evaluation based on the PPCP concentrations measured in the fish plasma suggested that chlorpheniramine, triclosan, haloperidol, triclocarban, diclofenac, and diphenhydramine can pose potential adverse effects on wild fish. Results of potential risk evaluation based on the PPCP concentrations measured in the surface water indicated high ecological risks of carbamazepine, sulfamethoxazole, erythromycin, and triclosan on Asian freshwater ecosystems.","grant":"Supported by the Ministry of Education, Culture, Sports, Science and Technology, Japan (MEXT) through a project on Joint Usage/Research Centre _ Leading Academia in Marine and Environment Pollution Research (LaMer); Grants-in-Aid (KAKENHI) for Scientific Research (A) (JP16H01784); Scientific Research (A) (JP19H01167); Scientific Research (A) (JP20H00645); Scientific Research (A) (JP19H01150); Scientific Research (C) (JP22K12412); Promotion of Joint International Research (B) (JP18KK0300); Promotion of Joint International Research (B) (JP22KK0175); Early-Career Scientists (JP20K19983) from the Japan Society for the Promotion of Science (JSPS)"},"PRA000006":{"id":"PRA000006","title":"Occurrence of hydroxylated polychlorinated biphenyls in the brain of cetaceans stranded along the Japanese coast","releaseDate":"2016/09/09","doi":"10.1016/j.marpolbul.2007.02.017","author":"Shinsuke Tanabe","affiliation":"Ehime University","abstract":"Levels of hydroxylated polychlorinated biphenyls (OH-PCBs) and PCBs were measured in the brain of melon-headed whales (MW: <i>Peponocephala electra</i>), striped dolphins (SD: <i>Stenella coeruleoalba</i>) and finless porpoises (FP:<i>Neophocaena phocaenoides</i>) stranded along the Japanese coast during 2002-2003. Levels of OH-PCBs (including identified and unknown OH-P<sub>5</sub>CB, -H<sub>6</sub>CB, -H<sub>7</sub>CB and O<sub>8</sub>CB congeners) in the brain of MW, SD and FP were in the range of 20-290, 21-330, 170-240 pg/g wet wt., respectively. Observed OH-PCB levels were 2-3 orders of magnitude lower than PCBs in the same individuals. OH-PCBs/PCBs ratios in MW, SD and FP brain were lower than those in blood of humans and wildlife and in the brain of polar bears reported previously. OH-PCBs were also detected in maternal and fetal brain of SD (1 pair), suggesting transfer of OH-PCBs into the fetal brain of odontocete cetaceans. When fetus/dam concentration ratios of OH-PCB congeners detected in maternal and fetal brain were estimated, the values were higher than those of PCB congeners, implying that OH-PCBs in maternal blood could be more easily transferred into fetal brain via placenta than PCBs.","grant":"Grants-in-Aid for Scientific Research (B) (No. 18310046) and 21st Century COE Program from the Ministry of Education, Culture, Sports, Science and Technology, Japan"},"PRA000042":{"id":"PRA000042","title":"Asian Mussel Watch Program: Contamination Status of Polybrominated Diphenyl Ethers and Organochlorines in Coastal Waters of Asian Countries","releaseDate":"2017/09/27","doi":"10.1021/es070380p","author":"Shinsuke Tanabe","affiliation":"Ehime University","abstract":"Mussel samples were used in this study to measure the levels of polybrominated diphenyl ethers (PBDEs) and organochlorines (OCs) in the coastal waters of Asian countries like Cambodia, China, Hong Kong, India, Indonesia, Japan, Korea, Malaysia, the Philippines, and Vietnam. PBDEs were detected in all the samples analyzed, and the concentrations ranged from 0.66 to 440 ng/g lipid wt. Apparently higher concentrations of PBDEs were found in mussels from the coastal waters of Korea, Hong Kong, China, and the Philippines, which suggests that significant sources of these chemicals exist in and around this region. With regard to the composition of PBDE congeners, BDE-47, BDE-99, and BDE-100 were the dominant congeners in most of the samples. Among the OCs analyzed, concentrations of DDTs were the highest followed by PCBs > CHLs > HCHs > HCB. Total concentrations of DDTs, PCBs, CHLs, and HCHs in mussel samples ranged from 21 to 58 000, 3.8 to 2000, 0.93 to 900, and 0.90 to 230 ng/g lipid wt., respectively. High levels of DDTs were found in mussels from Hong Kong, Vietnam, and China; PCBs were found in Japan, Hong Kong, and industrialized/urbanized locations in Korea, Indonesia, the Philippines, and India; CHLs were found in Japan and Hong Kong; HCHs were found in India and China. These countries seem to play a role as probable emission sources of corresponding contaminants in Asia and, in turn, may influence their global distribution.","grant":"Grants-in-Aid for Scientific Research (A) (no. 16201014) and (B) (no. 18310046) from Japan Society for the Promotion of Science (JSPS), and for Young Scientists (B) (project no. 16780139) and 21st Century COE Program from the Ministry of Education, Culture, Sports, Science and Technology, Japan and JSPS, and the Global Environment Research Fund (RF-064) and the Waste Management Re- search Grant (K1821) from the Ministry of the Environment, Japan"},"PRA000111":{"id":"PRA000111","title":"Anthropogenic and natural organohalogen compounds in melon-headed whales (Peponocephala electra) stranded along the Japanese coastal waters: Temporal trend analysis using archived samples in the environmental specimen bank (es-BANK)","releaseDate":"2020/12/23","doi":"10.1016/j.chemosphere.2020.129401","author":"Tatsuya Kunisue","affiliation":"Ehime University","abstract":"The present study determined recent accumulation levels of polychlorinated biphenyls (PCBs), dichlorodiphenyltrichloroethane and its metabolites (DDTs), hexachlorocyclohexane isomers (HCHs), chlordane compounds (CHLs), hexachlorobenzene (HCB), polybrominated diphenyl ethers (PBDEs), hexabromocyclododecanes (HBCDDs), polychlorinated diphenyl ethers (PCDEs), methoxylated-PBDEs (MeO-PBDEs) and 2,3,3’,4,4’,5,5’-heptachloro-1’-methyl-1,2’-bipyrrole (Q1) in the blubber of melon-headed whales (<i>Peponocephala electra</i>) stranded along the Japanese coastal waters in 2015 and examined temporal trends of these organohalogen compound (OHC) levels by analyzing blubber samples of this species archived in the environmental specimen bank which were collected in 1982, 2001, 2002, 2006, 2010 and 2011. The median concentrations in melon-headed whales stranded recently were in the order of DDTs ≈ PCBs > HBCDDs > Q1 > CHLs > MeO-PBDEs > PBDEs > HCB > HCHs > PCDEs, indicating that considerable amounts of HBCDDs, in addition to DDTs and PCBs, have been transported to tropical and subtropical waters of the open ocean and pelagic whale species might be exposed to relatively high levels of these OHCs. Temporal trend analyses of OHC levels in the blubber of melon-headed whales revealed significant reduction for anthropogenic OCs such as DDTs, PCBs, HCB, HCHs and PCDEs, while concentrations of CHLs, PBDEs, HBCDDs, MeO-PBDEs and Q1 significantly increased since 1982. Besides, the analyses from 2001 to 2015 showed no decreasing trends (steady state) for some PCB congeners, p,p’-DDE, cis- and trans-nonachlors, Q1, BDE-47, -100 and -154, and significantly increasing trends for α-HBCDD and 6MeO-BDE47, suggesting their chronic exposure for this pelagic whale species.","grant":"Grants-in-Aid (KAKENHI) for Scientific Research (A) (No. 19H01167 and 19H01150) from Japan Society for the Promotion of Science (JSPS); the Environment Research and Technology Development Fund (SII-3-2[1]: JPMEERF18S20303) of the Environmental Restoration and Conservation Agency of Japan (ERCA); the Ministry of Education, Culture, Sports, Science and Technology, Japan (MEXT) to a project on Joint/Research Center - Leading Academia in Marine and Environment Pollution Research (LaMer)"},"PRA000046":{"id":"PRA000046","title":"Primary risk assessment of dimethyldithiocarbamate, a dithiocarbamate fungicide metabolite, based on their probabilistic concentrations in a coastal environment","releaseDate":"2017/10/06","doi":"10.1016/j.chemosphere.2014.12.015","author":"Takeshi Hano","affiliation":"Fisheries Research  and Education Agency","abstract":"The primary ecological risk of dimethyldithiocarbamate (DMDC), a dithiocarbamate fungicide (DTC) metabolite, was evaluated based on their probabilistic environmental concentration distributions (ECDs) in the coastal environment, Hiroshima Bay, Japan. And their behavior and temporal trends was further considered. This is the first report of the identification of DMDC from environmental seawater and sediment samples. DMDC concentrations in bottom seawater were substantially higher than those in surface seawater, which are associated with the leachability from sediments in bottom seawaters, and with photodegradation in surface seawaters. Furthermore, seasonal risks are dominated by higher concentrations from April to June, indicating temporal variation in the risk to exposed species. Hierarchical Bayesian analysis offered DMDC ECD medians and range (5th to 95th percentiles) of 0.85 ng L<sup>−1</sup> (0.029, 22), 12 ng L<sup>−1</sup> (3.2, 48) and 110 ng kg dry<sup>−1</sup> (9.5, 1200) in surface seawater, bottom seawater and sediment, respectively. Considering that DMDC and DTCs have similar toxicological potential to aquatic organisms, the occurrence of the compound in water is likely to be of biological relevance. In summary, this work provides the first demonstration that the ecological risk of DMDC and its derived DTCs in Hiroshima Bay is relatively high, and that DTCs should be a high priority for future research on marine contamination, especially in bottom seawaters.","grant":"Grants-in-Aid from the Fisheries Agency of Japan"},"PRA000018":{"id":"PRA000018","title":"Hexabromocyclododecanes in human adipose tissue from Japan","releaseDate":"2016/12/02","doi":"10.1071/EN09024 ","author":"Shinsuke Tanabe","affiliation":"Ehime University","abstract":" Residue levels of hexabromocyclododecanes (HBCDs) were measured using LC-MS/MS in the Japanese human adipose tissue samples collected during 2003–2004 from Ehime prefecture (n = 26) and Kanto region (n = 9) of Japan. Concentrations of HBCDs (0.85-39ng g<sup>-1</sup> lipid) in the adipose tissue samples were 1-2 orders of magnitude lower than those of organo chlorines (OCs). Regional differences between HBCD levels in Ehime prefecture and Kanto region were not significant. No age-dependent accumulation of HBCDs was observed. HBCD levels in men were significantly higher than those in women. Significant positive correlation between polybrominated diphenyl ethers (PBDEs) and HBCDs implies similar routes of exposure to these contaminants for Japanese citizens. alpha-HBCD was predominant among the three isomers, which is consistent with the other reports on bioaccumulation of alpha-HBCD in higher trophic animals.","grant":" Grants-in-Aid for Scientific Research (S: 20221003, Young Scientists B: 19780239) and Global COE Program of the Japanese Ministry of Education, Science, Sports, Culture and Technology (MEXT) and Japan Society for the Promotion of Science (JSPS) and  MEXT's program Promotion of Environmental Improvement for Independence of Young Researchers under the Special Coordination Funds for Promoting Science and Technology and the Global Environment Research Fund (RF-094) of the Ministry of the Environment, Japan"},"PRA000052":{"id":"PRA000052","title":"Biomonitoring of chlorophenols in human urine from several Asian countries, Greece and the United States","releaseDate":"2017/11/22","doi":"10.1016/j.envpol.2017.09.073","author":"Kurunthachalam Kannan","affiliation":"Wadsworth Center (New York State Department of Health)","abstract":"Chlorophenols (CPs) are used in the production of pesticides and preservatives. Although human exposure to CPs has been known for years, current exposure levels to these chemicals in Asian countries are not known. In this study, we analyzed concentrations of eight CPs in 300 human urine samples collected from nine countries. Of these CPs, 2,5-dichlorophenol and 2,4-dichlorophenol were found at the highest median concentrations (median for all nine countries: 1.78 and 0.34 ng/mL, respectively). Pentachlorophenol was found in 59% of the samples analyzed at a median concentration of 0.07 ng/mL. Urine samples from Japan had the highest concentration of total CPs (median: 16.7 ng/mL) with 2,5-dichlorophenol accounting for 93.1% of the total concentration. The estimated daily intake (DI) for precursors of dichlorophenols varied widely, but several samples showed values higher than the acceptable DI recommended by the United States Environmental Protection Agency (EPA). These results suggest that CP exposure, especially to dichlorophenols, is prevalent in several countries, particularly in Asia, suggesting a pressing need for further assessment of the global sources and potential health effects of these chemicals.","grant":null},"PRA000096":{"id":"PRA000096","title":"[MOE_JP] The monitoring of agricultural chemicals in river water in FY2018  ( Source: <a href=https://www.env.go.jp/water/dojo/noyaku/zanryutaisaku.html target=_blank>FY2018 (H30)agrichemical monitoring report</a> )","releaseDate":"2019/09/02","doi":null,"author":"Open data","affiliation":"Ministry of the Environment","abstract":null,"grant":null},"PRA000012":{"id":"PRA000012","title":"Toxic evaluations of sediments in Tokyo Bay, Japan, using Japanese medaka embryos","releaseDate":"2016/10/27","doi":"10.1007/s11356-016-7581-5","author":"Seiichi Uno","affiliation":"Kagoshima University","abstract":"Toxic risks of sediments collected from seven sites in Tokyo Bay were evaluated using Japanese medaka embryos. Those sediments with slight pore water were placed in grass petri dishes without overlying water. The most remarkable effect in the field sediment was to cause hatching delay in embryos, and the longest time until hatching took was 12.5 ± 1.6days post-fertilization (dpf), although that in control group was 10.1 ± 0.7dpf. A significant delay in hatching was observed at four sites. Because total carbon concentrations were relatively high in sediments at three of these four sites, several chemicals were expected to be residues in these sites and could cause their delay. Although extreme mortality was not observed at all sites, sediments collected from the site close to Kawasaki city induced 10% mortality. Polycyclic aromatic hydrocarbon (PAH) concentrations were remarkably high at this site compared with other sites, and thus PAH toxicities could be causing the mortality. Concentration of heavy metals such as cadmium, copper, lead, and zinc in sediments were also determined, but no clear relationship was found between toxicities to embryos and the distribution of their concentrations.","grant":"An investigation for the accumulation of scientific knowledge to apply the development of chemical risk evaluations, from the Ministry of Economy, Japan."},"PRA000043":{"id":"PRA000043","title":"Geographical distribution of non-PBDE-brominated flame retardants in mussels from Asian coastal waters","releaseDate":"2017/09/29","doi":"10.1007/s11356-012-0945-6","author":"Tomohiko Isobe","affiliation":"National Institute for Environmental Studies","abstract":"Hexabromocyclododecanes (HBCDs), 1,2-bis (2,4,6-tribromophenoxy) ethane (BTBPE), and decabromodiphenyl ethane (DBDPE) used as alternatives for polybrominated diphenyl ethers (PBDEs) are also persistent in the environment as PBDEs. Limited information on these non-PBDE brominated flame retardants (BFRs) is available; in particular, there are only few publications on environmental pollution by these contaminants in the coastal waters of Asia. In this regard, we investigated the contamination status of HBCDs, BTBPE, and DBDPE in the coastal waters of Asia using mussels as a bioindicator. Concentrations of HBCDs, BTBPE, and DBDPE were determined in green (<i>Perna viridis</i>) and blue mussels (<i>Mytilus edulis</i>) collected from the coastal areas in Cambodia, China (mainland), SAR China (Hong Kong), India, Indonesia, Japan, Malaysia, the Philippines, and Vietnam on 2003-2008. BTBPE and DBDPE were analyzed using GC-MS, whereas HBCDs were determined by LC-MS/ MS. HBCDs, BTBPE, and DBDPE were found in mussels at levels ranging from <0.01 to 1,400, <0.1 to 13, and <0.3 to 22 ng/g lipid wt, respectively. Among the three HBCD diastereoisomers, α-HBCD was the dominant isomer followed by γ- and β-HBCDs. Concentrations of HBCDs and DBDPE in mussels from Japan and Korea were higher compared to those from the other Asian countries, indicating extensive usage of these non-PBDE BFRs in Japan and Korea. Higher levels of HBCDs and DBDPE than PBDEs were detected in some mussel samples from Japan. The results suggest that environmental pollution by non-PBDE BFRs, especially HBCDs in Japan, is ubiquitous. This study provides baseline information on the contamination status of these non-PBDE BFRs in the coastal waters of Asia.","grant":"Grants-in-Aid for Scientific Research (S: 20221003), Young Scientist (B: 23710077) and Global COE Program of the Japanese Ministry of Education, Science, Sports, Culture and Technology (MEXT), and Japan Society for the Promotion of Science, and partly supported by MEXT's program Promotion of Environmental Improvement for Independence of Young Researchers under the Special Coordination Funds for Promoting Science and Technology"},"PRA000115":{"id":"PRA000115","title":"[MOE_JP] The Detailed Environmental Survey in FY2018 (Source: FY2019 Report of Chemicals in the Environment<a href=https://www.env.go.jp/chemi/kurohon/en/http2019e/index.html target=_blank> English </a>/<a href=https://www.env.go.jp/chemi/kurohon/2019/index.html target=_blank> Japanese </a>)","releaseDate":"2021/03/17","doi":null,"author":"Open data","affiliation":"Ministry of the Environment","abstract":null,"grant":null},"PRA000113":{"id":"PRA000113","title":"Comprehensive analysis of 942 organic micro-pollutants in settled dusts from northern Vietnam: pollution status and implications for human exposure","releaseDate":"2021/01/27","doi":"10.1007/s10163-018-0745-2","author":"Shin Takahashi","affiliation":"Ehime University","abstract":"Contamination status of 942 organic micro-pollutants was examined for settled dust samples collected from an informal end-of-life vehicle (ELV) recycling site and an urban area in northern Vietnam. One hundred and ninety-five contaminants including 73 domestic chemicals, 79 industrial chemicals and 43 pesticides were detected at least once in our samples. Total concentrations (median and range) of organic pollutants in dusts from ELV site and Hanoi urban area were 20,000 (5600–93,000) and 21,000 (12,000–26,000) ng g<sup>−1</sup>, respectively. Pyrethroid insecticides, polycyclic aromatic hydrocarbons (PAHs) and plasticizers were the major contributors to the overall contamination levels. Concentrations of some specific chemical classes such as petroleum alkanes, PAHs, heat storage and transfer agents, and compounds leached from tires in dusts from the recycling area were significantly higher than those from the urban area, suggesting their emission during ELV dismantling and stockpiling processes. Human exposures to selected organic pollutants were also estimated by calculating daily intake doses to evaluate their hazard quotients (HQs). Although almost HQs were markedly lower than the critical value of 1, potential health risk caused by multiple organic contaminants via dust ingestion and other exposure pathways should be considered in future studies.","grant":"Grants-in-Aid for Scientific Research (B: 16H02963) from the Japan Society for the Promotion of Science (JSPS); the Environment Research and Technology\r\nDevelopment Fund (3K153001) from the Japanese Ministry of the Environment"},"PRA000044":{"id":"PRA000044","title":"Spatio-temporal trends of polybrominated dibenzo-p-dioxins and dibenzofurans in archived sediments from Tokyo Bay, Japan","releaseDate":"2017/09/04","doi":"10.1016/j.scitotenv.2017.04.166","author":"Tatsuya Kunisue","affiliation":"Ehime University","abstract":"The present study examined the occurrence and potential sources of mono- to octa-brominated dibenzo-p-dioxins/ dibenzofurans (Mo-OBDD/Fs) in Tokyo Bay, Japan, using surface sediments and <sup>210</sup>Pb-dated sediment cores (covering the period 1895-2000) collected in 2002. The results showed a clear difference in the spatio-temporal trend between PBDFs and PBDDs. The spatial distribution of PBDF concentrations in the surface sediments showed a decreasing trend from the head to the mouth of the bay, which was similar to that of polybrominated diphenyl ethers (PBDEs) reported previously for the same sediment samples. In the sediment cores, PBDF and PBDE concentrations increased drastically after the 1960s and reached the highest levels in the late 1990s. In addition, a significant positive correlation was observed between the concentrations of their predominant congeners, 1,2,3,4,6,7,8-HpBDF and BDE-209. These results indicate that main contamination sources of PBDFs were technical PBDE formulations, especially DecaBDE. In contrast, total PBDDs in the surface sediments were rather uniform in the whole area of the bay. Furthermore, in the sediment cores, PBDD levels showed marginal fluctuation over the past century, with the predominance of 2,7-/2,8-DiBDDs and 1,3,7-/1,3,8-TrBDDs in all the sediment layers. It is noteworthy that these PBDD congeners were also found in the sediment layers corresponding to the pre-industrial era, supporting their natural formation in the coastal environment.","grant":"Grants-in-Aid for Scientific Research (A) (No. 16H01784) from Japan Society for the Promotion of Science (JSPS) and by the Ministry of Education, Culture, Sports, Science and Technology, Japan (MEXT) to a project on Joint Usage/Research Center - Leading Academia in Marine and Environmental Research (LaMer)"},"PRA000108":{"id":"PRA000108","title":"Characterization of 209 polychlorinated biphenyls in street dust from northern Vietnam: Contamination status, potential sources, and risk assessment","releaseDate":"2020/11/13","doi":"10.1016/j.scitotenv.2018.10.240","author":"Shin Takahashi","affiliation":"Ehime University","abstract":"A full congener-specific determination of polychlorinated biphenyls (PCBs) was conducted for street dusts in some areas in northern Vietnam. Total 209 PCB concentrations (median and range) of 14 (2.2_120), 11 (6.6_32), and 0.25 (0.10_0.97) ng g−1 were measured in the street dusts from an industrial park, an urban area, and a rural commune, respectively, suggesting environmental loads of PCBs related to industrialization and urbanization in northern Vietnam. PCB patterns of street dusts from the industrial park were dominated by lightly chlorinated homologs (tri- and tetra-CBs), while more highly chlorinated homologs (penta- and hexa-CBs) were the major contributors to total PCBs in the urban samples, indicating different emission sources. Linear correlations of log-transformed sum of 7 indicator congeners with total PCBs and sum of dioxin-like PCBs were observed. PCB-11, an inadvertently produced congener of pigment manufacturing processes, was detected in all the samples with more elevated proportions in the urban and rural areas than industrial park. Our results have revealed complex emission sources of PCBs in the study areas, including both historical (e.g., the past usage of imported PCB-containing oils and old electric equipment) and current sources such as releases from industrial activities and increasing use of new consumer products. Occupationally exposed persons (e.g., street sweepers, street vendors, and traffic policemen) and children in the urban and industrial areas were estimated to receive much higher doses of dust-bound PCBs than general population, suggesting the need for appropriate protection conditions.","grant":"Grants-in-Aid for Scientific Research (B: 16H02963) of the Japan Society for the Promotion of Science (JSPS); the Environment Research and Technology Development Fund (SII-3-2) of the Environmental Restoration and Conservation Agency of Japan (ERCA); the Vietnam's National Foundation for Science and Technology Development (NAFOSTED) Grant number 104.04-2017.310"},"PRA000081":{"id":"PRA000081","title":"Release of chlorinated, brominated and mixed halogenated dioxin-related compounds to soils from open burning of e-waste in Agbogbloshie (Accra, Ghana)","releaseDate":"2018/11/30","doi":"10.1016/j.jhazmat.2015.09.062","author":"Shin Takahashi","affiliation":"Ehime University","abstract":"Although complex mixtures of dioxin-related compounds (DRCs) can be released from informal e-waste recycling, DRC contamination in African e-waste recycling sites has not been investigated. This study examined the concentrations of DRCs including chlorinated, brominated, mixed halogenated dibenzo-p-dioxins/dibenzofurans (PCDD/Fs, PBDD/Fs, PXDD/Fs) and dioxin-like polychlorinated biphenyls (DL- PCBs) in surface soil samples from the Agbogbloshie e-waste recycling site in Ghana. PCDD/F and PBDD/F concentrations in open burning areas (18_520 and 83_3800ng/g dry, respectively) were among the highest reported in soils from informal e-waste sites. The concentrations of PCDFs and PBDFs were higher than those of the respective dibenzo-p-dioxins, suggesting combustion and PBDE-containing plastics as principal sources. PXDFs were found as more abundant than PCDFs, and higher brominated analogues occurred at higher concentrations. The median total WHO toxic equivalent (TEQ) concentration in open burning soils was 7 times higher than the U.S. action level (1000 pg/g), with TEQ contributors in the order of PBDFs _ PCDD/Fs > PXDFs. DRC emission to soils over the e-waste site as of 2010 was estimated, from surface soil lightness based on the correlations between concentrations and lightness, at 200 mg (95% confidence interval 93_540 mg) WHO-TEQ over three years. People living in Agbogbloshie are potentially exposed to high levels of not only chlorinated but also brominated DRCs, and human health implications need to be assessed in future studies.","grant":"Partly supported by Grants-in-Aid for Scientific Research (A: 25257403) from the Japan Society for the Promotion of Science (JSPS) and the Environment Research; Technology Development Fund (3K153001) from the Japanese Ministry of the Environment; the award of a JSPS postdoctoral fellowship to N.M.T (P 13072)"},"PRA000033":{"id":"PRA000033","title":"Seasonal and Diurnal Variation of Organic Ultraviolet Filters from Personal Care Products Used Along the Japanese Coast","releaseDate":"2017/04/28","doi":"10.1007/s00244-014-0106-7","author":"Kenshi Sankoda","affiliation":"Prefectural University of Kumamoto","abstract":"This study aimed to investigate the behavior of organic ultraviolet (UV) filters released by recreational activities along the Japanese coastline. Seasonal variations of organic UV filters in seawater were investigated at four different recreational beaches (Mogushi, Wakamiya, Tsurugahama, and Otachimisaki beaches) in both summer (July through August) and winter (December). Moreover, short time scale diurnal changes were monitored at Otachimisaki beach in summer. Of the four sunscreen agents tested in this study, two agents - 2-ethylhexyl-4-methoxycinnamate (EHMC) and 2-ethylhexyl salicylate (EHS) - were detected in all samples, whereas octyl-dimethyl-p-aminobenzonic acid and 3-(4-methylbenzylidene)-camphor were lower than detection limits. In particular, EHMC, one of the most popular organic UV filters, was dominant. The highest concentration of EHMC was observed at 1,080 ng L<sup>-1</sup>, a level that exceeds those of previous studies. Both EHMC and EHS concentrations showed significant (p < 0.05) seasonal variations with advancing summer suggesting direct input from recreational activities. The subsequent examination showed short time scale diurnal changes of organic UV filters on the beach. The results showed that diurnal changes in EHMC concentrations were correlated to the number of bathers. EHMC concentrations increased during the afternoon and decreased during the night, although complete attenuation during the night did not occur. EHMC persists along the coast due to low mobility and may persist the next day. This is the first study to show the natural attenuation behavior of organic UV filters along recreational beaches.","grant":null},"PRA000089":{"id":"PRA000089","title":"[MOE_JP] The monitoring of agricultural chemicals in river water in FY2017  ( Source: <a href=https://www.env.go.jp/water/dojo/noyaku/zanryutaisaku.html target=_blank>FY2017 (H29) agrichemical monitoring report</a> )","releaseDate":"2019/05/31","doi":null,"author":"Open data","affiliation":"Ministry of the Environment","abstract":null,"grant":null},"PRA000014":{"id":"PRA000014","title":"Accumulation of endocrine disrupting chemicals (EDCs) in the polychaete Paraprionospio sp. from the Yodo River mouth, Osaka Bay, Japan","releaseDate":"2016/10/27","doi":"10.1007/s10661-013-3466-y","author":"Jiro Koyama","affiliation":"Kagoshima University","abstract":"This study presents the levels of endocrine disrupting chemicals (EDCs) accumulated by <i>Paraprionospio</i> sp. from the Yodo River mouth, Osaka Bay. Since high concentrations of nonylphenol (NP), bisphenol A (BP), octylphenol (OP), 17ß-estradiol (E2), and estrone (E1) have been measured in sediment from Osaka Bay, some bioaccumulation could be expected particularly in benthic animals. EDCs were analysed in <i>Paraprionospio</i> sp., a dominant benthic species in Osaka Bay. The results showed that <i>Paraprionospio</i> sp. had accumulated varying concentrations (wet weight; w.w.) of NP at 1,460-4,410 ng/g; BP at 22.5-39.6 ng/g; OP at 18.9-45.4 ng/g; E2 at 0.89-4.35 ng/g; and E1 at 0.06-2.50 ng/g. Accumulation of NP and OP were highest among the samples gathered in summer (July 2008), while concentrations of BP, E2, and E1 did not much differs within 3 years. EDC levels in <i>Paraprionospio</i> sp. were apparently greater than those in sediments showing bioaccumulation. ","grant":"The EXTEND 2010 Program, Ministry of Environment, Japan"},"PRA000118":{"id":"PRA000118","title":"[MOE_JP] The Initial Environmental Survey in FY2019 (Source: FY2020 Report of Chemicals in the Environment<a href=https://www.env.go.jp/chemi/kurohon/en/http2020e/index.html target=_blank> English </a>/<a href=https://www.env.go.jp/chemi/kurohon/2020/index.html target=_blank> Japanese </a>)","releaseDate":"2022/01/25","doi":null,"author":"Open data","affiliation":"Ministry of the Environment","abstract":null,"grant":null},"PRA000080":{"id":"PRA000080","title":"Spatial distribution of hexabromocyclododecanes (HBCDs), polybrominated diphenyl ethers (PBDEs) and organochlorines in bivalves from Japanese coastal waters","releaseDate":"2018/11/19","doi":"10.1016/j.chemosphere.2009.12.058","author":"Daisuke Ueno","affiliation":"Saga University","abstract":"In order to elucidate the spatial distribution of brominated flame retardants (BFRs) in the Japanese coastal environment, hexabromocyclododecanes (HBCDs), polybrominated diphenyl ethers (PBDEs) and organochlorines (OCs: PCBs, DDTs, CHLs, HCHs, HCB) were determined in bivalves (oysters and mussels) collected from Japanese coastal waters. HBCDs and PBDEs were detected in all samples analyzed. Concentration ranges of HBCDs were 12_5200 ng g<sup>-1</sup> lipid wt., followed by PCBs (20_3100 ng g<sup>−1</sup>) > PBDEs (3.1_86 ng g<sup>−1</sup> lipid wt.). The highest concentration of HBCDs was found in the Osaka region. This result indicates that HBCDs are ubiquitous and predominant compounds in bivalves from the Japanese coastal waters. Since no species differences between oysters and mussels were observed for the bioaccumulation properties of HBCDs and PBDEs, oysters could be utilized for BFR contamination monitoring worldwide as an alternative to mussels. Global comparisons between oysters and mussels showed that HBCD concentrations in Japan are among the highest levels reported from Asia and Europe. Estimated dietary exposures of HBCDs and PBDEs through seafood were 0.45_34 ng kg body weight<sup>−1</sup> d<sup>−1</sup>, and 0.054_6.8 ng kg body weight<sup>−1</sup> d<sup>−1</sup>, respectively. These exposure levels were more than 1000 times lower than the lowest observable effects or no observable adverse effects levels for HBCDs and PBDEs, respectively.","grant":"the Global Environment Research Fund (RF-0904) of the Ministry of the Environment, Japan; Grant-in-Aid for Young Scientists (B); KAKENHI (18780245 and 21710068); Promotion of Environmental Improvement for Independence of Young Researchers under the Special Coordination Funds for Promoting Science and Technology; the Global COE program from The Ministry of Education, Culture, Sports, Science and Technology (MEXT), Japan"},"PRA000034":{"id":"PRA000034","title":"Liquid chromatography-mass spectrometric analysis of p-cumylphenol and bisphenol A in environmental waters in Nagoya city","releaseDate":"2017/5/1","doi":"10.5985/jec.26.21","author":"Hitomi Hasegawa","affiliation":"Nagoya City Environmental Science Research Institute ","abstract":"A highly sensitive analytical method was developed for the determination of <i>para</i>-cumylphenol (PCP) and bisphenol A (BPA) by tandem liquid chromatography_mass spectrometry and was applied to the measurement of environmental water. The method detection limits of PCP and BPA for seawater were 2.2 ng/L and 1.9 ng/L, respectively, and the corresponding values for river water were 5.2 ng/L and 5.0 ng/L. Various water samples in Nagoya city were found to contain PCP and BPA at concentrations ranging from less than 5.2 to 160 ng/L and 33 to 290 ng/L, respectively.","grant":null},"PRA000091":{"id":"PRA000091","title":"[MOE_JP] The monitoring of agricultural chemicals in river water in FY2015 ( Source: <a href=https://www.env.go.jp/water/dojo/noyaku/zanryutaisaku.html target=_blank>FY2015 (H27) agrichemical monitoring report</a> )","releaseDate":"2019/06/05","doi":null,"author":"Open data","affiliation":"Ministry of the Environment","abstract":null,"grant":null},"PRA000055":{"id":"PRA000055","title":"Determination of preservative and antimicrobial compounds in fish from Manila Bay, Philippines using ultra high performance liquid chromatography tandem mass spectrometry, and assessment of human dietary exposure","releaseDate":"2017/12/18","doi":"10.1016/j.jhazmat.2011.07.006","author":"Shinsuke Tanabe","affiliation":"Ehime University","abstract":"Ultra high performance liquid chromatography_tandem mass spectrometry (LC_MS/MS) determination of four paraben preservatives (methyl, ethyl, propyl and butyl) and two antimicrobial agents (triclosan and triclocarban) belonging to personal care products (PCPs) in 20 species of fish from Manila Bay (Philippines) was performed. Detection of PCPs with greater frequency indicates the ubiquitous contamination of Manila Bay. Concentrations of total paraben were one order of magnitude higher than the antimicrobials in almost all fish, except in Stolephorus indicus and Leiognathus equulus. A positive correlation was observed between parabens concentration and fish length (r = 0.31_0.49; p < 0.05 to <0.001) and fish weight (r = 0.28_0.49; p < 0.05 to <0.001), but not for the antimicrobials. The estimated dietary exposure values of the four parabens in the Philippines through fish is four orders of magnitude lower than the acceptable daily intake (ADI) of 10 mg/kg/day, but the values of antimicrobials are just half of the ADI of TCS. To our knowledge, this is the first report of PCPs contamination in fish from Philippines.","grant":"Grants-in-Aid for Scientific Research (S: 20221003, B: 21310043); Global COE Program of the Japanese Ministry of Education, Science, Sports, Culture and Technology (MEXT) and Japan Society for the Promotion of Science (JSPS); partly supported by the Global Environment Research Fund (PF-0904) from the Ministry of the Environment and MEXT program (Promotion of Environmental Improvement for Indepen- dence of Young Researchers) under the Special Coordination Funds for Promoting Science and Technology"},"PRA000112":{"id":"PRA000112","title":"[MOE_JP] The Initial Environmental Survey in FY2018 (Source: FY2019 Report of Chemicals in the Environment<a href=https://www.env.go.jp/chemi/kurohon/en/http2019e/index.html target=_blank> English </a>/<a href=https://www.env.go.jp/chemi/kurohon/2019/index.html target=_blank> Japanese </a>)","releaseDate":"2020/12/21","doi":null,"author":"Open data","affiliation":"Ministry of the Environment","abstract":null,"grant":null},"PRA000121":{"id":"PRA000121","title":"Comprehensive characterization of halogenated flame retardants and organophosphate esters in settled dust from informal e-waste and end-of-life vehicle processing sites in Vietnam: Occurrence, source estimation, and risk assessment","releaseDate":"2022/07/20","doi":"10.1016/j.envpol.2022.119809","author":"Tatsuya Kunisue","affiliation":"Ehime University","abstract":"Information about the co-occurrence of halogenated flame retardants (HFRs) and organophosphate esters (OPEs) in the environment of informal waste processing areas is still limited, especially in emerging and developing countries. In this study, OPEs and HFRs including polybrominated diphenyl ethers (PBDEs), novel brominated flame retardants (NBFRs), and chlorinated flame retardants (CFRs) were determined in settled dust from Vietnamese e-waste recycling (WR) and vehicle processing (VP) workshops. Pollutant concentrations decreased in the order: OPEs (median 1500; range 230–410,000 ng/g) ≈ PBDEs (1200; 58–250,000) > NBFRs (140; not detected – 250,000) > CFRs (13; 0.39–2200). HFR and OPE levels in the WR workshops for e-waste and obsolete plastic were significantly higher than in the VP workshops. Decabromodiphenyl ether and decabromodiphenyl ethane are major HFRs, accounting for 60 ± 26% and 25 ± 29% of total HFRs, respectively. Triphenyl phosphate, tris(2-chloroisopropyl) phosphate, and tris(1,3-dichloroisopropyl) phosphate dominated the OPE profiles, accounting for 30 ± 25%, 25 ± 16%, and 24 ± 18% of total OPEs, respectively. The OPE profiles differed between WR and VP dust samples, implying different usage patterns of these substances in polymer materials for electric/electronic appliance and automotive industries. Human health risk related to dust-bound HFRs and OPEs in the study areas was low.","grant":"The Fund for the Promotion of Joint International Research (Fostering Joint International Research) (B: 18KK0300) from the Japan Society for the Promotion of Science (JSPS)"},"PRA000035":{"id":"PRA000035","title":"Perfluoroalkyl Substances (PFASs) in Marine Mammals from the South China Sea and Their Temporal Changes 2002-2014: Concern for Alternatives of PFOS?","releaseDate":"2017/06/30","doi":"10.1021/acs.est.5b06076","author":"Paul K.S. Lam","affiliation":"City University of Hong Kong","abstract":"Perfluorinated sulfonic acids (PFSAs) and perfluorinated carboxylic acids (PFCAs), as well as the replacement for the phase-out C8 PFSAs were determined in the liver samples of Indo-Pacific humpback dolphins (<i>Sousa chinensis</i>) and finless porpoises(<i>Neophocaena phocaenoides</i>) from the South China Sea between 2002 and 2014. Levels of total perfluoroalkyl substances (PFASs) in samples ranged from 136-15,300 and 30.5-2,720 ng/g dw for dolphin and porpoise, respectively. Significant increasing trends of several individual PFCAs and perfluorobutane sulfonate (PFBS) were found in cetacean samples from 2002 to 2014, whereas no significant temporal trends of ΣPFASs appeared over the sampling period. This pattern may be attributed to the increasing usage of PFCAs and C4-based PFSAs following the restriction/voluntary withdrawal of the production and use of perfluorooctane sulfonate (PFOS) related products. In addition, significantly increasing temporal shifting trends of PFOS to PFBS were observed in the dolphin liver samples. This pattern may be attributed to the substitution of PFOS by its alternative, PFBS. The highest levels of PFOS were observed in the liver samples of dolphin as compared with other marine mammal studies published since 2006, indicating high contamination of PFAS in the South China region. An assessment of relatively high concentrations of C8-based PFASs in the liver samples of cetaceans predicted that concentrations of PFOS would be expected to affect some proportion of the cetacean populations studied, based on the toxicity thresholds derived.","grant":"Environment and Conservation Fund (ECF Project 15/2012), the National Natural Science Foundation of China (NSFC No. 41206080; NSFC No. 41276111) and supported by the Hong Kong Research Grants Council (CityU 160613 and 11100614)"},"PRA000054":{"id":"PRA000054","title":"Profiles, sources and potential exposures of parent, chlorinated and brominated polycyclic aromatic hydrocarbons in haze associated atmosphere","releaseDate":"2017/12/06","doi":"10.1016/j.scitotenv.2017.03.134","author":"Minghui Zheng ","affiliation":"Chinese Academy of Sciences","abstract":"Profiles, sources and potential exposures of chlorinated and brominated polycyclic aromatic hydrocarbons (ClPAHs and BrPAHs) in haze associated atmosphere remain unclear. Haze events happened frequently during heating period in Beijing provided a typical urban context to investigate the concentrations, profiles, sources and potential exposures of ClPAHs, BrPAHs and their non-halogenated parent compounds (PAHs) in air samples. Average concentrations of PAHs, ClPAHs and BrPAHs during heating periods (with more frequent haze events) were about 3-9 times higher than during non-heating periods. Concentrations of particulate matter (PM)-associated ClPAHs and BrPAHs were higher in heating period than in non-heating period, while for gas-associated ClPAHs and BrPAHs, this distinction was not significant. Congener patterns and congener profiles indicated that with increasing coal combustion during the heating period, concentrations of PAHs and ClPAHs in air were elevated in comparison to the non-heating period. Inhalation of PM-associated PAHs, ClPAHs and BrPAHs accounted for higher exposure than inhalation of gas phase and dermal contact of both gas phase and particulate phase. In this study we found that the particulate phase is the dominant exposure pathway of atmospheric PAHs, ClPAHs and BrPAHs during haze days, which is different from previous studies.","grant":"National Natural Science Foundation of China (91543108, 21577148) and the Joint foundations from National Natural Science Foundation of China and United Nations Environment Programme (21361140359), State's Key Project of Research and Development Plan (2016YFC0202500), the Strategic Priority Research Program of the Chinese Academy of Sciences (XDB14020102) and the Youth Innovation Promotion Association of the Chinese Academy of Sciences (2016038)"},"PRA000068":{"id":"PRA000068","title":"[MOE_JP] The Environmental Monitoring in FY2015  (Source: FY2016 Report of Chemicals in the Environment<a href=https://www.env.go.jp/chemi/kurohon/en/http2016e/index.html target=\"_blank\"> English </a>/<a href=https://www.env.go.jp/chemi/kurohon/2016/index.html target=\"_blank\"> Japanese </a>)","releaseDate":"2018/05/11","doi":null,"author":"Open data","affiliation":"Ministry of the Environment","abstract":null,"grant":null},"PRA000079":{"id":"PRA000079","title":"Spatial distribution and vertical profile of polybrominated diphenyl ethers and hexabromocyclododecanes in sediment core from Tokyo Bay, Japan","releaseDate":"2018/11/08","doi":"10.1016/j.envpol.2006.12.011","author":"Shinsuke Tanabe","affiliation":"Ehime University","abstract":"Brominated flame retardants (BFRs), hexabromocyclododecanes (HBCDs) and polybrominated diethyl ethers (PBDEs) were detected in three sediment cores and six surface sediments of Tokyo Bay, Japan. HBCDs were detected for the first time in this region with concentrations ranging from 0.056 to 2.3 ng/g dry wt, implying their widespread contamination, even though their concentrations were lower than ΣPBDEs (di- to nona-BDEs) and BDE-209. Levels of these compounds were higher near to the highly populated industrial area of the bay implicating industrial and human activities as sources of these compounds. ΣPBDEs increased in the sediment layer up to the mid-1990s and decreased afterwards, whereas BDE-209 showed an increasing trend until now, following the usage of different commercial BDE mixtures. HBCDs first appeared in the mid-1970s and increased until today. The annual surficial flux of HBCDs (0.62-2.4 ng/cm<sup>2</sup>/yr) is equal to ΣPBDEs (0.95-2.6 ng/cm<sup>2</sup>/yr) but lower than that of BDE-209 (17-58 ng/cm<sup>2</sup>/yr).","grant":"The Global Environment Research Fund (RF-064); the Waste Management Research Grant (K1821) from the Ministry of the Environment, Japan; Scientific Research (Project No. 12308030) of Japan Society for the Promotion of Science (JSPS); Grant-in-Aid for Scientific Research (A) (No. 16201014); Grants-in-Aid for Scientific Research (B) (No. 18310046); 21st Century COE program of the Japanese Ministry of Education, Science, Sports, Culture and Technology"},"PRA000005":{"id":"PRA000005","title":"Dioxins and Related Compounds in Albatrosses from the Torishima Island, Japan: Accumulation Features by Growth Stage and Toxicological Implications","releaseDate":"2016/09/06","doi":"10.1021/es061153a","author":"Shinsuke Tanabe","affiliation":"Ehime University","abstract":"Concentrations of dioxins and related compounds (DRCs), such as polychlorinated dibenzo-p-dioxins (PCDDs), polychlorinated dibenzofurans (PCDFs), and coplanar polychlorinated biphenyls (Co-PCBs), were determined in eggs, nestlings, and adults of black-footed albatross (BfA; Diomedea nigripes) and short-tailed albatross (StA; Diomedea albatrus) collected from the Torishima Island in Japan during 2002, which is one of their breeding grounds. Observed DRC concenrations, especially PCDFs and non-ortho Co-PCBs, in eggs of BfA and StA were relatively higher than those in other oceanic, coastal, and inland wild birds reported recently and were comparable to those in a pooled BfA egg from Midway Atoll in 1993, implying continuous input of these contaminants into open ocean and possible albatross-specific exposure. Concentrations of PCDDs except 12378-P5CDD and high-chlorinated PCDFs in 3-month-old BfA nestling were lower than those in 1-month-old nestling, indicating their developmental dilution. On the other hand, higher levels of T4-H6CDFs and Co-PCBs, especially low-chlorinated congeners such as 2378-T4CDF and T4CB77, were found in 3-month-old BfA nestling, suggesting specific exposure to these contaminants, possibly due to their higher transportability than high-chlorinated congeners. Estimated biomagnification factors of almost all the congeners in adults were apparently greater than those in nestlings, except 2378-T4CDF, T4CB77, and H7-O8-CDD/Fs. This could be due to preferential metabolism of 2378-T4CDF and T4CB77 and lower uptake efficiency of high-chlorinated cogeners through the gastrointestinal tract in adults. Toxic equivalents in BfA and StA eggs estimated using WHO-avian toxic equivalency factors exceeded some toxicity thresholds for avian embryos, indicating possible adverse effects of DRCs to albatross embryos.","grant":"Grants-in-Aid for Scientific Research (A) (No. 16201014) from Japan Society for the Promotion of Science and 21st Century COE Program from the Ministry of Education, Culture, Sports, Science and Technology, Japan"},"PRA000093":{"id":"PRA000093","title":"[MOE_JP] The monitoring of agricultural chemicals in river water in FY2013 ( Source: <a href=https://www.env.go.jp/water/dojo/noyaku/zanryutaisaku.html target=_blank>FY2013 (H25) agrichemical monitoring report</a> )","releaseDate":"2019/06/20","doi":null,"author":"Open data","affiliation":"Ministry of the Environment","abstract":null,"grant":null},"PRA000019":{"id":"PRA000019","title":"Occurrence of Glucocorticoids discharged from a sewage treatment plant in Japan and the effects of clobetasol propionate exposure on the immune responses of common carp (<i>Cyprinus carpio</i>) to bacterial infection","releaseDate":"2016/12/16","doi":"10.1002/etc.3136","author":"Kei Nakayama","affiliation":"Ehime University","abstract":"The present study evaluated the environmental risks to common carp (<i>Cyprinus carpio</i>) posed by glucocorticoids present in sewage treatment plant (STP) effluent. To gather information on the seasonal variations in glucocorticoid concentration, the authors sampled the effluent of a Japanese STP every other week for 12 mo. Six of 9 selected glucocorticoids were detected in the effluent, with clobetasol propionate and betamethasone 17-valerate detected at the highest concentrations and frequencies.The present study's results indicated that effluent glucocorticoid concentration may depend on water temperature, which is closely related to the removal efficiency of the STP or to seasonal variations in the public's use of glucocorticoids. In a separate experiment, to clarify whether glucocorticoids in environmental water increase susceptibility to bacterial infection in fish, the authors examined the responses to bacterial infection (<i>Aeromonas veronii</i>) of common carp exposed to clobetasol propionate. Clobetasol propionate exposure did not affect bacterial infection-associated mortality. In fish infected with <i>A. veronii</i> but not exposed to clobetasol propionate, head kidney weight and number of leukocytes in the head kidney were significantly increased (p < 0.05), whereas these effects were not observed in infected fish exposed to clobetasol. This suggests that clobetasol propionate alleviated bacterial infection-associated inflammation. Together, these results indicate that susceptibility to bacterial infection in common carp is not affected by exposure to glucocorticoids at environmentally relevant concentrations.","grant":"a grant under the framework of EXTEND2010 from the Ministry of the Environment of Japan and by Grants-in-Aid for Scientific Research (26740030) from the Japanese Ministry of Education, Culture, Sports, Science and Technology and Japan Society for the Promotion of Science."},"PRA000087":{"id":"PRA000087","title":"Determination of estrogens and their conjugates in water using solid-phase extraction followed by liquid chromatography_tandem mass spectrometry","releaseDate":"2019/04/12","doi":"10.1016/S0021-9673(02)01851-4","author":"Tomohiko Isobe","affiliation":"National Institute for Environmental Studies","abstract":"An analytical procedure for the determination of steroid estrogens and their conjugates was developed and applied to aqueous environmental samples. The analytes of 15 compounds were solid-phase extracted and fractionated into two fractions: one containing unconjugated (free) steroids and the other containing conjugates (sulfates and glucuronides). Identification and quantification were carried out using liquid chromatography coupled with tandem mass spectrometry. The recoveries for each compound ranged from 57 to 116% and reproducibilities represented as RSD ranged from 2.9 to 17%. Some of the sulfates and free compounds were detected in environmental samples, whereas most of the conjugates were below the detection limits.","grant":null},"PRA000037":{"id":"PRA000037","title":"Determination of Hexabromocyclododecane Diastereoisomers and Tetrabromobisphenol A in Water and Sediment by Liquid Chromatography/Mass Spectrometry","releaseDate":"2017/05/26","doi":"10.2116/analsci.22.469","author":"Shigeru Suzuki","affiliation":"National Institute for Environmental Studies","abstract":"A method to determine α-, β- and γ-hexabromocyclododecane (HBCD) and tetrabromobisphenol A (TBBPA) in water and sediments was presented using solid phase extraction (SPE) and/or solvent extraction. Recoveries from sediments were approximately 100% for all the chemicals, while recoveries of α-,β- and γ-HBCDs from water were dependent on the extraction method. In the case of dichloromethane (CH2Cl2) extraction, recoveries of α-, β- and γ-HBCD from landfill leachates were 77%, 88% and 92%, respectively. Technical difficulties in HBCD measurement are discussed in terms of the physico-chemical properties of HBCD isomers. The method was applied to landfill samples and marine sediment.","grant":"Partially funded by the Ministry of the Environment of Japan to establish a comprehensive detection method for irregularly dumped wastes"},"PRA000090":{"id":"PRA000090","title":"[MOE_JP] The monitoring of agricultural chemicals in river water in FY2016 ( Source: <a href=https://www.env.go.jp/water/dojo/noyaku/zanryutaisaku.html target=_blank>FY2016 (H28) agrichemical monitoring report</a> )","releaseDate":"2019/06/04","doi":null,"author":"Open data","affiliation":"Ministry of the Environment","abstract":null,"grant":null},"PRA000010":{"id":"PRA000010","title":"Hydroxylated polychlorinated biphenyls (OH-PCBs) in the blood of mammals and birds from Japan: Lower chlorinated OH-PCBs and profiles","releaseDate":"2016/10/14","doi":"10.1016/j.chemosphere.2008.10.038","author":"Shinsuke Tanabe","affiliation":"Ehime University","abstract":"An analytical method was developed to measure tri- to octa-chlorinated OH-PCBs and pentachlorophenol (PCP) in the whole blood. Further, baseline data on the levels and profiles of these phenolic compounds in Japanese mammals (human, cat, dog, raccoon dog, and northern fur seal) and birds (black-tailed gull, common cormorant, and jungle crow) were obtained. Eighteen identifiable and fifty unknown peaks of OH-PCBs were detected and the major congeners identified were 4'OH-CB101/120, 4OH-CB107/4'OH-CB108, 4OH-CB146, 4OH-CB178, 4OH-CB187, 4'OH-CB172, 4OH-CB202, and 4'OH-CB199. Relatively higher concentrations of OH-PCBs were found in animal species than humans; OH-PCB levels in dog, raccoon dog, black-tailed gull, and common cormorant blood were one order of magnitude higher than in humans. Penta- to hepta-ch
