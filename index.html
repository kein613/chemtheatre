<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chemical Theatre — Environmental Monitoring Database</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#f4f5f7; --surface:#fff; --border:#e2e4e9;
  --text:#1a1d27; --muted:#6b7280;
  --accent:#1a4f6e; --accent2:#2980b9;
  --radius:8px;
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#10131c; --surface:#181c28; --border:#2a2f44; --text:#e4e6f0; --muted:#8890aa; --accent:#3a8bbf; --accent2:#5ba8d4; }
}
body { font-family:'Helvetica Neue',Arial,sans-serif; background:var(--bg); color:var(--text); font-size:14px; line-height:1.6; }

header { background:var(--accent); color:#fff; padding:1rem 1.5rem; display:flex; align-items:baseline; gap:1rem; }
header h1 { font-size:1.1rem; font-weight:700; letter-spacing:.02em; }
header p  { font-size:.78rem; opacity:.7; }

.layout { display:flex; height:calc(100vh - 52px); }

/* ── サイドバー ── */
.sidebar { width:230px; min-width:230px; background:var(--surface); border-right:1px solid var(--border); overflow-y:auto; }
.sidebar-label { font-size:.7rem; font-weight:600; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; padding:.9rem 1rem .4rem; }
.tree-item { display:block; }
.tree-row {
  display:flex; align-items:center; gap:.3rem;
  padding:.28rem .8rem;
  cursor:pointer; user-select:none;
  border-left:3px solid transparent;
  transition:background .1s;
  font-size:.82rem; line-height:1.3;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.tree-row:hover { background:var(--bg); }
.tree-row.active { border-left-color:var(--accent2); color:var(--accent2); font-weight:600; background:var(--bg); }
.tree-row.no-data { color:var(--muted); }
.toggle-btn { background:none; border:none; cursor:pointer; color:var(--muted); font-size:.7rem; width:14px; flex-shrink:0; transition:transform .15s; line-height:1; }
.toggle-btn.open { transform:rotate(90deg); }
.toggle-btn.leaf { visibility:hidden; }
.tree-children { display:none; }
.tree-children.open { display:block; }
.depth-0 .tree-row { padding-left:.8rem; font-weight:600; padding-top:.18rem; padding-bottom:.18rem; }
.depth-0.expanded > .tree-row { padding-top:.28rem; padding-bottom:.28rem; }
.depth-1 .tree-row { padding-left:1.6rem; }
.depth-2 .tree-row { padding-left:2.4rem; font-size:.79rem; }
.depth-3 .tree-row { padding-left:3.2rem; font-size:.77rem; }
.depth-4 .tree-row { padding-left:4rem; font-size:.75rem; }

/* ── メイン ── */
.main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.breadcrumb { font-size:.75rem; color:var(--muted); padding:.4rem 1.2rem; background:var(--bg); border-bottom:1px solid var(--border); min-height:28px; }
.breadcrumb span { color:var(--accent2); font-weight:600; }
.breadcrumb em { font-style:normal; font-size:.7rem; margin-left:.5rem; opacity:.7; }

/* ── 検索パネル ── */
.search-panel { background:var(--surface); border-bottom:1px solid var(--border); padding:.9rem 1.2rem; }
.search-grid { display:grid; grid-template-columns:2fr 1fr 1fr 1fr; gap:.6rem; }
.search-grid.full { grid-template-columns:2fr 1fr 1fr 1fr 1fr; }
@media(max-width:900px){ .search-grid,.search-grid.full { grid-template-columns:1fr 1fr; } }
.field label { display:block; font-size:.7rem; color:var(--muted); font-weight:500; margin-bottom:.25rem; }
.field input,.field select { width:100%; padding:.4rem .65rem; border:1px solid var(--border); border-radius:6px; background:var(--bg); color:var(--text); font-size:.85rem; outline:none; transition:border-color .15s; }
.field input:focus,.field select:focus { border-color:var(--accent2); }
.search-footer { display:flex; align-items:center; justify-content:space-between; margin-top:.6rem; }
.result-count { font-size:.8rem; color:var(--muted); }
.result-count strong { color:var(--accent2); }
.btn-reset { background:none; border:1px solid var(--border); color:var(--muted); padding:.3rem .8rem; border-radius:5px; font-size:.8rem; cursor:pointer; }
.btn-reset:hover { border-color:var(--muted); }
/* モード切替バッジ */
.mode-badge { font-size:.7rem; padding:.1rem .5rem; border-radius:999px; font-weight:600; }
.mode-summary  { background:#fef3c7; color:#92400e; }
.mode-full     { background:#d1fae5; color:#065f46; }
@media(prefers-color-scheme:dark){
  .mode-summary { background:#451a03; color:#fbbf24; }
  .mode-full    { background:#064e3b; color:#6ee7b7; }
}

/* ── テーブル ── */
.table-area { flex:1; overflow:auto; }
table { width:100%; border-collapse:collapse; white-space:nowrap; }
thead { position:sticky; top:0; background:var(--surface); border-bottom:2px solid var(--border); z-index:1; }
th { padding:.55rem .9rem; font-size:.7rem; font-weight:600; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; text-align:left; }
td { padding:.5rem .9rem; border-bottom:1px solid var(--border); font-size:.83rem; }
tbody tr { cursor:pointer; transition:background .1s; }
tbody tr:hover { background:var(--bg); }
tbody tr:last-child td { border-bottom:none; }
.no-data,.loading,.empty-state { text-align:center; padding:3rem; color:var(--muted); font-size:.9rem; }
.empty-state { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:.5rem; }

/* バッジ */
.badge { display:inline-block; padding:.1rem .5rem; border-radius:999px; font-size:.72rem; font-weight:600; }
.b-biotic  { background:#d1fae5; color:#065f46; }
.b-abiotic { background:#dbeafe; color:#1e40af; }
@media(prefers-color-scheme:dark){ .b-biotic{background:#064e3b;color:#6ee7b7;} .b-abiotic{background:#1e3a5f;color:#93c5fd;} }

/* ── モーダル ── */
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:100; align-items:center; justify-content:center; }
.modal-overlay.open { display:flex; }
.modal { background:var(--surface); border-radius:12px; width:min(680px,94vw); max-height:85vh; overflow-y:auto; padding:1.8rem 2rem; box-shadow:0 8px 32px rgba(0,0,0,.25); }
.modal-close { float:right; background:none; border:none; font-size:1.3rem; color:var(--muted); cursor:pointer; }
.modal h2 { font-size:1rem; font-weight:600; margin-bottom:1.2rem; padding-right:2rem; line-height:1.5; }
.modal-section { margin-bottom:1rem; }
.modal-section label { font-size:.72rem; font-weight:600; color:var(--muted); letter-spacing:.07em; text-transform:uppercase; display:block; margin-bottom:.3rem; }
.modal-section p { font-size:.85rem; line-height:1.7; }
.modal-section a { color:var(--accent2); text-decoration:none; }
.modal-grid { display:grid; grid-template-columns:1fr 1fr; gap:.8rem 1.5rem; margin-bottom:1.2rem; }
.modal-divider { border:none; border-top:1px solid var(--border); margin:1.2rem 0; }
</style>
</head>
<body>
<header>
  <h1>Chemical Theatre</h1>
  <p>Environmental Monitoring Database</p>
</header>

<div class="layout">
  <nav class="sidebar">
    <div class="sidebar-label">Chemical Group</div>
    <div id="group-tree"></div>
  </nav>

  <div class="main">
    <div class="breadcrumb" id="breadcrumb">← Select a chemical group</div>

    <div class="search-panel">
      <div class="search-grid" id="search-grid">
        <div class="field">
          <label>Chemical name / CAS</label>
          <input id="q-chem" type="text" placeholder="e.g. PCB-153, 71-43-2" oninput="applyFilter()">
        </div>
        <div class="field">
          <label>Region / Country</label>
          <input id="q-loc" type="text" placeholder="e.g. Japan, Pacific" oninput="applyFilter()">
        </div>
        <div class="field">
          <label id="label-type2">Sample type</label>
          <select id="q-type2" onchange="onType2Change()">
            <option value="">All</option>
          </select>
        </div>
        <div class="field" id="field-type3" style="display:none">
          <label>Sub-type</label>
          <select id="q-type3" onchange="onType3Change()">
            <option value="">All</option>
          </select>
        </div>
        <div class="field" id="field-type4" style="display:none">
          <label>Detail</label>
          <select id="q-type4" onchange="applyFilter()">
            <option value="">All</option>
          </select>
        </div>
        <div class="field">
          <label>Year</label>
          <select id="q-year" onchange="applyFilter()">
            <option value="">All years</option>
          </select>
        </div>
      </div>
      <div class="search-footer">
        <span class="result-count" id="result-count"></span>
        <div style="display:flex;align-items:center;gap:.6rem">
          <span class="mode-badge mode-summary" id="mode-badge" style="display:none"></span>
          <button class="btn-reset" onclick="resetFilter()">Reset</button>
        </div>
      </div>
    </div>

    <div class="table-area" id="table-area">
      <div class="empty-state"><p>← Select a chemical group to search</p></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeModalBtn()">×</button>
    <div id="modal-content"></div>
  </div>
</div>

<script>
// ── データ ──
let meta        = null;
let sampleTypes = [];
let projects    = {};
let currentRaw  = [];
let filtered    = [];
let activeGroupId  = null;
let activeRootId   = null;
let isSummaryMode  = false;
let activeFilter   = null; // サブグループIDセット

// sampletype マップ
const stMap = {};

// ── 初期化 ──
async function init() {
  [meta, sampleTypes] = await Promise.all([
    fetchJson('data/meta.json'),
    fetchJson('data/sampletype.json'),
  ]);
  const projArr = await fetchJson('data/projects.json');
  projArr.forEach(p => projects[p.id] = p);

  sampleTypes.forEach(st => stMap[st.id] = st);
  buildTree();
  checkHash();
}

async function fetchJson(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`Failed: ${url}`);
  return r.json();
}

// ── ツリー ──
function buildTree() {
  const el = document.getElementById('group-tree');
  el.innerHTML = '';
  meta.chemTree.forEach(node => el.appendChild(makeNode(node, 0)));
}

function makeNode(node, depth) {
  const hasChildren = node.children && node.children.length > 0;
  const rootId = meta.groupToRoot[node.id] || node.id;
  const isRoot = (node.id === rootId);
  const hasSummary = isRoot && meta.summarymap && meta.summarymap[node.id];
  const hasFull    = meta.filemap && meta.filemap[node.id];
  const dataExists = hasSummary || hasFull;

  const wrap = document.createElement('div');
  wrap.className = `tree-item depth-${depth}`;

  const row = document.createElement('div');
  row.className = 'tree-row' + (dataExists ? '' : ' no-data');
  row.dataset.id = node.id;

  const toggle = document.createElement('button');
  toggle.className = 'toggle-btn' + (hasChildren ? '' : ' leaf');
  toggle.textContent = '▶';
  toggle.onclick = e => { e.stopPropagation(); toggleChildren(wrap, toggle); };

  const label = document.createElement('span');
  label.textContent = node.label;

  row.appendChild(toggle);
  row.appendChild(label);
  row.onclick = () => selectGroup(node, row, rootId, isRoot);
  wrap.appendChild(row);

  if (hasChildren) {
    const children = document.createElement('div');
    children.className = 'tree-children';
    node.children.forEach(c => children.appendChild(makeNode(c, depth + 1)));
    wrap.appendChild(children);
  }
  return wrap;
}

function toggleChildren(wrap, btn) {
  const children = wrap.querySelector('.tree-children');
  if (!children) return;
  const isOpen = children.classList.toggle('open');
  btn.classList.toggle('open', isOpen);
  wrap.classList.toggle('expanded', isOpen);
}

// ── グループ選択 ──
async function selectGroup(node, rowEl, rootId, isRoot) {
  document.querySelectorAll('.tree-row.active').forEach(r => r.classList.remove('active'));
  rowEl.classList.add('active');

  const hasSummary = isRoot && meta.summarymap && meta.summarymap[node.id];
  const hasFull    = meta.filemap && meta.filemap[node.id];

  if (!hasSummary && !hasFull) {
    // 子を持つが自分はデータなし → サブ選択を促す
    document.getElementById('table-area').innerHTML =
      '<div class="no-data">Select a sub-group to view data.</div>';
    updateBreadcrumb(node, rootId, isRoot, null);
    return;
  }

  if (isRoot && hasSummary) {
    // ルートグループ → 要約版
    isSummaryMode = true;
    activeFilter  = null;
    updateBreadcrumb(node, rootId, isRoot, 'summary');
    if (activeRootId !== rootId) {
      showLoading();
      currentRaw   = await fetchJson(meta.summarymap[rootId].file);
      activeRootId = rootId;
      activeGroupId = rootId;
      buildYearFilter();
    }
  } else {
    // サブグループ → フル版
    isSummaryMode  = false;
    activeFilter   = collectDescendants(node);
    updateBreadcrumb(node, rootId, isRoot, 'full');

    // ルートのデータが変わる場合だけロード
    if (activeRootId !== rootId || activeGroupId === rootId) {
      showLoading();
      // サブグループのフルJSONを直接ロード
      if (hasFull) {
        currentRaw   = await fetchJson(meta.filemap[node.id].file);
        activeGroupId = node.id;
        activeRootId  = rootId;
      } else {
        // フルJSONがない（中間グループ）→ ルート要約から絞り込み
        if (activeRootId !== rootId) {
          currentRaw   = await fetchJson(meta.summarymap[rootId].file);
          activeRootId = rootId;
        }
        activeGroupId = node.id;
      }
      buildYearFilter();
    } else {
      activeGroupId = node.id;
    }
  }

  buildType2Filter();
  applyFilter();
}

function getRootLabel(rootId) {
  const found = meta.chemTree.find(n => n.id === rootId);
  return found ? found.label : rootId;
}

function collectDescendants(node) {
  const ids = new Set();
  function walk(n) { ids.add(n.id); n.children.forEach(walk); }
  walk(node);
  return ids;
}

function updateBreadcrumb(node, rootId, isRoot, mode) {
  const modeBadge = document.getElementById('mode-badge');
  if (mode === 'summary') {
    modeBadge.style.display = '';
    modeBadge.className = 'mode-badge mode-summary';
    modeBadge.textContent = 'Overview';
  } else if (mode === 'full') {
    modeBadge.style.display = '';
    modeBadge.className = 'mode-badge mode-full';
    modeBadge.textContent = 'Detail';
  } else {
    modeBadge.style.display = 'none';
  }

  const bc = document.getElementById('breadcrumb');
  if (isRoot) {
    bc.innerHTML = `<span>${node.label}</span>`;
  } else {
    bc.innerHTML = `${getRootLabel(rootId)} › <span>${node.label}</span>`;
  }
}

// ── フィルター ──
function buildType2Filter() {
  const sel = document.getElementById('q-type2');
  sel.innerHTML = '<option value="">All</option>';

  // 現在のデータにあるtype2を収集
  const type2Set = new Set(currentRaw.map(r => r.type2).filter(Boolean));
  const label = document.getElementById('label-type2');

  if (isSummaryMode) {
    label.textContent = 'Sample type';
    // type1とtype2をまとめて選択肢に（type1のみのものはtype1を表示）
    const type1Set = new Set(currentRaw.map(r => r.type1).filter(Boolean));
    type1Set.forEach(t1 => {
      const opt = document.createElement('option');
      opt.value = `__type1__${t1}`;
      opt.textContent = t1;
      sel.appendChild(opt);
    });
    if (type2Set.size > 0) {
      const sep = document.createElement('option');
      sep.disabled = true;
      sep.textContent = '──────';
      sel.appendChild(sep);
      [...type2Set].sort().forEach(t2 => {
        const opt = document.createElement('option');
        opt.value = t2; opt.textContent = `  ${t2}`;
        sel.appendChild(opt);
      });
    }
    document.getElementById('field-type3').style.display = 'none';
    document.getElementById('field-type4').style.display = 'none';
    document.getElementById('search-grid').className = 'search-grid';
  } else {
    label.textContent = 'Sample type';
    [...type2Set].sort().forEach(t2 => {
      const opt = document.createElement('option');
      opt.value = t2; opt.textContent = t2;
      sel.appendChild(opt);
    });
    document.getElementById('field-type3').style.display = '';
    document.getElementById('field-type4').style.display = '';
    document.getElementById('search-grid').className = 'search-grid full';
    buildType3Filter('');
  }
}

function onType2Change() {
  if (!isSummaryMode) {
    buildType3Filter(document.getElementById('q-type2').value);
  }
  applyFilter();
}

function buildType3Filter(type2) {
  const sel3 = document.getElementById('q-type3');
  sel3.innerHTML = '<option value="">All</option>';
  const type3Set = new Set(
    currentRaw
      .filter(r => !type2 || r.type2 === type2)
      .map(r => r.type3).filter(Boolean)
  );
  [...type3Set].sort().forEach(t3 => {
    const opt = document.createElement('option');
    opt.value = t3; opt.textContent = t3;
    sel3.appendChild(opt);
  });
  buildType4Filter(type2, '');
}

function onType3Change() {
  buildType4Filter(
    document.getElementById('q-type2').value,
    document.getElementById('q-type3').value
  );
  applyFilter();
}

function buildType4Filter(type2, type3) {
  const sel4 = document.getElementById('q-type4');
  sel4.innerHTML = '<option value="">All</option>';
  const type4Set = new Set(
    currentRaw
      .filter(r => (!type2 || r.type2 === type2) && (!type3 || r.type3 === type3))
      .map(r => r.type4).filter(Boolean)
  );
  [...type4Set].sort().forEach(t4 => {
    const opt = document.createElement('option');
    opt.value = t4; opt.textContent = t4;
    sel4.appendChild(opt);
  });
}

function buildYearFilter() {
  const years = [...new Set(currentRaw.map(r => r.year).filter(Boolean))].sort((a,b) => b-a);
  const sel = document.getElementById('q-year');
  const cur = sel.value;
  sel.innerHTML = '<option value="">All years</option>';
  years.forEach(y => { const o = document.createElement('option'); o.value=y; o.textContent=y; sel.appendChild(o); });
  if (cur) sel.value = cur;
}

function applyFilter() {
  if (!currentRaw.length) return;
  const qchem  = document.getElementById('q-chem').value.trim().toLowerCase();
  const qloc   = document.getElementById('q-loc').value.trim().toLowerCase();
  const qtype2 = document.getElementById('q-type2').value;
  const qtype3 = document.getElementById('q-type3').value;
  const qtype4 = document.getElementById('q-type4').value;
  const qyear  = document.getElementById('q-year').value;

  filtered = currentRaw.filter(r => {
    if (activeFilter && !activeFilter.has(r.gid)) return false;
    if (qchem) {
      const s = ((r.cname||'')+' '+(r.cas||'')).toLowerCase();
      if (!s.includes(qchem)) return false;
    }
    if (qloc) {
      const s = ((r.region||'')+' '+(r.country||'')).toLowerCase();
      if (!s.includes(qloc)) return false;
    }
    if (qtype2) {
      if (qtype2.startsWith('__type1__')) {
        const t1 = qtype2.replace('__type1__', '');
        if (r.type1 !== t1) return false;
      } else {
        if (r.type2 !== qtype2) return false;
      }
    }
    if (qtype3 && r.type3 !== qtype3) return false;
    if (qtype4 && r.type4 !== qtype4) return false;
    if (qyear && String(r.year) !== qyear) return false;
    return true;
  });

  document.getElementById('result-count').innerHTML =
    `<strong>${filtered.length.toLocaleString()}</strong> records`;
  renderTable(filtered.slice(0, 500));
}

function resetFilter() {
  ['q-chem','q-loc'].forEach(id => document.getElementById(id).value = '');
  ['q-type2','q-type3','q-type4','q-year'].forEach(id => document.getElementById(id).value = '');
  applyFilter();
}

// ── テーブル描画 ──
function showLoading() {
  document.getElementById('table-area').innerHTML = '<div class="loading">Loading…</div>';
}

function renderTable(records) {
  if (!records.length) {
    document.getElementById('table-area').innerHTML = '<div class="no-data">No records found.</div>';
    return;
  }

  const rows = records.map(r => {
    const badgeCls = r.type1 === 'Biotic' ? 'b-biotic' : 'b-abiotic';
    const type2Label = r.type2 || r.type1 || '—';
    const loc = [r.country, r.region].filter(Boolean).join(', ') || '—';
    const val = r.value != null
      ? `${Number(r.value).toPrecision(4)} ${r.unit||''}`
      : (r.altData || '—');
    const species = r.species || r.common || '—';

    return `<tr onclick="showDetail(${r.mid},'${r.pid}')">
      <td>${r.cname||'—'}</td>
      <td style="color:var(--muted);font-size:.78em">${r.cas||'—'}</td>
      <td><span class="badge ${badgeCls}">${type2Label}</span></td>
      <td style="max-width:150px;overflow:hidden;text-overflow:ellipsis" title="${r.species||''}">${species}</td>
      <td style="max-width:150px;overflow:hidden;text-overflow:ellipsis" title="${loc}">${loc}</td>
      <td>${r.year||'—'}</td>
      <td style="font-family:monospace;text-align:right">${val}</td>
    </tr>`;
  }).join('');

  const note = filtered.length > 500
    ? `<tr><td colspan="7" style="text-align:center;padding:.8rem;color:var(--muted);font-size:.8rem">
        Showing first 500 of ${filtered.length.toLocaleString()} — use filters to narrow down.
      </td></tr>` : '';

  document.getElementById('table-area').innerHTML = `
    <table>
      <thead><tr>
        <th>Chemical</th><th>CAS</th><th>Sample type</th>
        <th>Species</th><th>Location</th><th>Year</th><th>Value</th>
      </tr></thead>
      <tbody>${rows}${note}</tbody>
    </table>`;
}

// ── モーダル ──
async function showDetail(mid, pid, updateHash = true) {
  const rec  = (filtered.length ? filtered : currentRaw).find(r => r.mid === mid);
  if (updateHash && rec) history.pushState(null, '', '#sample/' + rec.sid);

  const proj = await fetchJson(`data/detail/${pid}.json`).catch(() => projects[pid] || {});
  const doi  = proj.doi ? `<a href="https://doi.org/${proj.doi}" target="_blank">${proj.doi}</a>` : '—';

  const st   = stMap[rec?.stype] || {};
  const loc  = [rec?.country, rec?.region].filter(Boolean).join(', ') || '—';
  const val  = rec?.value != null ? `${rec.value} ${rec.unit||''}` : (rec?.altData||'—');
  const stypeLabel = [st.type1, st.type2, st.type3, st.type4].filter(Boolean).join(' > ') || '—';

  document.getElementById('modal-content').innerHTML = `
    <h2>${proj.title||'Project detail'}
      ${rec ? `<button onclick="copySampleUrl('${rec.sid}',event)" title="Copy link"
        style="float:right;margin-left:.5rem;background:none;border:1px solid var(--border);
        border-radius:5px;padding:.15rem .5rem;cursor:pointer;font-size:.75rem;color:var(--muted)">🔗</button>` : ''}
    </h2>
    <div class="modal-grid">
      <div class="modal-section"><label>Author</label><p>${proj.author||'—'}</p></div>
      <div class="modal-section"><label>Affiliation</label><p>${proj.affiliation||'—'}</p></div>
      <div class="modal-section"><label>Release date</label><p>${proj.releaseDate||'—'}</p></div>
      <div class="modal-section"><label>DOI</label><p>${doi}</p></div>
    </div>
    <hr class="modal-divider">
    <div class="modal-grid">
      <div class="modal-section"><label>Chemical</label><p>${rec?.cname||'—'}${rec?.cas?' ('+rec.cas+')':''}</p></div>
      <div class="modal-section"><label>Sample type</label><p>${stypeLabel}</p></div>
      <div class="modal-section"><label>Species</label><p>${rec?.species||rec?.common||'—'}</p></div>
      <div class="modal-section"><label>Tissue</label><p>${rec?.tissue||'—'}</p></div>
      <div class="modal-section"><label>Location</label><p>${loc}</p></div>
      <div class="modal-section"><label>Year</label><p>${rec?.year||'—'}</p></div>
      <div class="modal-section"><label>Measured value</label><p style="font-family:monospace">${val}</p></div>
      <div class="modal-section"><label>Sex</label><p>${rec?.sex||'—'}</p></div>
    </div>
    ${proj.abstract ? `<div class="modal-section"><label>Abstract</label><p>${proj.abstract}</p></div>` : ''}
    ${proj.grant    ? `<div class="modal-section"><label>Grant</label><p style="font-size:.8em">${proj.grant}</p></div>` : ''}
  `;
  document.getElementById('modal-overlay').classList.add('open');
}

function copySampleUrl(sid, e) {
  e.stopPropagation();
  const url = location.origin + location.pathname + '#sample/' + sid;
  navigator.clipboard.writeText(url).then(() => {
    const btn = e.target;
    btn.textContent = '✓';
    setTimeout(() => btn.textContent = '🔗', 1200);
  });
}

function closeModalBtn() {
  history.pushState(null, '', location.pathname);
  document.getElementById('modal-overlay').classList.remove('open');
}
function closeModal(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModalBtn();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModalBtn(); });

// ── ハッシュ対応 ──
function parseSampleHash() {
  const m = location.hash.match(/^#sample\/(.+)$/);
  return m ? m[1] : null;
}
window.addEventListener('hashchange', () => {
  const sid = parseSampleHash();
  if (sid) openBySampleId(sid);
  else document.getElementById('modal-overlay').classList.remove('open');
});
async function openBySampleId(sid) {
  const sampleIndex = await fetchJson('data/sample_index.json').catch(() => ({}));
  const subGid = sampleIndex[sid];
  if (!subGid) return;
  const rootId = meta.groupToRoot[subGid] || subGid;
  if (activeRootId !== rootId) {
    if (meta.filemap[subGid]) {
      currentRaw   = await fetchJson(meta.filemap[subGid].file);
    } else if (meta.summarymap[rootId]) {
      currentRaw   = await fetchJson(meta.summarymap[rootId].file);
    }
    activeRootId  = rootId;
    activeGroupId = subGid;
    filtered = currentRaw;
  }
  const rec = currentRaw.find(r => r.sid === sid);
  if (rec) await showDetail(rec.mid, rec.pid, false);
}
function checkHash() {
  const sid = parseSampleHash();
  if (sid) openBySampleId(sid);
}

init();
</script>
</body>
</html>
